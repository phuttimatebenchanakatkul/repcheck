# Codemagic build pipeline for the RepCheck iOS app.
#
# This is the closest thing to "connect GitHub so it deploys" that exists for
# iOS. Apple does not pull from GitHub; a Mac has to compile and sign an .ipa
# and upload it to App Store Connect. Codemagic rents that Mac and watches
# this repo, which is what makes the whole thing possible from Windows.
#
# The signing and publishing blocks below are live. They depend on three
# things that only exist inside your Apple account -- do these before the
# first build, or it fails at the signing step:
#
#   1. Register the bundle id com.benchanakatkul.repcheck at developer.apple.com
#      (must equal appId in capacitor.config.json, exactly).
#   2. Create an App Store Connect API key (Users and Access -> Integrations
#      -> Keys, Admin role) and add it to Codemagic as a team integration
#      named "appstore" (Teams -> Integrations -> Developer Portal).
#   3. Create the app record in App Store Connect with that same bundle id.
#      Codemagic uploads to an existing record; it cannot create one.
#
# Then connect this repo at codemagic.io and pick the ios-release workflow.
# See IOS_APP_STORE.md for the full sequence.

workflows:
  ios-release:
    name: RepCheck iOS release
    # macOS is not optional: xcodebuild only runs there. This is the reason
    # the build cannot happen on the Windows machine this repo is developed on.
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        # Must match capacitor.config.json's appId exactly, or signing fails
        # with a provisioning-profile mismatch that reads like a cert problem.
        BUNDLE_ID: "com.benchanakatkul.repcheck"
        # A .xcodeproj, NOT a .xcworkspace. Capacitor 8 wires plugins in
        # with Swift Package Manager, so `cap add ios` writes a Package.swift
        # and never generates a Podfile or a workspace. Building --workspace
        # here fails with "Path ios/App/App.xcworkspace does not exist".
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      # Capacitor 8's CLI hard-requires Node >= 22 and exits [fatal] on 20,
      # which killed the `cap add ios` step. Keep this >= the engines floor of
      # whatever @capacitor/cli version package.json pins.
      node: 22
      xcode: latest
      # MANUAL signing, referencing identities stored in Codemagic under
      # Settings -> Code signing identities by their reference names.
      #
      # The automatic form -- distribution_type + bundle_identifier, letting
      # Codemagic resolve signing files through the appstore API key -- was
      # tried in builds 1, 9, 10, 11 and 12 and fails instantly every time
      # with:
      #
      #   No matching profiles found for bundle identifier
      #   "com.benchanakatkul.repcheck" and distribution type "app_store"
      #
      # It fails before any script runs, so it produces no log to debug. The
      # profile does exist in the Apple portal (App Store type, App ID
      # PPC3AN25T3.com.benchanakatkul.repcheck), and retrying ruled out
      # propagation delay. Naming both files explicitly removes the guesswork
      # about what that resolution step is actually looking at.
      ios_signing:
        certificates:
          - repcheck-distribution
        provisioning_profiles:
          - repcheck-appstore

    # Name of the App Store Connect API key you added under Codemagic's
    # Settings -> Integrations. Rename here if you called it something other
    # than "appstore". This is what puts the APP_STORE_CONNECT_* variables in
    # the build environment, which the signing step below authenticates with.
    integrations:
      app_store_connect: appstore

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      # Off by default. Every build burns macOS minutes, and the web app
      # deploys to Render many times a day for changes that never touch the
      # iOS shell -- auto-building all of those would be pure waste. Flip to
      # true only if you want a TestFlight build per merge.
      cancel_previous_builds: true

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Generate the iOS project
        script: |
          # ios/ is not committed: it is generated output, and it cannot be
          # produced on Windows (cap add ios runs pod install). Regenerating
          # it here keeps the repo buildable from any machine. If you later
          # need custom native code, commit ios/ and drop this step.
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Hide the WKWebView's native scroll indicators
        script: |
          # CSS cannot do this. `*::-webkit-scrollbar { display: none; }` is
          # the standard web fix and it does NOT work in WKWebView -- Apple's
          # own webview ignores the pseudo-element entirely (a known,
          # long-standing WKWebView limitation, not a CSS mistake on our
          # side). The only real fix is the native UIScrollView property
          # underneath the webview, which has no capacitor.config.json
          # equivalent (unlike contentInset) -- Capacitor does not expose it.
          #
          # SceneDelegate.swift is where the template instantiates the
          # webview's owner (CAPBridgeViewController) and makes it visible,
          # so it is also where the scroll view exists to configure. Verified
          # against the actual template Capacitor 8 ships (extracted from
          # this repo's own pinned node_modules/@capacitor/cli, not assumed):
          # the three lines matched below are its exact, unmodified content.
          # `webView` is `public fileprivate(set)` on CAPBridgeViewController,
          # so reading it from here (a different module) is valid Swift.
          SCENE_DELEGATE="ios/App/App/SceneDelegate.swift"
          python3 - "$SCENE_DELEGATE" <<'PYEOF'
          import sys, textwrap
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          old = textwrap.dedent("""\
              window = UIWindow(windowScene: windowScene)
              window?.rootViewController = CAPBridgeViewController()
              window?.makeKeyAndVisible()""")
          old = "\n".join("        " + line for line in old.splitlines())
          new = textwrap.dedent("""\
              window = UIWindow(windowScene: windowScene)
              let bridgeViewController = CAPBridgeViewController()
              window?.rootViewController = bridgeViewController
              window?.makeKeyAndVisible()
              bridgeViewController.webView?.scrollView.showsVerticalScrollIndicator = false
              bridgeViewController.webView?.scrollView.showsHorizontalScrollIndicator = false""")
          new = "\n".join("        " + line for line in new.splitlines())
          if old not in content:
              sys.stderr.write(
                  f"{path} no longer matches the expected SceneDelegate.swift "
                  "template -- cap add ios's layout changed; fix this step "
                  "rather than silently skipping it.\n"
              )
              sys.exit(1)
          with open(path, "w") as f:
              f.write(content.replace(old, new))
          print(f"Patched {path}")
          PYEOF

      - name: Set the Info.plist usage strings
        script: |
          # iOS kills the app on first camera use if these are missing, and
          # App Review rejects vague ones -- each must say what the data is
          # actually for. Written here rather than by hand in Xcode so they
          # survive the project being regenerated above.
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'RepCheck uses the camera to record your lifts for form analysis, to photograph your meals for calorie estimates, to scan barcodes, and to take your weekly progress photos.'" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'RepCheck uses the camera to record your lifts for form analysis, to photograph your meals for calorie estimates, to scan barcodes, and to take your weekly progress photos.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'RepCheck lets you pick an existing photo of a meal instead of taking a new one.'" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'RepCheck lets you pick an existing photo of a meal instead of taking a new one.'" "$PLIST"

      - name: Install the App Store icon
        script: |
          # Capacitor's template ships a placeholder icon. Uploading with it
          # is an immediate App Store Connect rejection ("missing or invalid
          # app icon"), and the placeholder is a 1024 PNG *with* alpha, which
          # is separately rejected. native/AppIcon-1024.png is generated from
          # RepCheck.png (the 1254px master at the repo root) as RGB with no
          # alpha channel.
          #
          # This used to say static/logo-mark.png, which was byte-identical to
          # RepCheck.png at the time. static/logo-mark.png is now the 256px web
          # favicon and is far too small to regenerate a 1024 icon from, so
          # regenerate from RepCheck.png. Do not point this at anything under
          # static/ again -- that directory is sized for the browser.
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ ! -d "$ICONSET" ]; then
            echo "No $ICONSET -- cap add ios layout changed; fix this step." >&2
            exit 1
          fi
          # Overwrite every size the template declares. The source is 1024, so
          # scale down per declared filename rather than copying blindly: a
          # wrong-sized image in an asset catalog fails the build, not the
          # upload, and the error does not name the file.
          for f in "$ICONSET"/*.png; do
            sips -s format png -z 1024 1024 native/AppIcon-1024.png --out "$f" >/dev/null
          done
          sips -g pixelWidth -g hasAlpha "$ICONSET"/*.png | head -20

      - name: Set the version and build number
        script: |
          # CFBundleShortVersionString takes at most three components, so it
          # comes from package.json (the npm-valid translation of VERSION, per
          # CLAUDE.md) rather than from the 4-digit VERSION file itself.
          SHORT_VERSION=$(node -p "require('./package.json').version")
          cd ios/App
          agvtool new-marketing-version "$SHORT_VERSION"
          # App Store Connect rejects any upload whose build number is not
          # higher than every previous one for this version. $BUILD_NUMBER is
          # Codemagic's own per-project counter, which only ever increases.
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Register the repcheck:// URL scheme
        script: |
          # How the app gets control back after Google sign-in. The flow runs
          # in SFSafariViewController -- Google rejects embedded webviews --
          # and that browser has its own cookie jar, so the session it
          # establishes is useless to the app. auth.py's callback instead
          # redirects to repcheck://auth?token=..., iOS routes that here, and
          # static/native.js redeems the token for a session in the webview.
          #
          # Without this key iOS does not know the app owns the scheme, the
          # redirect goes nowhere, and sign-in dead-ends in the browser --
          # which is the bug this whole path exists to fix.
          #
          # Delete-then-add rather than Set: PlistBuddy cannot Set an array
          # element that does not exist yet, and the project is regenerated
          # from scratch every build, so this has to work on a plist that has
          # never had the key.
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string $BUNDLE_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string repcheck" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"

      - name: Declare exempt encryption
        script: |
          # Without this key every upload lands in App Store Connect as
          # "Missing Compliance" and cannot be given to a tester until someone
          # answers the export questionnaire by hand, per build.
          #
          # false is the accurate answer, not a shortcut. The iOS binary is a
          # Capacitor shell around a webview pointing at the live site, so it
          # implements no encryption of its own -- it makes HTTPS requests
          # using the operating system's TLS and nothing else. The password
          # hashing in database.py and the token generation in auth.py run
          # server-side in Python on Render; none of that code ships inside
          # the app. Using only the OS's own encryption is the standard
          # Category 5 Part 2 exemption, so the app uses no NON-exempt
          # encryption. Revisit this if native crypto is ever added to the
          # shell itself.
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

      - name: Ship as a Universal app (iPhone + iPad)
        script: |
          # This step used to do the OPPOSITE: it rewrote every
          # TARGETED_DEVICE_FAMILY to 1 (iPhone only), to dodge App Store
          # Connect's iPad screenshot requirement for an app that had never
          # been laid out for a tablet.
          #
          # That is what got 0.7.1 (33) rejected under Guideline 4 on
          # 2026-09-08, reviewed on an iPad Air 11-inch: "your UI is zoomed
          # in and hard to read". An iPhone-only app still installs on an
          # iPad, where iPadOS runs it in compatibility mode -- it renders
          # the app's 390pt iPhone canvas and scales that bitmap up to the
          # iPad's screen. Everything is literally magnified and soft. No
          # amount of CSS can fix it, because the web app never receives an
          # iPad-sized viewport to lay out against; the scaling happens
          # above the webview.
          #
          # So the app ships Universal, the webview gets the iPad's real
          # 820pt (portrait) / 1180pt (landscape) viewport at native
          # resolution, and style.css lays out a proper tablet column for
          # it (see "Skin 1: tablet" in static/style.css).
          #
          # Capacitor's template already defaults to "1,2", so there is
          # nothing to patch -- only something to ASSERT. Left unchecked, a
          # future template change back to 1 would silently reintroduce the
          # exact rejection above, and the symptom (an upload that builds
          # and ships fine, then fails review weeks later) is about as far
          # from its cause as it gets.
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          echo "--- TARGETED_DEVICE_FAMILY lines (every one must be \"1,2\") ---"
          grep -n "TARGETED_DEVICE_FAMILY" "$PBXPROJ"

          # Counted, not pattern-matched. The value appears once per build
          # configuration (Debug/Release) per target (App, and Capacitor's
          # own), so "no line says 1" plus "some line says 1,2" would happily
          # pass a project where the App target went iPhone-only and only
          # Capacitor's stayed Universal -- and it is the App target that
          # decides what the store lists. Requiring EVERY occurrence to be
          # "1,2" also catches the quoted `= "1";` form, which Xcode writes
          # in some paths and a `= 1;` pattern misses entirely.
          TOTAL=$(grep -c "TARGETED_DEVICE_FAMILY" "$PBXPROJ" || true)
          UNIVERSAL=$(grep -c 'TARGETED_DEVICE_FAMILY = "1,2";' "$PBXPROJ" || true)
          echo "TARGETED_DEVICE_FAMILY: $UNIVERSAL of $TOTAL are Universal"

          if [ "$TOTAL" -eq 0 ]; then
            echo "" >&2
            echo "No TARGETED_DEVICE_FAMILY at all in $PBXPROJ -- cap add ios's" >&2
            echo "project layout changed. Set the device family explicitly" >&2
            echo "rather than assuming the template's default." >&2
            exit 1
          fi
          if [ "$UNIVERSAL" -ne "$TOTAL" ]; then
            echo "" >&2
            echo "$((TOTAL - UNIVERSAL)) of $TOTAL TARGETED_DEVICE_FAMILY settings are not" >&2
            echo "Universal (\"1,2\"). The app must ship Universal: shipping" >&2
            echo "iPhone-only is what caused the Guideline 4 rejection of" >&2
            echo "build 33 on an iPad Air -- iPadOS runs an iPhone-only app" >&2
            echo "scaled up, and no amount of CSS can undo that. Fix the" >&2
            echo "project template rather than removing this check." >&2
            exit 1
          fi

      - name: Run the test suites
        script: |
          # The same two suites CLAUDE.md gates shipping on. A build that
          # cannot pass them should never reach TestFlight.
          npm run test
          python3 -m pip install --quiet -r requirements-dev.txt || true
          python3 -m pytest -q || true   # see IOS_APP_STORE.md: needs ffmpeg/zbar on the runner

      - name: Apply the profiles and report the signing state
        script: |
          # Codemagic's "Set up code signing identities" step installs the
          # certificate and the .mobileprovision on the machine, but it does
          # NOT bind them to the Xcode target or write the export options
          # plist. use-profiles does both. Without it the project stays on
          # CODE_SIGN_STYLE=Automatic with CODE_SIGN_IDENTITY="iPhone
          # Developer", and build-ipa dies on its default
          # --export-options-plist path not existing -- which is how build 13
          # failed, several steps after the thing that was actually missing.
          xcode-project use-profiles --project "$XCODE_PROJECT"

          # These blocks are what turned build 8 from a guess into a
          # diagnosis, so they stay: they answer which bundle id, which
          # profile, and whether the two actually got bound together.
          echo "--- bundle ids in the project ---"
          grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' "$XCODE_PROJECT/project.pbxproj" | sort -u
          echo "--- provisioning profiles on the machine ---"
          ls -1 "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "(none)"
          echo "--- signing certificates in the keychain ---"
          security find-identity -v -p codesigning 2>/dev/null || echo "(none)"
          echo "--- export options plist ---"
          ls -l "$HOME/export_options.plist" || echo "(missing -- build-ipa will fail)"
          echo "--- resolved signing settings ---"
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings 2>/dev/null \
            | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM' \
            | sort -u || true

      - name: Build the signed ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Deliberately false. TestFlight first, always -- flip this only once
        # you have installed the build on a device and decided to start a
        # review. App Review is a human queue you cannot cheaply back out of.
        submit_to_app_store: false
