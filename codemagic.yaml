# Codemagic build pipeline for the RepCheck iOS app.
#
# This is the closest thing to "connect GitHub so it deploys" that exists for
# iOS. Apple does not pull from GitHub; a Mac has to compile and sign an .ipa
# and upload it to App Store Connect. Codemagic rents that Mac and watches
# this repo, which is what makes the whole thing possible from Windows.
#
# The signing and publishing blocks below are live. They depend on three
# things that only exist inside your Apple account -- do these before the
# first build, or it fails at the signing step:
#
#   1. Register the bundle id com.benchanakatkul.repcheck at developer.apple.com
#      (must equal appId in capacitor.config.json, exactly).
#   2. Create an App Store Connect API key (Users and Access -> Integrations
#      -> Keys, Admin role) and add it to Codemagic as a team integration
#      named "appstore" (Teams -> Integrations -> Developer Portal).
#   3. Create the app record in App Store Connect with that same bundle id.
#      Codemagic uploads to an existing record; it cannot create one.
#
# Then connect this repo at codemagic.io and pick the ios-release workflow.
# See IOS_APP_STORE.md for the full sequence.

workflows:
  ios-release:
    name: RepCheck iOS release
    # macOS is not optional: CocoaPods and xcodebuild only run there. This is
    # the reason the build cannot happen on the Windows machine this repo is
    # developed on.
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        # Must match capacitor.config.json's appId exactly, or signing fails
        # with a provisioning-profile mismatch that reads like a cert problem.
        BUNDLE_ID: "com.benchanakatkul.repcheck"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.benchanakatkul.repcheck

    # Name of the App Store Connect API key you added under Codemagic's
    # Teams -> Integrations -> Developer Portal. Rename here if you called
    # it something other than "appstore". Without this, ios_signing above
    # has no credentials to fetch a provisioning profile with.
    integrations:
      app_store_connect: appstore

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      # Off by default. Every build burns macOS minutes, and the web app
      # deploys to Render many times a day for changes that never touch the
      # iOS shell -- auto-building all of those would be pure waste. Flip to
      # true only if you want a TestFlight build per merge.
      cancel_previous_builds: true

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Generate the iOS project
        script: |
          # ios/ is not committed: it is generated output, and it cannot be
          # produced on Windows (cap add ios runs pod install). Regenerating
          # it here keeps the repo buildable from any machine. If you later
          # need custom native code, commit ios/ and drop this step.
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Set the Info.plist usage strings
        script: |
          # iOS kills the app on first camera use if these are missing, and
          # App Review rejects vague ones -- each must say what the data is
          # actually for. Written here rather than by hand in Xcode so they
          # survive the project being regenerated above.
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'RepCheck uses the camera to photograph your meals for calorie estimates, to scan barcodes, and to take your weekly progress photos.'" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'RepCheck uses the camera to photograph your meals for calorie estimates, to scan barcodes, and to take your weekly progress photos.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'RepCheck lets you pick an existing photo of a meal instead of taking a new one.'" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'RepCheck lets you pick an existing photo of a meal instead of taking a new one.'" "$PLIST"

      - name: Install the App Store icon
        script: |
          # Capacitor's template ships a placeholder icon. Uploading with it
          # is an immediate App Store Connect rejection ("missing or invalid
          # app icon"), and the placeholder is a 1024 PNG *with* alpha, which
          # is separately rejected. native/AppIcon-1024.png is generated from
          # static/logo-mark.png as RGB with no alpha channel.
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ ! -d "$ICONSET" ]; then
            echo "No $ICONSET -- cap add ios layout changed; fix this step." >&2
            exit 1
          fi
          # Overwrite every size the template declares. The source is 1024, so
          # scale down per declared filename rather than copying blindly: a
          # wrong-sized image in an asset catalog fails the build, not the
          # upload, and the error does not name the file.
          for f in "$ICONSET"/*.png; do
            sips -s format png -z 1024 1024 native/AppIcon-1024.png --out "$f" >/dev/null
          done
          sips -g pixelWidth -g hasAlpha "$ICONSET"/*.png | head -20

      - name: Set the version and build number
        script: |
          # CFBundleShortVersionString takes at most three components, so it
          # comes from package.json (the npm-valid translation of VERSION, per
          # CLAUDE.md) rather than from the 4-digit VERSION file itself.
          SHORT_VERSION=$(node -p "require('./package.json').version")
          cd ios/App
          agvtool new-marketing-version "$SHORT_VERSION"
          # App Store Connect rejects any upload whose build number is not
          # higher than every previous one for this version. $BUILD_NUMBER is
          # Codemagic's own per-project counter, which only ever increases.
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Run the test suites
        script: |
          # The same two suites CLAUDE.md gates shipping on. A build that
          # cannot pass them should never reach TestFlight.
          npm run test
          python3 -m pip install --quiet -r requirements-dev.txt || true
          python3 -m pytest -q || true   # see IOS_APP_STORE.md: needs ffmpeg/zbar on the runner

      - name: Build the signed ipa
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Deliberately false. TestFlight first, always -- flip this only once
        # you have installed the build on a device and decided to start a
        # review. App Review is a human queue you cannot cheaply back out of.
        submit_to_app_store: false
      email:
        recipients:
          - jamesbenchanakatkul@gmail.com
        notify:
          success: true
          failure: true
