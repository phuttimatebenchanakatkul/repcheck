<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RepCheck</title>
<!--
  Offline shell for the iOS app.

  The packaged app's webview loads the live site (server.url in
  capacitor.config.json), so this page is normally never seen. Capacitor
  still requires a webDir to exist and copies it into the app bundle, and
  it is what the webview falls back to when the device has no connection
  at launch. Better a RepCheck-branded "you're offline" than the webview's
  own error page, which looks like the app is broken.

  Deliberately self-contained: no fonts, no stylesheet, no scripts. It has
  to render with zero network.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: #f5f6f8;
    color: #101114;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0b0b0c; color: #f5f5f7; }
    .sub { color: #8e8e93; }
  }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  .sub { color: #6b6d78; font-size: 15px; margin: 0 0 24px; max-width: 34ch; }
  button {
    font: inherit; font-weight: 600;
    padding: 12px 22px; border: 0; border-radius: 12px;
    background: #101114; color: #fff; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { background: #f5f5f7; color: #101114; } }
</style>
<div>
  <h1>You're offline</h1>
  <p class="sub">RepCheck needs a connection to load your training. Reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</div>
