<!doctype html>
<html lang="en" class="auth-html">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RepCheck - Log in</title>
  <script>
    (function () {
      if (localStorage.getItem("repcheck_theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ asset_url('style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='logo-mark.png') }}">
  <link rel="stylesheet" href="{{ asset_url('auth.css') }}">
</head>
<body class="auth-body{% if error %} auth-has-error{% endif %}">
  <div class="auth-wrap">
    <img class="auth-logo" src="{{ url_for('static', filename='logo-full.png') }}" alt="RepCheck">

    <div class="auth-card">
      <h1 class="auth-heading">Welcome back</h1>
      <p class="auth-sub">Log in to your RepCheck account.</p>

      {% if error %}
        <div class="auth-error">{{ error }}</div>
      {% endif %}

      <a class="auth-oauth-btn auth-google-btn" data-google-signin href="{{ url_for('auth.google_login', next=next) if next else url_for('auth.google_login') }}">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.54 5.54 0 0 1-2.4 3.63v3h3.87c2.27-2.09 3.58-5.17 3.58-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.94-2.91l-3.87-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28v-3.1H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.38z"/><path fill="#EA4335" d="M12 4.75c1.76 0 3.34.6 4.58 1.79l3.44-3.44C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.27 6.62l4 3.1C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
        Continue with Google
        {% if not google_enabled %}<span class="auth-oauth-badge">setup needed</span>{% endif %}
      </a>

      <a class="auth-oauth-btn auth-apple-btn" data-apple-signin href="{{ url_for('auth.apple_login', next=next) if next else url_for('auth.apple_login') }}">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.05 12.54c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.71-3.19-1.73-1.36-.14-2.65.8-3.34.8-.69 0-1.75-.78-2.88-.76-1.48.02-2.85.86-3.61 2.18-1.54 2.67-.39 6.62 1.11 8.79.73 1.06 1.6 2.25 2.74 2.21 1.1-.04 1.52-.71 2.85-.71 1.33 0 1.71.71 2.87.69 1.19-.02 1.94-1.08 2.66-2.15.84-1.23 1.19-2.42 1.21-2.48-.03-.01-2.32-.89-2.34-3.53zM14.86 5.6c.61-.74 1.02-1.77.91-2.8-.88.04-1.94.59-2.57 1.32-.56.65-1.05 1.7-.92 2.7.98.08 1.98-.5 2.58-1.22z"/></svg>
        Continue with Apple
        {% if not apple_enabled %}<span class="auth-oauth-badge">setup needed</span>{% endif %}
      </a>

      <div class="auth-divider"><span>or</span></div>

      <form method="post" action="{{ url_for('auth.login') }}" class="auth-form">
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <div class="auth-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" value="{{ email or '' }}">
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="auth-submit-btn">Log in</button>
      </form>

      <div class="auth-switch">Don't have an account? <a href="{{ url_for('auth.signup_page', next=next) if next else url_for('auth.signup_page') }}">Sign up</a></div>
    </div>
  </div>
  <script src="{{ asset_url('auth_viewport.js') }}"></script>
  <script src="{{ asset_url('native.js') }}"></script>
  <script>
    // Inside the iOS shell neither OAuth button can be a plain link. Google
    // and Apple both refuse OAuth in an embedded webview, and Capacitor hands off-origin
    // navigations to Safari -- so tapping it used to complete sign-in in a
    // browser the app cannot read, leaving the user looking at the website
    // and still logged out in the app. RepCheckNative.signInWithGoogle runs
    // it in SFSafariViewController and brings a session back over the
    // repcheck:// scheme instead.
    //
    // In a browser signInWithGoogle returns false and the link is left
    // entirely alone, which is the behaviour that shipped before this.
    (function () {
      if (!window.RepCheckNative) return;
      var providers = [
        ['[data-google-signin]', window.RepCheckNative.signInWithGoogle],
        ['[data-apple-signin]', window.RepCheckNative.signInWithApple],
      ];
      providers.forEach(function (entry) {
        var button = document.querySelector(entry[0]);
        if (!button || typeof entry[1] !== 'function') return;
        button.addEventListener('click', function (event) {
          if (entry[1](button.getAttribute('href'))) {
            event.preventDefault();
          }
        });
      });
    })();
  </script>
</body>
</html>
