<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RepCheck - Welcome</title>
  <script>
    (function () {
      if (localStorage.getItem("repcheck_theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
    // Signup/login always redirect a brand-new account here before it ever
    // reaches home.html -- see app.py's home() route -- so this is always
    // a logged-in user, but account_sync.js still needs the flag set to
    // wire up its localStorage<->server sync (see that file's header).
    window.REPCHECK_LOGGED_IN = true;
    window.REPCHECK_USER_NAME = {{ (current_user.name.split(" ")[0] if current_user else "") | tojson }};
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ asset_url('style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='logo-mark.png') }}">
  <script src="{{ asset_url('account_sync.js') }}"></script>
  <script src="{{ asset_url('units.js') }}"></script>
  <script src="{{ asset_url('i18n.js') }}"></script>
  <script src="{{ asset_url('numeric_fields.js') }}"></script>
  <!-- This page doesn't extend base.html, so RepCheckStreak has to be
       pulled in by hand -- onboarding.js marks finishing setup as the
       first day of the new account's streak. -->
  <script src="{{ asset_url('streak.js') }}"></script>
  <style>
    body.ob-body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      padding: 24px 16px;
      /* Same fix as .auth-body in static/auth.css: with capacitor.config.json's
         contentInset now "never" (see that file), this page's own padding is
         the only thing keeping the logo and wizard clear of a notch/Dynamic
         Island above or the home indicator below -- a flat 24px was never
         safe-area-aware to begin with. env() is 0px on anything that isn't
         an Apple device with an inset, so max() changes nothing elsewhere. */
      padding-top: max(24px, env(safe-area-inset-top, 0px));
      padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
    }
    .ob-wrap { width: 100%; max-width: 560px; transition: max-width 0.15s ease; }
    .ob-wrap.is-wide { max-width: 660px; }
    .ob-logo { display: block; height: 32px; margin: 0 auto 22px; }
    .ob-card {
      background: var(--card-bg);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 32px 28px;
    }
    .ob-progress { display: flex; gap: 5px; margin-bottom: 26px; }
    .ob-progress-dot { flex: 1; height: 5px; border-radius: 999px; background: var(--border); transition: background 0.2s ease; }
    .ob-progress-dot.is-done { background: linear-gradient(90deg, var(--blue), #5b8def); }
    .ob-intro { text-align: center; padding: 10px 0 4px; }
    .ob-intro-title { font-size: 22px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.01em; }
    .ob-intro-sub { font-size: 14px; color: var(--text-secondary); line-height: 1.55; margin-bottom: 28px; }
    .ob-section-label {
      display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; color: var(--blue);
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 12px;
      background: var(--blue-bg); padding: 5px 11px; border-radius: 999px;
    }
    .ob-loading { text-align: center; padding: 60px 0; color: var(--text-secondary); font-size: 14px; }
    .ob-error { text-align: center; padding: 18px 0; color: var(--red); font-size: 14px; }

    /* ---------- Question heading shown at the top of every step ---------- */
    .ob-wizard-step-label {
      font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.01em;
      margin-bottom: 20px; line-height: 1.25;
    }

    /* ---------- Sub-question heading inside a combined screen -- the old
       per-screen question titles, demoted to section headings now that
       several questions share one screen (see STEPS in onboarding.js). ---------- */
    .ob-substep { margin-bottom: 26px; }
    /* :has(), not :last-of-type -- the shared actions row is appended as a
       sibling <div> after the substeps, so no .ob-substep is ever the last
       div of its type and :last-of-type would never match. The inner
       grid's own bottom margin must be zeroed too, or parent-child margin
       collapse reinstates the 22px gap this rule exists to remove. */
    .ob-substep:has(+ .ob-wizard-actions) { margin-bottom: 4px; }
    .ob-substep:has(+ .ob-wizard-actions) > .ob-choice-grid,
    .ob-substep:has(+ .ob-wizard-actions) > .ob-body-type-grid { margin-bottom: 0; }
    .ob-substep-label {
      font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: -0.01em;
      margin-bottom: 12px; line-height: 1.3;
    }

    /* ---------- Choice cards (aspiration/gender/activity/protein/diet/
       distribution) -- a single full-width stacked list, icon chip on the
       left so an option reads visually without needing the title text at
       all, title+sub on the right, a checkmark badge on selection. ---------- */
    .ob-choice-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
    .ob-choice-card {
      display: flex; align-items: center; gap: 14px; width: 100%;
      border: 1.5px solid var(--border); border-radius: 18px; padding: 14px 16px; cursor: pointer;
      background: var(--card-bg); text-align: left; font-family: inherit;
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }
    .ob-choice-card:hover { border-color: var(--blue); transform: translateY(-1px); }
    .ob-choice-card.is-selected {
      border-color: var(--blue);
      background: linear-gradient(135deg, var(--blue-bg), var(--card-bg));
      box-shadow: 0 4px 14px rgba(47, 102, 232, 0.18);
    }
    .ob-choice-icon {
      flex-shrink: 0; width: 44px; height: 44px; border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text-secondary);
      transition: background 0.15s ease, color 0.15s ease;
    }
    .ob-choice-icon svg { width: 22px; height: 22px; }
    .ob-choice-card.is-selected .ob-choice-icon { background: linear-gradient(135deg, var(--blue), #5b8def); color: #fff; }
    .ob-choice-text { flex: 1; min-width: 0; }
    .ob-choice-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .ob-choice-card.is-selected .ob-choice-title { color: var(--blue); }
    .ob-choice-sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; line-height: 1.35; }
    .ob-choice-check {
      flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
      background: var(--blue); color: #fff; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(0.5); transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .ob-choice-card.is-selected .ob-choice-check { opacity: 1; transform: scale(1); }

    /* ---------- Body type cards (already illustrated -- just modernized
       chrome, layout/icon generation unchanged) ---------- */
    .ob-body-type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
    .ob-body-type-card {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px;
      border: 1.5px solid var(--border); border-radius: 16px; padding: 14px 10px; cursor: pointer;
      background: var(--card-bg); color: var(--text); text-align: center; font-family: inherit;
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }
    .ob-body-type-card:hover { border-color: var(--blue); transform: translateY(-1px); }
    .ob-body-type-card.is-selected {
      border-color: var(--blue);
      background: linear-gradient(135deg, var(--blue-bg), var(--card-bg));
      box-shadow: 0 4px 14px rgba(47, 102, 232, 0.18);
    }
    .ob-body-type-check {
      position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), #5b8def); color: #fff;
      font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .ob-body-type-icon { display: flex; align-items: center; justify-content: center; }
    .ob-body-type-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; display: block; background: #ececef; }
    .ob-body-type-label { font-size: 13px; font-weight: 800; color: var(--text); }

    /* ---------- Weight / loss-rate fields ---------- */
    .ob-field { margin-bottom: 18px; }
    .ob-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
    .ob-field label span { color: var(--text); font-weight: 700; }
    .ob-field input {
      width: 100%; padding: 13px 15px; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text); border-radius: 14px; font-size: 16px; font-family: inherit;
      transition: border-color 0.15s ease;
    }
    .ob-field input:focus { outline: none; border-color: var(--blue); }
    .ob-field-hint { font-size: 12px; color: var(--text-secondary); margin-top: 8px; min-height: 14px; }

    /* ---------- Rate-of-change slider (custom, replaces native
       <input type="range">) -- see renderRateSlider() in onboarding.js.
       "Standard" zone highlighting/badge only ever applies to the loss
       direction; the gain slider renders the same track/thumb/readouts
       with no zone and no badge. ---------- */
    .ob-rate-field label { margin-bottom: 4px; }
    .ob-rate-badge {
      display: flex; justify-content: center; margin: 10px 0 18px;
      font-size: 12px; font-weight: 800; color: var(--text-secondary);
    }
    .ob-rate-badge:not(:empty) {
      padding: 7px 14px; border-radius: 999px; background: var(--border); width: fit-content; margin-left: auto; margin-right: auto;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .ob-rate-badge.is-standard { background: var(--green-bg); color: var(--green); }
    .ob-rate-slider {
      position: relative; height: 32px; margin: 0 4px 20px; cursor: pointer;
      touch-action: none; /* dragging is handled entirely via pointer events */
    }
    .ob-rate-slider-track {
      position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px;
      background: var(--border); border-radius: 999px;
    }
    .ob-rate-slider-zone {
      position: absolute; top: 0; bottom: 0; background: var(--green); border-radius: 999px; opacity: 0.5;
    }
    .ob-rate-slider-thumb {
      /* left is static (0) and never rewritten -- JS positions the thumb
         entirely via the inline `transform` it sets on every redraw (see
         renderRateSlider() in onboarding.js), which is compositor-only and
         doesn't trigger layout the way rewriting `left` on every drag
         pixel would. The drag-scale effect below is folded into that same
         inline transform string rather than a separate class rule, since
         an inline transform would otherwise silently win over (not
         combine with) a stylesheet transform on the same property. */
      position: absolute; top: 50%; left: 0; width: 26px; height: 26px; margin-top: -13px;
      border-radius: 50%; background: var(--text-secondary); border: 3px solid var(--card-bg);
      box-shadow: 0 2px 8px rgba(16, 17, 20, 0.25);
      transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
    }
    .ob-rate-slider-thumb.is-standard { background: #fff; border-color: var(--green); }
    .ob-rate-slider:focus-visible { outline: none; }
    .ob-rate-slider:focus-visible .ob-rate-slider-thumb { outline: 3px solid var(--blue); outline-offset: 2px; }
    .ob-rate-readout-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .ob-rate-readout-box {
      flex: 1; min-width: 0; display: flex; align-items: baseline; justify-content: space-between;
      padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 14px; background: var(--bg);
      font-size: 16px; font-weight: 700; color: var(--text);
    }
    .ob-rate-readout-unit { color: var(--text-secondary); font-size: 12px; font-weight: 600; margin-left: 6px; }
    .ob-rate-readout-verb { flex-shrink: 0; font-size: 14px; color: var(--text-secondary); font-weight: 600; }
    .ob-rate-readout-freq { flex-shrink: 0; width: 64px; text-align: right; font-size: 12px; color: var(--text-secondary); font-weight: 600; }
    /* Card treatment for the goal-date estimate -- collapses to nothing via
       :empty when there's no estimate yet, so the JS side only ever sets or
       clears textContent, same as every other hint in this step. */
    .ob-eta-card:not(:empty) {
      margin-top: 8px; padding: 12px 14px; border-radius: 14px; background: var(--green-bg); text-align: center;
      font-size: 16px; font-weight: 800; color: var(--green); letter-spacing: -0.01em;
    }
    .ob-eta-card:not(:empty)::after { content: attr(data-label); display: block; font-size: 11px; font-weight: 500; color: var(--text-secondary); margin-top: 3px; }

    /* ---------- Shared horizontal ruler (current weight + height) ----------
       Horizontal on purpose. As VERTICAL wheels these two were vertical
       scroll containers sitting across the middle of the screen, so a
       downward flick was consumed by the wheel and never reached the page:
       on a phone the Next button sat below the fold and could not be
       scrolled to at all, while the flick silently changed the value
       instead. A pan-x container cannot scroll vertically, so the browser
       hands every vertical gesture straight to the page. Same tick
       language and structure as the goal-weight ruler below (whole units,
       every 5th taller, every 10th labelled) -- all three number pickers
       in this wizard now share one gesture vocabulary. ---------- */
    .ob-hruler { display: flex; flex-direction: column; align-items: center; margin-bottom: 4px; }
    .ob-hruler-value { font-size: 34px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.01em; }
    .ob-hruler-window {
      position: relative;
      width: 100%;
      height: 58px;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
      mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
    }
    .ob-hruler-indicator {
      position: absolute; top: 4px; bottom: 4px; left: 50%; width: 14px; margin-left: -7px;
      border-left: 2.5px solid var(--blue); border-right: 2.5px solid var(--blue);
      background: var(--blue-bg); border-radius: 7px;
      pointer-events: none; z-index: 2;
    }
    .ob-hruler-scroll {
      height: 100%; overflow-x: scroll; overflow-y: hidden; scroll-snap-type: x mandatory;
      display: flex; align-items: flex-end;
      scrollbar-width: none;
      /* pan-x, never pan-y: this is what hands vertical flicks to the page. */
      touch-action: pan-x;
    }
    .ob-hruler-scroll::-webkit-scrollbar { display: none; }
    /* Half the window's width on each end so the first and last ticks can
       still reach the centre indicator. Set inline from the measured
       window width rather than hardcoded, since the window is fluid. */
    .ob-hruler-pad { flex: 0 0 auto; }
    .ob-hruler-col {
      flex: 0 0 14px; width: 14px; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      gap: 6px; scroll-snap-align: center;
    }
    .ob-hruler-collabel { font-size: 11px; font-weight: 700; color: var(--text-secondary); height: 14px; white-space: nowrap; }
    .ob-hruler-tick { width: 2px; height: 14px; background: var(--border); border-radius: 1px; }
    .ob-hruler-tick.is-mid { height: 20px; background: var(--text-secondary); }
    .ob-hruler-tick.is-major { height: 26px; background: var(--text-secondary); }
    .ob-hruler-scroll:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 10px; }

    /* ---------- Goal-weight ruler: the same flick-through wheel as the
       current-weight step above, laid out horizontally. Same tick
       language (whole kg, every 5th taller, every 10th labelled) so the
       two weight questions in this wizard are answered with one gesture
       vocabulary -- only the axis differs, because this one sits above a
       horizontal rate slider and reads as a slide bar alongside it.
       Ticks are whole kg regardless of display unit, exactly as the
       vertical ruler does. ---------- */
    .ob-goal-ruler { display: flex; flex-direction: column; align-items: center; margin-bottom: 4px; }
    .ob-goal-ruler-value { font-size: 34px; font-weight: 800; margin-bottom: 2px; letter-spacing: -0.01em; }
    .ob-goal-ruler-delta { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 10px; min-height: 16px; }
    .ob-goal-ruler-window {
      position: relative;
      width: 100%;
      height: 62px;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
      mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
    }
    .ob-goal-ruler-indicator {
      position: absolute; top: 6px; bottom: 6px; left: 50%; width: 14px; margin-left: -7px;
      border-left: 2.5px solid var(--blue); border-right: 2.5px solid var(--blue);
      background: var(--blue-bg); border-radius: 7px;
      pointer-events: none; z-index: 2;
    }
    .ob-goal-ruler-scroll {
      height: 100%; overflow-x: scroll; scroll-snap-type: x mandatory;
      display: flex; align-items: flex-end;
      scrollbar-width: none; touch-action: pan-x;
    }
    .ob-goal-ruler-scroll::-webkit-scrollbar { display: none; }
    /* Half the window's width on each end so the first and last ticks can
       still reach the centre indicator. Set inline from the measured
       window width rather than hardcoded, since the window is fluid. */
    .ob-goal-ruler-pad { flex: 0 0 auto; }
    .ob-goal-ruler-col {
      flex: 0 0 14px; width: 14px; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      gap: 6px; scroll-snap-align: center;
    }
    .ob-goal-ruler-collabel { font-size: 11px; font-weight: 700; color: var(--text-secondary); height: 14px; white-space: nowrap; }
    .ob-goal-ruler-tick { width: 2px; height: 14px; background: var(--border); border-radius: 1px; }
    .ob-goal-ruler-tick.is-mid { height: 20px; background: var(--text-secondary); }
    .ob-goal-ruler-tick.is-major { height: 26px; background: var(--text-secondary); }
    /* The bounds are stated, not just felt: without this the wheel simply
       refuses to travel past your current weight and looks broken. */
    .ob-goal-ruler-bounds {
      display: flex; justify-content: space-between; width: 100%;
      font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-top: 6px;
    }

    /* ---------- Result screen -- reuses the same icon-chip/gradient/pill
       language as the question steps (.ob-choice-*/.ob-section-label)
       instead of the plain text list this screen used to be. ---------- */
    .ob-result-hero { text-align: center; margin-bottom: 20px; }
    .ob-result-hero-icon {
      width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%;
      background: linear-gradient(135deg, var(--green), #29b87e); color: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .ob-result-hero-icon svg { width: 26px; height: 26px; }
    .ob-result-hero-title { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }

    /* Grouped by whitespace + the .ob-section-label pill, not its own
       boxed container -- avoids stacking a 3rd nested card inside
       .ob-card around .ob-macro-chip below. */
    .ob-result-section { margin-bottom: 26px; }
    .ob-result-calorie-icon {
      width: 44px; height: 44px; margin: 10px auto 8px; border-radius: 13px;
      background: linear-gradient(135deg, var(--blue), #5b8def); color: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .ob-result-calorie-icon svg { width: 22px; height: 22px; }
    .ob-result-calories { font-size: 44px; font-weight: 800; text-align: center; margin: 0 0 2px; letter-spacing: -0.02em; }
    .ob-result-label { text-align: center; color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }
    .ob-result-detail { font-size: 12px; color: var(--text-secondary); text-align: center; margin-top: -10px; margin-bottom: 4px; }
    .ob-macro-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .ob-macro-chip { background: var(--bg); border-radius: 14px; padding: 14px 8px; text-align: center; }
    .ob-macro-chip-icon {
      width: 32px; height: 32px; margin: 0 auto 8px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .ob-macro-chip-icon svg { width: 16px; height: 16px; }
    .ob-macro-icon-protein { background: var(--red-bg); color: var(--red); }
    .ob-macro-icon-fat { background: var(--amber-bg); color: var(--amber); }
    .ob-macro-icon-carbs { background: var(--green-bg); color: var(--green); }
    .ob-macro-chip-value { font-size: 16px; font-weight: 800; }
    .ob-macro-chip-label { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }

    /* ---------- Wizard nav buttons ----------
       Sticky so Next is reachable without hunting for it. The two choice
       screens are taller than a phone viewport, and a Next button parked
       below the fold is the thing users report as "I can't answer the next
       question". Sticky is inert on screens that already fit (nothing to
       scroll = nothing to stick to), so short screens look unchanged. The
       negative margins bleed the bar to the card's edges so scrolled
       content passes behind an opaque strip, not a floating island. */
    .ob-wizard-actions {
      display: flex; gap: 10px; margin-top: 4px;
      position: sticky; bottom: 0; z-index: 3;
      background: var(--card-bg);
      margin-left: -28px; margin-right: -28px; margin-bottom: -32px;
      padding: 10px 28px 32px;
      /* The bar is painted over the card's bottom edge, so it has to carry
         the card's own corner radius -- without this it squares off the two
         bottom corners while the top two stay rounded. */
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
    }

    /* ---------- "More below" scroll cue ----------
       The combined screens run past the fold, and because Next is stuck to
       the bottom of the viewport the screen looks finished when it isn't --
       users answer the visible question and tap Next without ever seeing
       the ones below. A fade above the bar plus a tappable pill say there
       is more. Both hang off body.ob-has-more, set by onboarding.js
       whenever the page still has somewhere left to scroll. */
    .ob-wizard-actions::before {
      content: "";
      position: absolute; left: 0; right: 0; bottom: 100%; height: 46px;
      pointer-events: none;
      background: linear-gradient(to top, var(--card-bg), rgba(0, 0, 0, 0));
      opacity: 0; transition: opacity 0.2s ease;
    }
    body.ob-has-more .ob-wizard-actions::before { opacity: 1; }
    .ob-scroll-cue {
      position: absolute; left: 50%; bottom: calc(100% + 6px);
      transform: translateX(-50%) translateY(4px);
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 13px; border-radius: 999px;
      border: 1.5px solid var(--border); background: var(--card-bg);
      color: var(--text-secondary); box-shadow: var(--shadow);
      font-family: inherit; font-size: 11.5px; font-weight: 700;
      white-space: nowrap; cursor: pointer;
      /* visibility, not opacity alone: an opacity-0 button is still in the
         tab order and still announced, so a keyboard or screen-reader user
         could land on an invisible "More questions below" on a screen where
         every question is already visible. visibility: hidden takes it out of
         the a11y tree and the tab order too. The 0.2s delay below applies only
         while hiding, so the pill still fades out instead of vanishing; the
         shown rule re-declares it at 0s so it appears instantly on the way in. */
      opacity: 0; pointer-events: none; visibility: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease, border-color 0.15s ease, color 0.15s ease, visibility 0s linear 0.2s;
    }
    body.ob-has-more .ob-scroll-cue {
      opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto;
      visibility: visible;
      transition: opacity 0.2s ease, transform 0.2s ease, border-color 0.15s ease, color 0.15s ease, visibility 0s;
    }
    .ob-scroll-cue:hover { border-color: var(--text-secondary); color: var(--text); }
    .ob-scroll-cue-arrow { display: inline-block; animation: ob-cue-bob 1.6s ease-in-out infinite; }
    @keyframes ob-cue-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(2px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ob-scroll-cue-arrow { animation: none; }
    }
    .ob-btn-primary, .ob-btn-secondary {
      flex: 1; padding: 14px; border-radius: 14px; font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit; border: none;
      transition: opacity 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }
    .ob-btn-primary {
      background: linear-gradient(135deg, #4d7ff5, var(--blue)); color: #fff;
      box-shadow: 0 6px 16px rgba(47, 102, 232, 0.3);
    }
    .ob-btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(47, 102, 232, 0.38); }
    .ob-btn-primary:active:not(:disabled) { transform: translateY(0); }
    .ob-btn-primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
    .ob-btn-secondary { background: var(--bg); border: 1.5px solid var(--border); color: var(--text); }
    .ob-btn-secondary:hover { border-color: var(--text-secondary); }

    @media (max-width: 480px) {
      .ob-body-type-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .ob-field input { font-size: 16px; } /* prevents iOS auto-zoom */
    }

    /* In the normal flow at the top of .ob-wrap, NOT position:fixed. A fixed
       pill sat on top of the card and covered whatever option happened to be
       under it once a step got tall enough to scroll (body/activity, diet). */
    .ob-logout-form { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .ob-logout-btn {
      padding: 8px 14px; border: 1.5px solid var(--border); border-radius: 999px;
      background: var(--card-bg); color: var(--text-secondary);
      font-size: 12px; font-weight: 700; font-family: inherit; cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .ob-logout-btn:hover { border-color: var(--text-secondary); color: var(--text); }
  </style>
</head>
<body class="ob-body">
  <div class="ob-wrap">
    <form method="post" action="{{ url_for('auth.logout') }}" class="ob-logout-form">
      <button type="submit" class="ob-logout-btn" data-i18n="sidebar.logout">Log out</button>
    </form>
    <img class="ob-logo" src="{{ url_for('static', filename='logo-full.png') }}" alt="RepCheck">
    <div class="ob-card">
      <div class="ob-progress" id="ob-progress"></div>
      <div id="ob-body"></div>
    </div>
  </div>
  <script src="{{ asset_url('onboarding.js') }}"></script>
</body>
</html>
