<script>
  const FOOD_LIBRARY = {{ food_library | tojson }};
  const FOOD_IMAGES = {{ food_images | tojson }};
  const STORAGE_KEY = "repcheck_nutrition_log_v1";
  const GOALS_KEY = "repcheck_nutrition_goals_v1";
  const WEEKDAY_LETTERS = ["M", "T", "W", "T", "F", "S", "S"];
  const HOURS = Array.from({ length: 24 }, (_, i) => i); // 0 -> 23 (midnight to 11 PM)
  const EXPANDED = new Set();
  const INGREDIENTS_EXPANDED = new Set(); // which composite dishes have their ingredients panel open (default minimized)

  const CHEVRON_ICON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;
  const TRASH_ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`;

  // All macros are always stored/computed in grams internally (matching
  // the library's per-100g/100mL convention). Unit selectors only affect
  // what's displayed and how a typed number is interpreted -- mL is
  // treated as 1:1 with grams (same water-density approximation the
  // library already uses for liquids), oz converts via the real factor.
  const UNIT_FACTORS = { g: 1, oz: 28.3495, ml: 1 };
  const UNIT_LABELS = { g: "g", oz: "oz", ml: "mL" };

  function gramsToUnit(grams, unit) {
    return Math.round((grams / UNIT_FACTORS[unit]) * 10) / 10;
  }
  function unitToGrams(value, unit) {
    return value * UNIT_FACTORS[unit];
  }
  function unitOptionsHtml(selected) {
    return Object.keys(UNIT_FACTORS)
      .map((u) => `<option value="${u}" ${u === selected ? "selected" : ""}>${UNIT_LABELS[u]}</option>`)
      .join("");
  }

  // Sane per-day bounds so goals can't be set to something physically
  // unrealistic (e.g. 4000g of carbs).
  const MACRO_BOUNDS = {
    protein: { min: 20, max: 400 },
    fat: { min: 15, max: 300 },
    carbs: { min: 20, max: 800 },
  };

  // Calories are always derived from protein/fat/carbs using the
  // standard 4 kcal/g (protein, carbs) and 9 kcal/g (fat) conversion, so
  // the calorie goal can never be inconsistent with the macro goals.
  function caloriesFromMacros({ protein, fat, carbs }) {
    return Math.round(protein * 4 + fat * 9 + carbs * 4);
  }

  function clamp(value, { min, max }, fallback) {
    const n = parseFloat(value);
    if (Number.isNaN(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  const DEFAULT_MACRO_GOALS = { protein: 150, fat: 65, carbs: 200 };
  const DEFAULT_GOALS = {
    ...DEFAULT_MACRO_GOALS,
    calories: caloriesFromMacros(DEFAULT_MACRO_GOALS),
  };

  function loadLog() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (err) { return {}; }
  }
  function saveLog() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
    // Lets the Personalized coaching card (a separate script, static/
    // coaching.js) know to redraw its "eaten today" bar chart immediately
    // instead of only picking up the change on the next full page load.
    document.dispatchEvent(new CustomEvent("repcheck:nutrition-log-updated"));
  }

  // Confirms a newly-added entry is durably saved server-side (see
  // POST /api/nutrition/log-entry in app.py) before the caller treats the
  // "Add to log" action as done. The generic account_sync.js blob sync
  // (which saveLog() above also triggers via the wrapped localStorage
  // .setItem) is fire-and-forget and re-sends the *whole* log on every
  // write -- good enough for most synced data, but it was letting
  // freshly-logged food quietly disappear if that write raced with the
  // user navigating away before it landed. This is awaited directly by
  // every "add to log" call site instead, with a visible error on
  // failure so a save never silently fails.
  async function persistLogEntry(dateIso, entry) {
    if (!window.REPCHECK_LOGGED_IN) return; // nothing to confirm — log-only-in-this-browser mode
    try {
      const response = await fetch("{{ url_for('api_nutrition_log_entry') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ date: dateIso, entry }),
      });
      const data = await response.json();
      if (!data.ok) throw new Error(data.error || "Save failed");
    } catch (err) {
      showLogSaveError();
    }
  }

  // Authoritative counterpart to persistLogEntry() above -- confirms a
  // removed entry is actually gone server-side too. Needed now that the
  // generic account_sync.js blob sync merges the nutrition log on the
  // server instead of overwriting it (see database.py's MERGE_LOG_KEYS,
  // added so a stale full-blob push can never silently erase entries the
  // server already had) -- a merge can only ever bring entries back, never
  // remove one, so a deletion needs this dedicated endpoint instead.
  async function persistRemoveLogEntry(dateIso, entryId) {
    if (!window.REPCHECK_LOGGED_IN) return;
    try {
      const response = await fetch("{{ url_for('api_nutrition_log_entry_delete') }}", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ date: dateIso, entry_id: entryId }),
      });
      const data = await response.json();
      if (!data.ok) throw new Error(data.error || "Delete failed");
    } catch (err) {
      showLogSaveError();
    }
  }

  function showLogSaveError() {
    const existing = document.querySelector(".nl-save-error-toast");
    if (existing) existing.remove();
    const toast = document.createElement("div");
    toast.className = "nl-save-error-toast";
    toast.textContent = RepCheckI18n.t("nutrition.log.saveError");
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 6000);
  }

  function loadGoals() {
    let merged;
    try {
      merged = { ...DEFAULT_GOALS, ...(JSON.parse(localStorage.getItem(GOALS_KEY)) || {}) };
    } catch (err) {
      merged = { ...DEFAULT_GOALS };
    }
    // Re-clamp and re-derive calories even for goals saved before this
    // validation existed, so a stale/inconsistent stored value can never
    // stick around.
    const protein = clamp(merged.protein, MACRO_BOUNDS.protein, DEFAULT_GOALS.protein);
    const fat = clamp(merged.fat, MACRO_BOUNDS.fat, DEFAULT_GOALS.fat);
    const carbs = clamp(merged.carbs, MACRO_BOUNDS.carbs, DEFAULT_GOALS.carbs);
    return { protein, fat, carbs, calories: caloriesFromMacros({ protein, fat, carbs }) };
  }

  let log = loadLog();
  let goals = loadGoals();
  // "remaining" (default) shows kcal left/over; "consumed" shows the raw
  // total eaten so far. Toggled by tapping the ring itself (nl-cal-ring-wrap)
  // -- not persisted, resets to "remaining" on reload.
  let calRingMode = "remaining";
  let pendingHour = null; // set when a specific hour row's "+" is clicked

  function foodByName(name) {
    return FOOD_LIBRARY.find((f) => f.name === name);
  }

  function iconForFood(name) {
    const n = name.toLowerCase();
    if (n.includes("pizza")) return "\u{1F355}";
    if (n.includes("cheeseburger") || n.includes("hamburger")) return "\u{1F354}";
    if (n.includes("fries")) return "\u{1F35F}";
    if (n.includes("taco")) return "\u{1F32E}";
    if (n.includes("burrito")) return "\u{1F32F}";
    if (n.includes("sushi")) return "\u{1F363}";
    if (n.includes("nugget") || n.includes("fried chicken")) return "\u{1F357}";
    if (n.includes("grilled cheese")) return "\u{1F9C0}";
    if (n.includes("caesar salad") || n.includes("salad")) return "\u{1F957}";
    if (n.includes("spaghetti") || n.includes("alfredo")) return "\u{1F35D}";
    if (n.includes("stir fry")) return "\u{1F958}";
    if (n.includes("pancake") || n.includes("waffle")) return "\u{1F95E}";
    if (n.includes("donut")) return "\u{1F369}";
    if (n.includes("cookie")) return "\u{1F36A}";
    if (n.includes("cake") || n.includes("muffin")) return "\u{1F9C1}";
    if (n.includes("ice cream")) return "\u{1F368}";
    if (n.includes("chips") || n.includes("pretzel") || n.includes("popcorn")) return "\u{1F37F}";
    if (n.includes("cheese") || n.includes("butter")) return "\u{1F9C0}";
    if (n.includes("milk") || n.includes("yogurt") || n.includes("cream")) return "\u{1F95B}";
    if (n.includes("egg")) return "\u{1F95A}";
    if (n.includes("chicken") || n.includes("turkey") || n.includes("duck")) return "\u{1F357}";
    if (n.includes("beef") || n.includes("steak") || n.includes("brisket") || n.includes("bacon") || n.includes("ham") || n.includes("sausage") || n.includes("pork")) return "\u{1F969}";
    if (n.includes("salmon") || n.includes("tuna") || n.includes("shrimp") || n.includes("cod") || n.includes("tilapia") || n.includes("halibut") || n.includes("crab") || n.includes("lobster") || n.includes("sardine") || n.includes("mahi")) return "\u{1F41F}";
    if (n.includes("rice") || n.includes("pasta") || n.includes("noodle") || n.includes("bread") || n.includes("oats") || n.includes("quinoa") || n.includes("couscous") || n.includes("barley") || n.includes("bulgur") || n.includes("farro") || n.includes("bagel") || n.includes("tortilla") || n.includes("pita") || n.includes("naan") || n.includes("croissant") || n.includes("cornbread") || n.includes("muffin")) return "\u{1F35A}";
    if (n.includes("banana") || n.includes("apple") || n.includes("orange") || n.includes("berr") || n.includes("grape") || n.includes("melon") || n.includes("pineapple") || n.includes("mango") || n.includes("peach") || n.includes("pear") || n.includes("kiwi") || n.includes("cherr") || n.includes("date") || n.includes("raisin")) return "\u{1F34E}";
    if (n.includes("almond") || n.includes("walnut") || n.includes("cashew") || n.includes("peanut") || n.includes("pistachio") || n.includes("pecan") || n.includes("sunflower") || n.includes("chia") || n.includes("flax")) return "\u{1F95C}";
    if (n.includes("broccoli") || n.includes("spinach") || n.includes("potato") || n.includes("avocado") || n.includes("carrot") || n.includes("cucumber") || n.includes("tomato") || n.includes("pepper") || n.includes("onion") || n.includes("garlic") || n.includes("zucchini") || n.includes("cauliflower") || n.includes("asparagus") || n.includes("cabbage") || n.includes("kale") || n.includes("mushroom") || n.includes("corn") || n.includes("beet")) return "\u{1F966}";
    if (n.includes("bean") || n.includes("lentil") || n.includes("tofu") || n.includes("tempeh") || n.includes("edamame")) return "\u{1F331}";
    if (n.includes("chocolate") || n.includes("honey") || n.includes("sugar") || n.includes("granola")) return "\u{1F36B}";
    if (n.includes("oil") || n.includes("mayo")) return "\u{1F9C8}";
    if (n.includes("protein powder")) return "\u{1F964}";
    return "\u{1F37D}️";
  }

  // Prefers a real sorted photo (see sort_food_images.py) over the emoji
  // fallback, whenever one exists for this exact food name.
  function foodIconHtml(name, photoClass) {
    const url = FOOD_IMAGES[name];
    if (url) {
      return `<img class="nl-food-photo ${photoClass}" src="${url}" alt="${name}">`;
    }
    return iconForFood(name);
  }

  function entryTotals(entry) {
    // Composite dishes (with a per-ingredient recipe): total = sum of
    // every ingredient's own scaled contribution. Simple foods: a single
    // amount scaling the food's own per-100g macros.
    if (entry.ingredients && entry.ingredients.length) {
      return entry.ingredients.reduce((acc, ing) => {
        const scale = ing.grams / 100;
        acc.calories += ing.baseCalories * scale;
        acc.carbs += ing.baseCarbs * scale;
        acc.fat += ing.baseFat * scale;
        acc.protein += ing.baseProtein * scale;
        acc.grams += ing.grams;
        return acc;
      }, { calories: 0, carbs: 0, fat: 0, protein: 0, grams: 0 });
    }
    const scale = entry.grams / 100;
    return {
      calories: entry.baseCalories * scale,
      carbs: entry.baseCarbs * scale,
      fat: entry.baseFat * scale,
      protein: entry.baseProtein * scale,
      grams: entry.grams,
    };
  }

  function scaledMacros(entry) {
    const t = entryTotals(entry);
    return {
      calories: Math.round(t.calories),
      carbs: Math.round(t.carbs),
      fat: Math.round(t.fat),
      protein: Math.round(t.protein),
    };
  }

  // ---------- Goals UI ----------
  // "Edit goals" (nutrition.totals.editGoals button, data-action=
  // "open-wizard") is wired up entirely by coaching.js's document-level
  // delegated click handler -- see openWizard()/wizardSave() there. It
  // dispatches "repcheck:goals-updated" on save, which the listener
  // below already re-reads goals from and re-renders on.

  function renderSummary() {
    const entries = log[selectedDate] || [];
    const totals = entries.reduce((acc, entry) => {
      const m = scaledMacros(entry);
      acc.calories += m.calories;
      acc.protein += m.protein;
      acc.fat += m.fat;
      acc.carbs += m.carbs;
      return acc;
    }, { calories: 0, protein: 0, fat: 0, carbs: 0 });

    document.getElementById("nl-protein-total").textContent = Math.round(totals.protein);
    document.getElementById("nl-fat-total").textContent = Math.round(totals.fat);
    document.getElementById("nl-carbs-total").textContent = Math.round(totals.carbs);
    document.getElementById("nl-protein-goal").textContent = goals.protein;
    document.getElementById("nl-fat-goal").textContent = goals.fat;
    document.getElementById("nl-carbs-goal").textContent = goals.carbs;

    const pct = (value, goal) => Math.max(0, Math.min(100, (value / goal) * 100 || 0));
    document.getElementById("nl-protein-fill").style.width = `${pct(totals.protein, goals.protein)}%`;
    document.getElementById("nl-fat-fill").style.width = `${pct(totals.fat, goals.fat)}%`;
    document.getElementById("nl-carbs-fill").style.width = `${pct(totals.carbs, goals.carbs)}%`;

    // Calorie ring -- "remaining" is the headline number (how much is
    // left to eat today), not a raw consumed/goal pair, since that's the
    // number people actually act on. It fills fully and switches to an
    // amber/red tone once the goal is exceeded, rather than trying to
    // draw the ring past 100%.
    const consumed = Math.round(totals.calories);
    const goal = goals.calories;
    const remaining = goal - consumed;
    const isOver = remaining < 0;
    const ringPct = goal > 0 ? Math.max(0, Math.min(1, consumed / goal)) : 0;
    const circumference = 2 * Math.PI * 52;
    const ringFillEl = document.getElementById("nl-cal-ring-fill");
    ringFillEl.style.strokeDasharray = `${circumference}`;
    ringFillEl.style.strokeDashoffset = `${circumference * (1 - ringPct)}`;
    ringFillEl.classList.toggle("is-over", isOver);
    if (calRingMode === "consumed") {
      document.getElementById("nl-cal-ring-value").textContent = consumed;
      document.getElementById("nl-cal-ring-label").textContent = RepCheckI18n.t("nutrition.totals.kcalConsumed");
    } else {
      document.getElementById("nl-cal-ring-value").textContent = Math.abs(remaining);
      document.getElementById("nl-cal-ring-label").textContent = RepCheckI18n.t(isOver ? "nutrition.totals.kcalOver" : "nutrition.totals.kcalLeft");

    document.getElementById("nl-cal-ring-sub").textContent = `${consumed} / ${goal}`;

  function getRecentFoods(limit) {
    const seen = new Set();
    const names = [];
    const entries = allLoggedEntries().sort((a, b) => b.addedAt - a.addedAt);
    for (const entry of entries) {
      if (!seen.has(entry.food)) {
        seen.add(entry.food);
        names.push(entry.food);
      }
      if (names.length >= limit) break;
    }
    return names;
  }

  // "Top picks" for an hour are foods the user genuinely tends to eat
  // AROUND that time -- not just anything logged there once. A food only
  // qualifies if it was logged in this hour's window on at least
  // TOP_PICK_MIN_DAYS *different days*, so a one-off (a snack logged at
  // 3pm a single time) never shows up, while a real habit (coffee every
  // morning, the same lunch most weekdays) does. The window is the target
  // hour ±1 so "my usual 8am breakfast" still counts when it's logged at
  // 7:50 one day and 8:15 the next, instead of splitting across exact
  // clock hours. Ranked by how many distinct days it recurs on.
  const TOP_PICK_MIN_DAYS = 2;
  function getTopPicksForHour(hour, limit) {
    const daysByFood = new Map(); // food -> Set of "YYYY-MM-DD" it was logged near this hour
    for (const entry of allLoggedEntries()) {
      const when = new Date(entry.addedAt);
      let hourDiff = Math.abs(when.getHours() - hour);
      if (hourDiff > 12) hourDiff = 24 - hourDiff; // wrap around midnight (23 vs 0 = 1 apart)
      if (hourDiff > 1) continue;
      if (!daysByFood.has(entry.food)) daysByFood.set(entry.food, new Set());
      daysByFood.get(entry.food).add(toIsoDate(when));
    }
    return Array.from(daysByFood.entries())
      .filter(([, days]) => days.size >= TOP_PICK_MIN_DAYS)
      .sort((a, b) => b[1].size - a[1].size)
      .slice(0, limit)
      .map(([name]) => name);
  }

  // Re-logs a past scanned entry at the current moment, on the currently
  // selected day — same ingredient breakdown, fresh id/timestamp, so it's
  // independently editable from the original without touching it.
  async function relogEntry(original) {
    const dateForEntry = selectedDate;
    if (!log[dateForEntry]) log[dateForEntry] = [];
    const id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
    const now = new Date();
    const addedAt = new Date(dateForEntry + "T00:00:00");
    addedAt.setHours(now.getHours(), now.getMinutes(), now.getSeconds(), 0);
    const clone = { id, food: original.food, addedAt: addedAt.getTime(), source: "scan" };
    if (original.ingredients) {
      clone.ingredients = original.ingredients.map((ing) => ({ ...ing }));
    } else {
      Object.assign(clone, {
        grams: original.grams, unit: original.unit,
        baseCalories: original.baseCalories, baseCarbs: original.baseCarbs,
        baseFat: original.baseFat, baseProtein: original.baseProtein,
      });
    }
    log[dateForEntry].push(clone);
    saveLog();
    renderTimeline();
    renderSummary();
    closeAnalyzeFoodModal();
    await persistLogEntry(dateForEntry, clone);
  }

  // ---------- Live in-app barcode scanning (no photo upload needed) ----------
  // getUserMedia (needed for a live camera feed) only works in a "secure
  // context" (HTTPS, or plain HTTP on localhost) -- the deployed site is
  // real HTTPS, so this works there; the try/catch below falls back to
  // the photo-capture flow automatically anywhere it doesn't (plain-HTTP
  // LAN testing, no BarcodeDetector support, camera permission denied).
  // A live feed is what actually fixes "scanning is hit or miss": it
  // keeps trying frames continuously until one decodes cleanly, instead
  // of a single static photo living or dying on one shot's focus/angle/
  // glare with no automatic retry.
  let barcodeLiveStream = null;
  let barcodeLiveRafId = null;

  async function startLiveBarcodeScan() {
    if (!("BarcodeDetector" in window)) {
      document.getElementById("af-barcode-input").click();
      return;
    }
    try {
      barcodeLiveStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    } catch (err) {
      // Camera denied, unavailable, or (most commonly here) blocked
      // because the page isn't a secure context -- the photo-capture
      // flow still works everywhere, so just fall back to it silently.
      document.getElementById("af-barcode-input").click();
      return;
    }

    afModalBody.innerHTML = `
      <div class="af-scanner-wrap">
        <video id="af-scanner-video" class="af-scanner-video" autoplay playsinline muted></video>
        <div class="af-scanner-frame"></div>
        <div class="af-scanner-hint">Point the camera at a barcode</div>
      </div>
      <div class="af-actions">
        <button type="button" class="af-secondary-btn" id="af-scanner-cancel-btn" style="flex:1;">Cancel</button>
      </div>
    `;
    const video = document.getElementById("af-scanner-video");
    video.srcObject = barcodeLiveStream;
    document.getElementById("af-scanner-cancel-btn").addEventListener("click", () => {
      stopLiveBarcodeScan();
      renderAfChoice();
    });

    const detector = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e"] });
    const tick = async () => {
      if (!barcodeLiveStream) return;
      try {
        const codes = await detector.detect(video);
        if (codes.length) {
          const value = codes[0].rawValue;
          stopLiveBarcodeScan();
          lookupScannedBarcode(value);
          return;
        }
      } catch (err) { // transient decode failure — keep scanning
      }
      barcodeLiveRafId = requestAnimationFrame(tick);
    };
    barcodeLiveRafId = requestAnimationFrame(tick);
  }

  function stopLiveBarcodeScan() {
    if (barcodeLiveRafId) cancelAnimationFrame(barcodeLiveRafId);
    barcodeLiveRafId = null;
    if (barcodeLiveStream) barcodeLiveStream.getTracks().forEach((track) => track.stop());
    barcodeLiveStream = null;
  }

  async function lookupScannedBarcode(barcode) {
    barcode = sanitizeBarcodeDigits(barcode);
    afPreviewUrl = null; // no photo for a live scan — renderAfResult/loading skip the <img> when this is null
    afModalBody.innerHTML = `
      <div class="af-loading">
        <div class="af-loading-spinner"></div>
        Looking up ${barcode}...
      </div>
    `;
    try {
      const response = await fetch("{{ url_for('api_lookup_barcode') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ barcode }),
      });
      const data = await response.json();
      if (!data.ok && data.not_found && data.barcode) {
        // No product anywhere (Open Food Facts, FatSecret, or this user's
        // own custom foods) has this barcode -- instead of a dead end,
        // let the user create it themselves, saved to their account so
        // scanning it again always resolves straight to it.
        renderAfCreateForm(false, data.barcode);
        return;
      }
      if (!data.ok) throw new Error(data.error || "Couldn't find that product.");
      afResult = data;
      renderAfResult(data);
    } catch (err) {
      afModalBody.innerHTML = `
        <div class="af-error">${(err.message || "Couldn't find that product.").replace(/</g, "&lt;")}</div>
        <div class="af-actions">
          <button type="button" class="nl-save-goals-btn" id="af-retry-btn" style="flex:1;">Try again</button>
        </div>
      `;
      document.getElementById("af-retry-btn").addEventListener("click", renderAfChoice);
    }
  }

  // Grams-per-unit for the amount editor below. "serving" isn't fixed —
  // it's whatever grams the scan itself reported as one serving/portion
  // (the label's serving size for a barcode scan, or the estimated
  // portion size for an AI photo scan), set fresh per result in
  // renderAfResult().
  const OZ_TO_GRAMS = 28.3495;
  // afBaseServingGrams is fixed per result: the gram amount result.calories/
  // protein/fat/carbs actually correspond to (sum of all ingredients — 1
  // item for a barcode/single-food scan, several for a multi-ingredient
  // dish). Every scale calculation below divides by THIS, never by
  // afServingGrams, so it stays correct no matter what afServingGrams is
  // currently set to.
  //
  // afServingGrams is how many grams "1 serving" (the amount-editor unit)
  // means right now -- normally equal to afBaseServingGrams, but a custom
  // food with multiple named serving sizes (see the af-serving-select
  // listener in renderAfResult below) can repoint it at a different size
  // (e.g. "1 box" = 270g instead of "1 bar" = 45g) without changing what
  // the underlying macros are per gram.
  let afBaseServingGrams = 100;
  let afServingGrams = 100;
  let afUnit = "serving";
  let afAmountValue = 1;

  function gramsPerAfUnit(unit) {
    if (unit === "g") return 1;
    if (unit === "oz") return OZ_TO_GRAMS;
    return afServingGrams; // "serving"
  }

  function currentAfGrams() {
    return Math.max(0, afAmountValue * gramsPerAfUnit(afUnit));
  }

  function renderAfResult(result) {
    const nowHour = new Date().getHours();
    afBaseServingGrams = result.ingredients.reduce((sum, ing) => sum + ing.grams, 0) || 100;
    afServingGrams = afBaseServingGrams;
    afUnit = "serving";
    afAmountValue = 1;

    // "high" gets the reassuring green badge; anything less confident gets
    // a softer amber one, so uncertainty reads as a gentle heads-up rather
    // than a warning.
    const sureBadge = String(result.confidence || "").toLowerCase() === "high";
    const badgeCheck = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    const pencilIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;

    afModalBody.innerHTML = `
      ${afPreviewUrl ? `
        <div class="af-hero af-rise">
          <img class="af-hero-photo" src="${afPreviewUrl}" alt="">
          <div class="af-hero-badge ${sureBadge ? "" : "is-unsure"}">${badgeCheck}${result.confidence} confidence</div>
        </div>
      ` : ""}
      <div class="af-title-wrap af-rise" style="--d:60ms;">
        <input type="text" class="af-title-input" id="af-food-name" maxlength="40" value="${result.food_name.replace(/"/g, "&quot;")}">
        <span class="af-title-pencil">${pencilIcon}</span>
      </div>
      ${result.note ? `<div class="af-note af-rise" style="--d:100ms;">${result.note}</div>` : ""}
      <div id="af-donut-area" class="af-rise" style="--d:140ms;"></div>
      ${result.servings && result.servings.length > 1 ? `
      <div class="af-field af-serving-select-row af-rise" style="--d:180ms;">
        <label for="af-serving-select">Serving size</label>
        <select id="af-serving-select">
          ${result.servings.map((s, i) => `<option value="${i}">${escapeHtml(s.label)} (${s.grams}g)</option>`).join("")}
        </select>
      </div>
      ` : ""}
      <div class="af-amount-card af-rise" style="--d:200ms;">
        <div class="af-amount-head">
          <span class="af-amount-title">Amount</span>
          <span class="af-amount-serving-hint" id="af-amount-serving-hint-text">1 serving = ${afServingGrams}g</span>
        </div>
        <div class="af-amount-input-row">
          <input type="text" inputmode="decimal" id="af-amount-value" value="1">
          <div class="af-unit-seg" id="af-unit-seg">
            <button type="button" data-unit="serving" class="is-active">serving</button>
            <button type="button" data-unit="g">g</button>
            <button type="button" data-unit="oz">oz</button>
          </div>
        </div>
      </div>
      <div class="af-when-card af-rise" style="--d:240ms;">
        <span class="af-when-label">Log at</span>
        <select id="af-hour">
          <option value="">Now (${hourLabel(nowHour)})</option>
          ${HOURS.map((h) => `<option value="${h}">${hourLabel(h)}</option>`).join("")}
        </select>
      </div>
      <div class="af-actions af-rise" style="--d:280ms;">
        <button type="button" class="af-secondary-btn" id="af-retake-btn" style="flex:1;">Retake</button>
        <button type="button" class="nl-save-goals-btn" id="af-add-btn" style="flex:2;">Add to log</button>
      </div>
    `;
    document.getElementById("af-retake-btn").addEventListener("click", renderAfChoice);
    document.getElementById("af-add-btn").addEventListener("click", () => addAfResultToLog());

    const servingSelect = document.getElementById("af-serving-select");
    if (servingSelect) {
      servingSelect.addEventListener("change", () => {
        // Switching serving sizes re-anchors "1 serving" to the newly
        // picked size's grams and resets the amount editor back to a
        // plain "1 serving" of it -- carrying over the old amount would
        // silently change how much is logged (e.g. "3" of a 45g bar
        // becoming "3" of a 270g box).
        const chosen = result.servings[parseInt(servingSelect.value, 10)];
        afServingGrams = chosen.grams;
        afUnit = "serving";
        afAmountValue = 1;
        document.getElementById("af-amount-value").value = 1;
        document.getElementById("af-amount-serving-hint-text").textContent = `1 serving = ${afServingGrams}g`;
        document.querySelectorAll("#af-unit-seg button").forEach((b) => b.classList.toggle("is-active", b.dataset.unit === "serving"));
        refreshAfDonut(result);
      });
    }

    const amountInput = document.getElementById("af-amount-value");
    amountInput.addEventListener("input", () => {
      const parsed = parseFloat(amountInput.value);
      afAmountValue = isFinite(parsed) && parsed >= 0 ? parsed : 0;
      refreshAfDonut(result);
    });
    wireNumericClearOnFocus(amountInput);
    document.getElementById("af-unit-seg").addEventListener("click", (event) => {
      const btn = event.target.closest("[data-unit]");
      if (!btn) return;
      // Convert the current amount into the newly-picked unit so
      // switching units doesn't silently change how much is logged
      // (e.g. "2 servings" -> "60 g", not reset back to "1").
      const grams = currentAfGrams();
      afUnit = btn.dataset.unit;
      afAmountValue = Math.round((grams / gramsPerAfUnit(afUnit)) * 100) / 100;
      amountInput.value = afAmountValue;
      document.querySelectorAll("#af-unit-seg button").forEach((b) => b.classList.toggle("is-active", b === btn));
      refreshAfDonut(result);
    });
    refreshAfDonut(result);
  }

  function refreshAfDonut(result) {
    // Every ingredient's grams scales by the same factor relative to the
    // scan's original total, so the dish's totals scale linearly too —
    // no need to re-sum per-ingredient here.
    const scale = afBaseServingGrams > 0 ? currentAfGrams() / afBaseServingGrams : 0;
    const totals = {
      calories: result.calories * scale,
      protein: result.protein * scale,
      fat: result.fat * scale,
      carbs: result.carbs * scale,
    };
    document.getElementById("af-donut-area").innerHTML =
      donutChartHtml(totals.protein, totals.fat, totals.carbs, totals.calories);
  }

  async function addAfResultToLog() {
    const name = document.getElementById("af-food-name").value.trim() || "Analyzed food";
    const hourValue = document.getElementById("af-hour").value;
    const dateForEntry = selectedDate;

    if (!log[dateForEntry]) log[dateForEntry] = [];

    const now = new Date();
    const addedAt = new Date(dateForEntry + "T00:00:00");
    if (hourValue !== "") {
      // A specific hour was chosen — log it there.
      addedAt.setHours(parseInt(hourValue, 10), 0, 0, 0);
    } else {
      // No time chosen — log it at the exact current moment.
      addedAt.setHours(now.getHours(), now.getMinutes(), now.getSeconds(), 0);
    }

    const id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
    // Every ingredient scales by the same factor the amount editor
    // applied (relative to the scan's original total), so the dish's
    // macro ratios stay correct at whatever amount was actually chosen.
    const scale = afBaseServingGrams > 0 ? currentAfGrams() / afBaseServingGrams : 1;
    // Logged as a composite entry (same shape as any recipe from
    // food_library.py) so every raw ingredient the AI detected is shown
    // and independently editable via the normal ingredients panel —
    // exactly like a dish added from search, not a single locked macro
    // blob.
    const entry = {
      id,
      food: name,
      addedAt: addedAt.getTime(),
      source: "scan", // marks it for the "Recent scans" list in the scan modal
      ingredients: afResult.ingredients.map((ing) => ({
        name: ing.name,
        grams: Math.round(ing.grams * scale * 100) / 100,
        unit: "g",
        baseCalories: ing.calories,
        baseCarbs: ing.carbs,
        baseFat: ing.fat,
        baseProtein: ing.protein,
      })),
    };
    log[dateForEntry].push(entry);

    saveLog();
    renderTimeline();
    renderSummary();

    // A brief, quiet "it's in" moment — a soft green check and the dish
    // name — before the modal slips away. The reward for logging, kept
    // gentle on purpose.
    afModalBody.innerHTML = `
      <div class="af-added">
        <div class="af-added-circle">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="af-added-title">Added to your log</div>
        <div class="af-added-sub">${name.replace(/</g, "&lt;")}</div>
      </div>
    `;
    setTimeout(closeAnalyzeFoodModal, 1100);

    await persistLogEntry(dateForEntry, entry);
  }

  // ---------- Create a custom food (name/emoji/macros typed in by hand) ----------
  // Also doubles as the "just log my macros" quick-entry path: name and
  // emoji are optional here (default to a generic food + plate emoji), so
  // someone who only cares about protein/fat/carbs can skip straight to
  // those fields and hit Create & log. Calories are always computed from
  // the macros server-side (protein/carbs = 4 kcal/g, fat = 9 kcal/g) —
  // see api_create_custom_food() in app.py — never entered directly.
  const CUSTOM_FOOD_EMOJIS = [
    "\u{1F37D}️", "\u{1F357}", "\u{1F969}", "\u{1F41F}", "\u{1F95A}", "\u{1F9C0}", "\u{1F95B}",
    "\u{1F35A}", "\u{1F35D}", "\u{1F355}", "\u{1F354}", "\u{1F32E}", "\u{1F363}", "\u{1F957}",
    "\u{1F966}", "\u{1F34E}", "\u{1F34C}", "\u{1F347}", "\u{1F951}", "\u{1F95C}", "\u{1F331}",
    "\u{1F35E}", "\u{1F9C1}", "\u{1F369}", "\u{1F36A}", "\u{1F368}", "\u{1F36B}", "\u{1F37F}",
    "\u{1F964}", "\u{1F9C8}", "☕",
  ];
  let customFoods = []; // this user's own created foods, from GET /api/custom-foods
  let afCreateEmoji = CUSTOM_FOOD_EMOJIS[0];
  let afCreateQuickMode = false; // read by submitCustomFood() -- see renderAfCreateForm below
  let afCreateBarcode = null; // set when this form was opened from a "barcode not found" redirect
  // Extra named serving sizes (beyond the base "af-create-serving-*"
  // fields) the user has added via "+ Add another serving size" --
  // {label, grams} objects, read by submitCustomFood() below.
  let afCreateExtraServings = [];

  async function loadCustomFoods() {
    try {
      const response = await fetch("/api/custom-foods");
      const data = await response.json();
      if (data.ok) customFoods = data.foods;
    } catch (err) {
      // Search just falls back to FOOD_LIBRARY + Open Food Facts — not fatal.
    }
  }

  function customFoodCalories() {
    const p = parseFloat(document.getElementById("af-create-protein").value) || 0;
    const f = parseFloat(document.getElementById("af-create-fat").value) || 0;
    const c = parseFloat(document.getElementById("af-create-carbs").value) || 0;
    return Math.round(p * 4 + f * 9 + c * 4);
  }

  // Renders one row of the "extra serving sizes" list (label + grams +
  // remove button) inside the create form -- pulled out of
  // renderAfCreateForm so adding/removing a row can just re-render this
  // one list instead of the whole form (which would lose focus/scroll).
  function afExtraServingsListHtml() {
    if (!afCreateExtraServings.length) return "";
    return `
      <div class="af-field" id="af-extra-servings-list">
        <label>Other serving sizes</label>
        ${afCreateExtraServings.map((s, i) => `
          <div class="af-serving-row" data-serving-index="${i}">
            <span class="af-serving-row-label">${escapeHtml(s.label)}</span>
            <span class="af-serving-row-grams">${Math.round(s.grams * 10) / 10}g</span>
            <button type="button" class="af-serving-remove-btn" data-remove-serving="${i}" aria-label="Remove">&times;</button>
          </div>
        `).join("")}
      </div>
    `;
  }

  // quickMode=true is the "Log macros" entry point: just protein/fat/carbs,
  // no name/emoji picker, for when you just want to punch in numbers and
  // log instantly. It's the same underlying form and endpoint as the full
  // "Create food" flow -- name/emoji simply fall back to their server-side
  // defaults ("Custom food" / 🍽️, see api_create_custom_food() in app.py)
  // and the entry still gets saved to this user's own food library, so it
  // stays findable later even from the quick path.
  //
  // notFoundBarcode is set when this form is reached via the "barcode not
  // found" redirect (see scanBarcodeImage()/lookupScannedBarcode() below):
  // a scanned barcode had no match anywhere, so instead of a dead-end
  // error, the user can create the product themselves right here. The
  // barcode is carried through to submitCustomFood() and saved with the
  // food, so scanning the same code again resolves straight to it (see
  // get_custom_food_by_barcode() in database.py).
  function renderAfCreateForm(quickMode, notFoundBarcode) {
    afCreateEmoji = CUSTOM_FOOD_EMOJIS[0];
    afCreateQuickMode = quickMode;
    afCreateBarcode = notFoundBarcode || null;
    afCreateExtraServings = [];
    afModalBody.innerHTML = `
      <div class="af-create-nav">
        <button type="button" class="af-create-back-btn" id="af-create-back-btn" aria-label="Back">&#8249;</button>
        <span class="af-create-nav-title">${quickMode ? "Log Macros" : "Create Food"}</span>
      </div>
      ${quickMode ? "" : `
      <div class="af-icon-row">
        <div class="af-icon-emoji" id="af-icon-emoji">${afCreateEmoji}</div>
        <div class="af-icon-info">

          <div class="af-icon-sub">Tap to change</div>
        </div>

      </div>
      <div class="af-emoji-grid" id="af-emoji-grid" style="display:none;">
        ${CUSTOM_FOOD_EMOJIS.map((e, i) => `<button type="button" class="af-emoji-btn ${i === 0 ? "is-active" : ""}" data-emoji="${e}">${e}</button>`).join("")}
      </div>
      `}
      ${afCreateBarcode ? `
      <div class="af-field">
        <div class="af-field-head"><label for="af-create-barcode-input">Barcode</label></div>
        <div class="af-barcode-row">
          <input type="text" inputmode="numeric" id="af-create-barcode-input" maxlength="20" value="${escapeAttr(afCreateBarcode)}">
          <button type="button" class="af-barcode-del-btn" id="af-barcode-del-btn" aria-label="Clear barcode">&#128465;&#65039;</button>
        </div>
      </div>
      ` : ""}
      ${quickMode ? "" : `
      <div class="af-field">
        <div class="af-field-head"><label for="af-create-name">Food Name</label><span class="af-tag">Optional</span></div>
        <input type="text" id="af-create-name" maxlength="60" placeholder="e.g. Mom's lasagna">

      `}
      <div class="af-section-title">Macros</div>
      <div class="af-macro-grid">
        <div class="af-field">
          <label for="af-create-protein">Protein (g)</label>
          <input type="text" inputmode="decimal" id="af-create-protein" value="0">
        </div>
        <div class="af-field">
          <label for="af-create-fat">Fat (g)</label>
          <input type="text" inputmode="decimal" id="af-create-fat" value="0">
        </div>

        <span class="af-create-calories-value" id="af-create-calories-value">0</span>
      </div>
      ${quickMode ? "" : `
      <div class="af-section-title">Serving</div>
      <div class="af-icon-row" id="af-serving-summary-row">
        <div class="af-icon-info">
          <div class="af-icon-title" id="af-serving-summary-title">1 serving</div>
          <div class="af-icon-sub" id="af-serving-summary-sub">= 100 g</div>

        <button type="button" class="af-icon-edit-btn" id="af-serving-edit-btn">Edit</button>
      </div>
      <div id="af-serving-editor" style="display:none;">
        <div class="af-field">
          <label class="f-label">Weight</label>

            <span class="af-serving-weight-label">1 serving</span>
            <div class="nl-amount-field">
              <input type="number" min="0" id="af-create-serving-amount" value="100">

            </div>
          </div>
        </div>
      </div>
      ${afExtraServingsListHtml()}
      <div class="af-add-serving-form" id="af-add-serving-form" style="display:none;">
        <div class="af-field">
          <label class="f-label" for="af-new-serving-label">Serving name &amp; weight</label>
          <div class="af-serving-weight-row">
            <input type="text" id="af-new-serving-label" maxlength="40" placeholder="e.g. 1 box" style="flex:1;min-width:0;width:auto;margin:0;">
            <div class="nl-amount-field">
              <input type="number" min="0" id="af-new-serving-amount" value="1">
              <select class="nl-unit-select" id="af-new-serving-unit">${unitOptionsHtml("g")}</select>
            </div>
          </div>
        </div>
        <div class="af-actions">
          <button type="button" class="af-secondary-btn" id="af-new-serving-cancel-btn" style="flex:1;">Cancel</button>
          <button type="button" class="nl-save-goals-btn" id="af-new-serving-confirm-btn" style="flex:1;">Add</button>
        </div>
      </div>
      <button type="button" class="af-secondary-btn af-add-serving-btn" id="af-add-serving-btn">+ Add another serving size</button>
      `}
      <div id="af-create-error" class="af-error" style="display:none;"></div>
      <button type="button" class="nl-save-goals-btn" id="af-create-submit-btn" style="width:100%;">${quickMode ? "Log now" : "Create &amp; log"}</button>
    `;

    document.getElementById("af-create-back-btn").addEventListener("click", renderAfChoice);
    const emojiGrid = document.getElementById("af-emoji-grid");
    const iconEmojiEl = document.getElementById("af-icon-emoji");
    const iconEditBtn = document.getElementById("af-icon-edit-btn");
    if (iconEditBtn) {
      iconEditBtn.addEventListener("click", () => {
        emojiGrid.style.display = emojiGrid.style.display === "none" ? "grid" : "none";
      });
    }
    if (emojiGrid) {
      emojiGrid.addEventListener("click", (event) => {
        const btn = event.target.closest("[data-emoji]");
        if (!btn) return;
        afCreateEmoji = btn.dataset.emoji;
        if (iconEmojiEl) iconEmojiEl.textContent = afCreateEmoji;
        document.querySelectorAll("#af-emoji-grid .af-emoji-btn").forEach((b) => b.classList.toggle("is-active", b === btn));
        emojiGrid.style.display = "none"; // picked -- collapse back behind the icon row
      });
    }
    const barcodeDelBtn = document.getElementById("af-barcode-del-btn");
    if (barcodeDelBtn) {
      barcodeDelBtn.addEventListener("click", () => {
        const barcodeInput = document.getElementById("af-create-barcode-input");
        barcodeInput.value = "";
        barcodeInput.focus();
      });

    const calValueEl = document.getElementById("af-create-calories-value");
    ["af-create-protein", "af-create-fat", "af-create-carbs"].forEach((id) => {
      const macroInput = document.getElementById(id);
      macroInput.addEventListener("input", () => {
        calValueEl.textContent = customFoodCalories();
      });
      wireNumericClearOnFocus(macroInput);
    });
    // Primary serving size: collapsed behind an "Edit" tap (same pattern as
    // the emoji picker above). The name is fixed at "1 serving" -- not
    // user-editable -- so only the weight amount/unit ever changes, and
    // the summary's title never needs to update, only its subtitle.
    const servingSummarySub = document.getElementById("af-serving-summary-sub");
    const servingEditor = document.getElementById("af-serving-editor");
    const servingEditBtn = document.getElementById("af-serving-edit-btn");
    const servingAmountInput = document.getElementById("af-create-serving-amount");
    const servingUnitSelect = document.getElementById("af-create-serving-unit");
    if (servingEditBtn) {
      const refreshServingSummary = () => {
        servingSummarySub.textContent = `= ${servingAmountInput.value || 0} ${UNIT_LABELS[servingUnitSelect.value]}`;
      };
      servingEditBtn.addEventListener("click", () => {
        servingEditor.style.display = servingEditor.style.display === "none" ? "block" : "none";
      });
      servingAmountInput.addEventListener("input", refreshServingSummary);
      servingUnitSelect.addEventListener("change", refreshServingSummary);
      wireNumericClearOnFocus(servingAmountInput);
    }

    // nl-unit-select control used everywhere else in the app) instead of
    // native browser prompt() dialogs, which look and feel like they're
    // coming from outside the app rather than part of it.
    const addServingBtn = document.getElementById("af-add-serving-btn");
    const addServingForm = document.getElementById("af-add-serving-form");
    if (addServingBtn && addServingForm) {
      const newServingLabelInput = document.getElementById("af-new-serving-label");
      const newServingAmountInput = document.getElementById("af-new-serving-amount");
      const newServingUnitSelect = document.getElementById("af-new-serving-unit");
      wireNumericClearOnFocus(newServingAmountInput);
      addServingBtn.addEventListener("click", () => {
        addServingForm.style.display = addServingForm.style.display === "none" ? "block" : "none";
        if (addServingForm.style.display === "block") newServingLabelInput.focus();
      });
      document.getElementById("af-new-serving-cancel-btn").addEventListener("click", () => {
        addServingForm.style.display = "none";
      });
      document.getElementById("af-new-serving-confirm-btn").addEventListener("click", () => {
        const label = newServingLabelInput.value.trim().slice(0, 40);

        if (!label || !isFinite(amount) || amount <= 0) return;
        const grams = unitToGrams(amount, newServingUnitSelect.value);
        afCreateExtraServings.push({ label, grams });
        newServingLabelInput.value = "";
        newServingAmountInput.value = "1";
        newServingUnitSelect.value = "g";
        addServingForm.style.display = "none";
