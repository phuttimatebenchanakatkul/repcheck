        if (list) {
          list.outerHTML = afExtraServingsListHtml();
        } else {
          addServingForm.insertAdjacentHTML("beforebegin", afExtraServingsListHtml());
        }
        wireAfServingRemoveButtons();
      });
    }
    wireAfServingRemoveButtons();
    document.getElementById("af-create-submit-btn").addEventListener("click", submitCustomFood);
  }

  function wireAfServingRemoveButtons() {
    document.querySelectorAll("[data-remove-serving]").forEach((btn) => {
      btn.addEventListener("click", () => {
        afCreateExtraServings.splice(parseInt(btn.dataset.removeServing, 10), 1);
        const list = document.getElementById("af-extra-servings-list");
        if (list) list.outerHTML = afExtraServingsListHtml();
        wireAfServingRemoveButtons();
      });
    });
  }

  async function submitCustomFood() {
    const errorEl = document.getElementById("af-create-error");
    errorEl.style.display = "none";
    const nameEl = document.getElementById("af-create-name");
    const name = nameEl ? nameEl.value.trim() : "";
    const protein = parseFloat(document.getElementById("af-create-protein").value) || 0;
    const fat = parseFloat(document.getElementById("af-create-fat").value) || 0;
    const carbs = parseFloat(document.getElementById("af-create-carbs").value) || 0;

    if (protein <= 0 && fat <= 0 && carbs <= 0) {
      errorEl.textContent = "Enter at least one macro (protein, fat, or carbs).";
      errorEl.style.display = "block";
      return;
    }

    // Only sent for the full "Create food" form (quickMode=false) --
    // "Log macros" never shows these fields, so falls back to the
    // server's own "1 serving = 100g" default. The name isn't user-
    // editable (always "1 serving"); amount is entered in whatever unit
    // the picker is set to (g/oz/mL) and converted to grams here -- the
    // server only ever stores/compares grams.
    const servingAmountEl = document.getElementById("af-create-serving-amount");
    const servingUnitEl = document.getElementById("af-create-serving-unit");
    const servingLabel = servingAmountEl ? "1 serving" : "";
    const servingAmount = servingAmountEl ? parseFloat(servingAmountEl.value) : NaN;
    const servingGrams = (servingAmountEl && servingUnitEl && isFinite(servingAmount))
      ? unitToGrams(servingAmount, servingUnitEl.value)
      : NaN;

    // Editable barcode field, pre-filled from the "not found" redirect --
    // the user can correct a misread digit before saving. Digits only,
    // same convention as the scan/lookup path.
    const barcodeInputEl = document.getElementById("af-create-barcode-input");
    const barcode = barcodeInputEl ? sanitizeBarcodeDigits(barcodeInputEl.value) : (afCreateBarcode || "");

    const submitBtn = document.getElementById("af-create-submit-btn");
    submitBtn.disabled = true;
    try {
      const response = await fetch("/api/custom-foods", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name, emoji: afCreateEmoji, protein, fat, carbs,
          barcode: barcode || undefined,
          servingLabel: servingLabel || undefined,
          servingGrams: isFinite(servingGrams) && servingGrams > 0 ? servingGrams : undefined,
          servings: afCreateExtraServings.length ? afCreateExtraServings : undefined,
        }),
      });
      const data = await response.json();
      if (!data.ok) {
        errorEl.textContent = data.error || "Couldn't create that food.";
        errorEl.style.display = "block";
        submitBtn.disabled = false;
        return;
      }
      customFoods.unshift(data.food);

      // Reshape into the same {food_name, ingredients: [...], calories/
      // protein/fat/carbs, servings} object renderAfResult() already knows
      // how to show (donut chart + amount editor, incl. the serving-size
      // picker when servings has more than one option) and log.
      const food = data.food;
      afPreviewUrl = null;
      afResult = customFoodToResult(food);

      // Quick mode's button says "Log now", not "Review and log" -- it has
      // to actually log immediately instead of dropping into the same
      // review screen the full "Create & log" flow uses (that extra click
      // was silently eating every quick-macro entry: the food got created
      // but never made it into the day's log unless the user noticed and
      // clicked a SECOND "Add to log" they were never told to expect).
      if (afCreateQuickMode) {
        const dateForEntry = selectedDate;
        if (!log[dateForEntry]) log[dateForEntry] = [];
        const id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
        const entry = {
          id,
          food: food.name,
          addedAt: Date.now(),
          ingredients: afResult.ingredients.map((ing) => ({
            name: ing.name, grams: ing.grams, unit: "g",
            baseCalories: ing.calories, baseCarbs: ing.carbs, baseFat: ing.fat, baseProtein: ing.protein,
          })),
        };
        log[dateForEntry].push(entry);
        saveLog();
        renderTimeline();
        renderSummary();
        afModalBody.innerHTML = `
          <div class="af-added">
            <div class="af-added-circle">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div class="af-added-title">Added to your log</div>
            <div class="af-added-sub">${escapeHtml(food.name)}</div>
          </div>
        `;
        setTimeout(closeAnalyzeFoodModal, 1100);
        await persistLogEntry(dateForEntry, entry);
        return;
      }

      renderAfResult(afResult);
    } catch (err) {
      errorEl.textContent = "Couldn't create that food. Please try again.";
      errorEl.style.display = "block";
      submitBtn.disabled = false;
    }
  }

  // A mirror-symmetric heart path (both lobes and the bottom point sit
  // evenly either side of x=12) -- the previous path's control points
  // weren't actually symmetric, so it rendered visibly lopsided/tilted.
  const HEART_OUTLINE = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2c-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;
  const HEART_FILLED = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2c-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;

  // A compact "142 kcal · 27P / 3F / 0C" line (per 100g) for a food that
  // lives in the shared library. Online/custom foods aren't in the library
  // so they render without one -- the row still works, it just leads with
  // the name. Kept muted and secondary so the food name stays the anchor.
  function foodMacroLine(name) {
    const f = foodByName(name);
    if (!f) return "";
    return `<div class="nl-food-row-macros">
        <span class="nl-frm-cal">${Math.round(f.calories)} kcal</span>
        <span class="nl-frm-macros">${Math.round(f.protein)}P / ${Math.round(f.fat)}F / ${Math.round(f.carbs)}C</span>
      </div>`;
  }
  function macroLineFrom(macros) {
    return `<div class="nl-food-row-macros">
        <span class="nl-frm-cal">${Math.round(macros.calories || 0)} kcal</span>
        <span class="nl-frm-macros">${Math.round(macros.protein || 0)}P / ${Math.round(macros.fat || 0)}F / ${Math.round(macros.carbs || 0)}C</span>
      </div>`;
  }

  // One full-width list row: icon, name + macro line, and a heart. Replaces
  // the old dense square-tile grid -- a scannable list reads far better on a
  // phone and lets each result carry its macros without crowding. The
  // data-food / data-fav-toggle hooks are unchanged, so the same delegated
  // click handler (tap row = pick to log, tap heart = favorite) still works.
  function foodRowHtml(name) {
    const isFav = favorites.has(name);
    return `
      <button type="button" class="nl-food-row" data-food="${escapeAttr(name)}">
        <span class="nl-food-row-icon">${foodIconHtml(name, "nl-food-photo-row")}</span>
        <span class="nl-food-row-body">
          <span class="nl-food-row-name">${escapeHtml(name)}</span>
          ${foodMacroLine(name)}
        </span>
        <span class="nl-food-row-fav ${isFav ? "is-fav" : ""}" data-fav-toggle="${escapeAttr(name)}" role="button" aria-label="${isFav ? "Remove from favorites" : "Add to favorites"}">${isFav ? HEART_FILLED : HEART_OUTLINE}</span>
      </button>
    `;
  }

  // Persistent escape hatch, shown at the bottom of the search sheet
  // regardless of state (default view or live results) -- not every food
  // is in the library or Open Food Facts (a specific chain item, a home
  // recipe, etc.), so "can't find it" needs to always be one tap away
  // from wherever the user already is, not buried behind "Analyze a food
  // photo" -> "Log macros". Reuses that exact same quickMode form (see
  // openQuickMacroModal() below) -- no separate flow to maintain.
  function manualMacroCtaHtml() {
    const t = RepCheckI18n.t;
    // Titled "Quick add" (manualMacro.button), not the old "Can't find it?"
    // (manualMacro.title). This is now the ONLY route to manual macro entry
    // -- the standalone button above the date strip was removed -- and it
    // renders in the default no-query view too, where "Can't find it?" asks
    // about a search the user hasn't run yet. Leading with the action's own
    // name reads correctly in both views, and keeps the label users already
    // knew from the old button. The subtitle still explains what it does,
    // and its position at the end of the results carries the "nothing
    // matched?" meaning implicitly.
    // Wrapped in a sticky footer, not left inline at the end of the list.
    // Inline, a 25-result search buried it below everything -- turning what
    // used to be a one-tap button into "open the sheet, scroll past 25 rows,
    // tap". The wrapper carries the sheet background so rows scroll cleanly
    // underneath instead of showing through the gap around the button.
    // Reuses .btn-primary (style.css) -- the same class the analyze page's
    // "Analyze my form" button uses -- rather than restyling a local class
    // to look like it, so the two stay in sync if that button ever changes.
    // The subtitle and trailing arrow are gone with the card treatment;
    // .btn-primary is a single centered label by design, and "Quick add" is
    // the same wording the standalone button used, so the action is still
    // named the way users already knew it.
    return `
      <div class="nl-manual-macro-dock">
        <button type="button" class="btn-primary" data-manual-macro="1">
          ${t("nutrition.manualMacro.button")}
        </button>
      </div>
    `;
  }

  // Which of All / Favorites / Recent the default (no-query) view is
  // showing. Reset to "all" every time the sheet opens fresh (showModal())
  // so it never reopens on whatever tab was last picked in a prior session.
  let modalScope = "all";

  // Segmented control replacing the old stacked "FAVORITES" / "RECENT"
  // section headers -- one filtered list instead of three concatenated
  // ones, so the sheet stays one continuous scroll instead of growing with
  // every section a user has content in. Only shown for the no-query
  // default view; renderModalResults()'s live-search branch never calls
  // this, so typing a query hides it the same way iOS search hides
  // segmented controls once you start typing.
  function scopeSegHtml() {
    const t = RepCheckI18n.t;
    const tabs = [["all", t("nutrition.scope.all")], ["favorites", t("nutrition.favorites")], ["recent", t("nutrition.recent")]];
    return `
      <div class="nl-scope-seg">
        ${tabs.map(([key, label]) => `<button type="button" data-scope-tab="${key}" class="${modalScope === key ? "is-active" : ""}">${label}</button>`).join("")}
      </div>
    `;
  }

  function renderModalDefaultSections() {
    const t = RepCheckI18n.t;
    // "Top picks" hour comes from wherever the modal was opened: the
    // hour-row "+" pins it to that row's hour via pendingHour, while the
    // quick-add bar (which leaves pendingHour null so logging still uses
    // the real current time) carries its own topPicksHour computed as
    // "right now" when the popup opened.
    const topPicksHour = modalMode && modalMode.type === "add-food" ? pendingHour
      : modalMode && modalMode.type === "quickadd" ? modalMode.topPicksHour
      : null;
    const topPicks = (topPicksHour !== null && topPicksHour !== undefined) ? getTopPicksForHour(topPicksHour, 8) : [];
    const recent = getRecentFoods(8);
    const favoritesList = Array.from(favorites);

    let names;
    if (modalScope === "favorites") names = favoritesList;
    else if (modalScope === "recent") names = recent;
    else {
      // "All" = favorites, then top picks, then recent, deduped in that
      // priority order -- the same priority the old stacked sections used,
      // just merged into one list instead of three labeled ones.
      const seen = new Set();
      names = [...favoritesList, ...topPicks, ...recent].filter((n) => (seen.has(n) ? false : (seen.add(n), true)));
    }

    const listHtml = names.length ? `<div class="nl-food-list">${names.map(foodRowHtml).join("")}</div>` : `<div class="nl-search-empty">${t("nutrition.searchToAdd")}</div>`;
    modalResultsEl.innerHTML = scopeSegHtml() + listHtml + manualMacroCtaHtml();
  }

  // ---------- Open Food Facts online search (extends FOOD_LIBRARY) ----------
  // Shared by the search modal and the quick-add bar: fetches
  // /api/search-food-online (debounced, since it fires on every
  // keystroke) and hands back results in the exact same shape a barcode
  // scan produces, so picking one opens the same donut/amount-card
  // result screen as a scan does (see openScannedResultModal).
  async function fetchOffResults(query) {
    try {
      const response = await fetch(`/api/search-food-online?q=${encodeURIComponent(query)}`);
      const data = await response.json();
      return data.ok ? data.results : [];
    } catch (err) {
      return [];
    }
  }

  // result.food_name here comes from OpenFoodFacts (see fetchOffResults) --
  // a public, community-editable database, not something RepCheck controls.
  // offResultRowHtml is inserted via insertAdjacentHTML, so an unescaped
  // product name is a live HTML/script sink for whatever text is in that
  // listing. foodIconHtml()'s own alt="${name}" only ever fires for an
  // exact match against the curated FOOD_IMAGES keys, which can't collide
  // with attacker-chosen text, so only the visible name needs escaping here.
  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  // Quantity/macro number fields (protein, fat, carbs, serving grams, log
  // amount) start pre-filled with a default (0, 1, 100) that the user
  // almost always has to backspace before typing their real value --
  // clear it for them on focus so they can just type, and restore the
  // default on blur if they leave it empty rather than leaving a blank
  // field behind.
  function wireNumericClearOnFocus(input) {
    if (!input || input.dataset.clearOnFocusWired) return;
    input.dataset.clearOnFocusWired = "1";
    const original = input.value;
    input.addEventListener("focus", () => {
      if (input.value === "") return;
      input.value = "";
      input.dispatchEvent(new Event("input", { bubbles: true }));
    });
    input.addEventListener("blur", () => {
      if (input.value.trim() === "") {
        input.value = original;
        input.dispatchEvent(new Event("input", { bubbles: true }));
      }
    });
  }

  // Retail barcodes (EAN/UPC) are always numeric -- strip anything else so
  // every path (live BarcodeDetector scan, manual edit in the create-food
  // form) keys on digits only, matching barcode_scanner.py's server-side
  // _digits_only().
  function sanitizeBarcodeDigits(value) {
    return String(value).replace(/\D/g, "");
  }

  // escapeHtml() round-trips through textContent, which escapes < > and &
  // but deliberately leaves quotes alone -- correct for a text node, unsafe
  // the moment the value lands inside a quoted attribute, where one " ends
  // the attribute and everything after it parses as markup. Attribute
  // interpolations use this instead.
  function escapeAttr(text) {
    return escapeHtml(text).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function offResultRowHtml(result, index) {
    return `
      <button type="button" class="nl-food-row" data-off-index="${index}">
        <span class="nl-food-row-icon">${foodIconHtml(result.food_name, "nl-food-photo-row")}</span>
        <span class="nl-food-row-body">
          <span class="nl-food-row-name">${escapeHtml(result.food_name)}</span>
          ${macroLineFrom(result)}
        </span>
      </button>
    `;
  }

  // Reshapes one of this user's own created foods (from customFoods /
  // GET /api/custom-foods) into the same result-object shape a scan or
  // OFF search produces, so it can be opened through the exact same
  // renderAfResult() review screen.
  function customFoodToResult(food) {
    // servingGrams is the food's own defined serving size (e.g. "1 bar" =
    // 45g), not a hardcoded 100g -- entered when the food was created (see
    // renderAfCreateForm's serving-size fields), defaulting to 100 for
    // foods created before this existed. "servings" lists every named
    // serving size option (the base one plus any extras) for the amount
    // editor's serving-size picker in renderAfResult().
    const servingGrams = food.servingGrams || 100;
    const servings = [{ label: food.servingLabel || "1 serving", grams: servingGrams }]
      .concat(food.servings || []);
    return {
      food_name: food.name,
      confidence: "custom",
      note: "Your own food entry.",
      ingredients: [{
        name: food.name, grams: servingGrams,
        calories: food.calories, protein: food.protein, fat: food.fat, carbs: food.carbs,
      }],
      calories: food.calories, protein: food.protein, fat: food.fat, carbs: food.carbs,
      servings,
    };
  }

  function customFoodRowHtml(food, index) {
    return `
      <button type="button" class="nl-food-row" data-custom-index="${index}">
        <span class="nl-food-row-icon">${food.emoji}</span>
        <span class="nl-food-row-body">
          <span class="nl-food-row-name">${escapeHtml(food.name)}</span>
          ${macroLineFrom(food)}
        </span>
      </button>
    `;
  }

  // Opens the same result screen a barcode/photo scan produces, pre-filled
  // with an already-fetched result (an Open Food Facts search hit) instead
  // of running a fresh scan.
  function openScannedResultModal(result) {
    afPreviewUrl = null;
    afResult = result;
    window.openBottomSheet(afModalOverlay, ".af-modal");
    renderAfResult(result);
  }

  // Ranks food-name matches so the simplest, most on-point results come
  // first and hyper-specific ones sink. A plain substring filter buried
  // "Chicken Breast" under "Thai fried chicken curry adobo sauce" just
  // because both contain "chicken". Scoring, high to low: the name IS the
  // query; the name starts with it; the query begins a word inside the
  // name; the query is a buried substring. Then a penalty for every extra
  // word (and extra character) beyond the query, so for a short/generic
  // search a short common food outranks a long over-specified dish.
  // Favorites get a boost so a food you've starred surfaces first among
  // otherwise-similar hits.
  function scoreFoodMatch(name, q, qWordCount) {
    const lower = name.toLowerCase();
    const idx = lower.indexOf(q);
    if (idx === -1) return -Infinity;
    let score;
    if (lower === q) score = 1000;
    else if (idx === 0) score = 620;
    else if (!/[a-z0-9]/.test(lower[idx - 1])) score = 380; // query begins a word
    else score = 130;
    const nameWordCount = lower.split(/\s+/).filter(Boolean).length;
    score -= Math.max(0, nameWordCount - qWordCount) * 24;
    score -= Math.max(0, lower.length - q.length) * 0.7;
    if (favorites.has(name)) score += 450;
    return score;
  }

  let modalOffDebounceId = null;
  let modalOffResults = [];
  // Fewer results than before (was 24) -- a short, ranked list is far less
  // overwhelming than a wall of near-duplicates, and the best matches are
  // now reliably at the top so the extras were mostly noise anyway.
  const MODAL_MAX_RESULTS = 14;

  function renderModalResults(query) {
    const q = query.trim().toLowerCase();
    if (!q) {
      renderModalDefaultSections();
      return;
    }
    const qWordCount = q.split(/\s+/).filter(Boolean).length;
    let matches = FOOD_LIBRARY
      .filter((f) => f.name.toLowerCase().includes(q))
      .map((f) => ({ name: f.name, score: scoreFoodMatch(f.name, q, qWordCount) }))
      .sort((a, b) => b.score - a.score || a.name.length - b.name.length)
      .slice(0, MODAL_MAX_RESULTS)
      .map((m) => m.name);

    // This user's own created foods match alongside the shared library —
    // same list, no visual distinction, so they read as "part of my
    // search" rather than a separate silo.
    const customMatches = customFoods
      .map((food, i) => ({ food, i }))
      .filter(({ food }) => food.name.toLowerCase().includes(q));

    // Online results land in this SAME list once they arrive (see below)
    // rather than a separate labeled section — it should just read as
    // "more search results", not a distinct source.
    modalResultsEl.innerHTML = `
      <div class="nl-food-list" id="modal-food-list">${matches.map(foodRowHtml).join("")}${customMatches.map(({ food, i }) => customFoodRowHtml(food, i)).join("")}</div>
      <div class="nl-search-empty" id="modal-empty-msg" style="${matches.length || customMatches.length ? "display:none;" : ""}">${RepCheckI18n.t("nutrition.noMatch", { query })}</div>
      ${manualMacroCtaHtml()}
    `;

    if (modalOffDebounceId) clearTimeout(modalOffDebounceId);
    modalOffDebounceId = setTimeout(async () => {
      if (modalSearchInput.value.trim().toLowerCase() !== q) return; // stale — a newer keystroke has since fired
      modalOffResults = await fetchOffResults(query.trim());
      const list = document.getElementById("modal-food-list");
      if (!list || !modalOffResults.length) return;
      list.insertAdjacentHTML("beforeend", modalOffResults.map(offResultRowHtml).join(""));
      const emptyMsg = document.getElementById("modal-empty-msg");
      if (emptyMsg) emptyMsg.style.display = "none";
    }, 350);
  }

  // Event delegation on the results container: listeners are attached
  // once here rather than re-attached after every render, so a click
  // never gets lost to a stale/replaced element reference.
  modalResultsEl.addEventListener("click", (event) => {
    const scopeTab = event.target.closest("[data-scope-tab]");
    if (scopeTab) {
      modalScope = scopeTab.dataset.scopeTab;
      renderModalDefaultSections();
      return;
    }

    if (event.target.closest("[data-manual-macro]")) {
      closeModal();
      openQuickMacroModal();
      return;
    }

    const favBtn = event.target.closest("[data-fav-toggle]");
    if (favBtn) {
      event.stopPropagation();
      toggleFavorite(favBtn.dataset.favToggle);
      if (modalSearchInput.value.trim()) {
        renderModalResults(modalSearchInput.value);
      } else {
        renderModalDefaultSections();
      }
      return;
    }

    const offTile = event.target.closest("[data-off-index]");
    if (offTile) {
      const result = modalOffResults[parseInt(offTile.dataset.offIndex, 10)];
      if (result) {
        closeModal();
        openScannedResultModal(result);
      }
      return;
    }

    const customTile = event.target.closest("[data-custom-index]");
    if (customTile) {
      const food = customFoods[parseInt(customTile.dataset.customIndex, 10)];
      if (food) {
        closeModal();
        openScannedResultModal(customFoodToResult(food));
      }
      return;
    }

    const tile = event.target.closest("[data-food]");
    if (tile) {
      if (modalMode && modalMode.type === "add-ingredient") {
        addIngredientToEntry(modalMode.entryId, tile.dataset.food);
        closeModal();
      } else {
        const hourForLog = pendingHour; // capture before closeModal() clears it
        closeModal();
        openLogAmountModal(tile.dataset.food, hourForLog);
      }
    }
  });

  modalSearchInput.addEventListener("input", () => renderModalResults(modalSearchInput.value));

  // ---------- Quick-add bar ----------
  // Clicking/focusing it opens the same search popup as the "+" on an
  // hour row (openAddFoodModal) -- favorites, recent, and top picks for
  // an hour -- except it never sets pendingHour, so addFoodToSelectedDay()
  // always logs at the real current time (see that function's
  // `pendingHour !== null` branch) instead of pinning to the top of
  // whatever hour is passed in for the "top picks" section.
  function openQuickaddModal() {
    pendingHour = null;
    modalMode = { type: "quickadd", topPicksHour: new Date().getHours() };
    setModalTitle(RepCheckI18n.t("nutrition.modal.logFoodNow"));
    showModal();
  }

  document.getElementById("nl-log-btn").addEventListener("click", openQuickaddModal);

  function renderDateStrip() {
    const todayIso = toIsoDate(today);
    const cells = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart);
      d.setDate(d.getDate() + i);
      const iso = toIsoDate(d);
      const classes = ["nl-date-cell"];
      if (iso === todayIso) classes.push("is-today");
      if (iso === selectedDate) classes.push("is-selected");
      const hasEntries = (log[iso] || []).length > 0;
      cells.push(`
        <button type="button" class="${classes.join(" ")}" data-date="${iso}">
          <span class="nl-date-weekday">${WEEKDAY_LETTERS[i]}</span>
          <span class="nl-date-number">${d.getDate()}</span>
          <span class="nl-date-dot ${hasEntries ? "" : "is-empty"}"></span>
        </button>
      `);
    }
    dateStripEl.innerHTML = cells.join("");
    dateStripEl.querySelectorAll("[data-date]").forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedDate = btn.dataset.date;
        renderTimeline();
        renderSummary();
      });
    });
  }

  function formatTime(timestamp) {
    return RepCheckUnits.formatTime(timestamp);
  }

  function hourLabel(hour) {
    return RepCheckUnits.formatHourLabel(hour);
  }

  // "Today" / "Yesterday" / a friendly localized date for anything else --
  // mirrors the workout log's dayTitle().
  function dayTitle() {
    const t = RepCheckI18n.t;
    const todayIso = toIsoDate(new Date());
    if (selectedDate === todayIso) return t("nutrition.day.today");
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    if (selectedDate === toIsoDate(yesterday)) return t("nutrition.day.yesterday");
    return new Date(selectedDate + "T00:00:00").toLocaleDateString(RepCheckI18n.locale(), { weekday: "long", day: "numeric", month: "short" });
  }

  function renderTimeline() {
    const t = RepCheckI18n.t;
    // Time-ordered list of the day's foods, each in its own rounded card
    // (each card already shows its own logged time) -- matches the
    // workout log's entry list and day header instead of the old
    // 24-row hour grid / flat divider rows.
    const dayEntries = (log[selectedDate] || []).slice().sort((a, b) => a.addedAt - b.addedAt);

    const totalKcal = dayEntries.reduce((sum, entry) => sum + scaledMacros(entry).calories, 0);
    const summary = dayEntries.length
      ? `${t("nutrition.day.items", { n: dayEntries.length, s: dayEntries.length === 1 ? "" : "s" })} · ${Math.round(totalKcal)} kcal`
      : "";

    dayHeadEl.innerHTML = `
      <div class="nl-day-title">${dayTitle()}</div>
      ${summary ? `<div class="nl-day-sub">${summary}</div>` : ""}
    `;

    timelineEl.innerHTML = dayEntries.length
      ? dayEntries.map((entry) => renderEntry(entry)).join("")
      : `
        <div class="nl-empty">
          <div class="nl-empty-icon">\u{1F957}</div>
          <div class="nl-empty-title">${t("nutrition.empty.title")}</div>
          <div class="nl-empty-sub">${t("nutrition.empty.sub")}</div>
        </div>
      `;

    wireTimelineEvents();
    renderDateStrip(); // keep the "logged that day" dots in sync
  }

  function renderEntry(entry) {
    const t = RepCheckI18n.t;
    const expanded = EXPANDED.has(entry.id);
    const m = scaledMacros(entry);
    const totals = entryTotals(entry);
    const isFav = favorites.has(entry.food);
    // The card sits in a swipe wrapper: dragging it right-to-left reveals a
    // red "Delete" panel behind it (see wireSwipeToDelete). Tapping Delete
    // asks to confirm first. The expanded detail stays below, unswiped.
    return `
      <div class="nl-swipe" data-swipe="${entry.id}">
        <button type="button" class="nl-swipe-delete" data-swipe-delete="${entry.id}" tabindex="-1" aria-label="${t("nutrition.swipeDelete")}">
          ${TRASH_ICON}<span>${t("nutrition.swipeDelete")}</span>
        </button>
        <div class="nl-swipe-content">
          <div class="nl-entry-card" data-toggle-entry="${entry.id}">
            <div class="nl-entry-icon">${foodIconHtml(entry.food, "nl-food-photo-entry")}</div>
            <div class="nl-entry-info">
              <div class="nl-entry-name">${escapeHtml(entry.food)}</div>
              <div class="nl-entry-sub">${formatTime(entry.addedAt)} • ${Math.round(totals.grams)}g • ${m.calories} kcal</div>
            </div>
            <button type="button" class="nl-entry-fav-btn ${isFav ? "is-fav" : ""}" data-entry-fav-toggle="${escapeAttr(entry.food)}" aria-label="${isFav ? "Remove from favorites" : "Add to favorites"}">
              ${isFav ? HEART_FILLED : HEART_OUTLINE}
            </button>
            <button type="button" class="nl-entry-toggle ${expanded ? "is-expanded" : ""}" data-toggle-entry="${entry.id}" aria-label="${expanded ? "Minimize" : "Expand"}">
              ${CHEVRON_ICON}
            </button>
          </div>
        </div>
      </div>
      ${expanded ? renderEntryDetail(entry) : ""}
    `;
  }

  function renderEntryDetail(entry) {
    const t = RepCheckI18n.t;
    const m = scaledMacros(entry);
    const totals = entryTotals(entry);
    const isComposite = !!(entry.ingredients && entry.ingredients.length);

    const amountHtml = isComposite ? `
      <div class="nl-amount-card">
        <div class="nl-amount-meta">
          <label class="nl-amount-title" for="total-grams-${entry.id}">${t("nutrition.amount.label")}</label>
        </div>
        <div class="nl-amount-field">
          <input type="number" min="0" id="total-grams-${entry.id}" value="${Math.round(totals.grams)}" data-total-grams-entry="${entry.id}">
          <span class="nl-amount-unit-label">g</span>
        </div>
      </div>
    ` : `
      <div class="nl-amount-card">
        <div class="nl-amount-meta">
          <label class="nl-amount-title" for="grams-${entry.id}">${t("nutrition.amount.label")}</label>
        </div>
        <div class="nl-amount-field">
          <input type="number" min="0" id="grams-${entry.id}" value="${gramsToUnit(entry.grams, entry.unit || "g")}" data-grams-entry="${entry.id}">
          <select class="nl-unit-select" data-amount-unit-entry="${entry.id}">${unitOptionsHtml(entry.unit || "g")}</select>
        </div>
      </div>
      <button type="button" class="nl-add-ingredient-btn nl-add-ingredient-standalone" data-add-ingredient="${entry.id}">${t("nutrition.addIngredient")}</button>
    `;

    return `
      <div class="nl-entry-detail">
        ${entryHeroHtml(entry.id, m)}
        ${amountHtml}
        ${isComposite ? renderIngredientsPanel(entry) : ""}
        <div class="nl-detail-actions">
          <button type="button" class="nl-remove-food-btn" data-remove-entry="${entry.id}">${t("nutrition.removeFood")}</button>
          <button type="button" class="nl-done-btn" data-toggle-entry="${entry.id}">${t("common.done")}</button>
        </div>
      </div>
    `;
  }

  function ingredientMacroValues(ing) {
    const scale = ing.grams / 100;
    return {
      calories: Math.round(ing.baseCalories * scale),
      protein: Math.round(ing.baseProtein * scale),
      fat: Math.round(ing.baseFat * scale),
      carbs: Math.round(ing.baseCarbs * scale),
    };
  }

  // ---------- Entry hero: animated macro ring ----------
  // The centerpiece of an expanded entry: calories in the middle of a
  // donut whose colored arcs show where those calories come from
  // (protein=red, fat=amber, carbs=green — the app's macro colors).
  // Arc lengths/labels are patched IN PLACE by patchEntryHero() when an
  // amount is edited, so the CSS transition on the arcs makes the ring
  // visibly re-balance as you type — the numbers feel alive instead of
  // just swapping.
  const HERO_R = 40;
  const HERO_C = 2 * Math.PI * HERO_R;

  function heroGeometry(m) {
    const pK = Math.max(0, m.protein) * 4;
    const fK = Math.max(0, m.fat) * 9;
    const cK = Math.max(0, m.carbs) * 4;
    const tot = pK + fK + cK;
    const frac = (k) => (tot > 0 ? k / tot : 0);
    const pLen = HERO_C * frac(pK);
    const fLen = HERO_C * frac(fK);
    const cLen = HERO_C * frac(cK);
    return {
      pLen, fLen, cLen,
      pPct: Math.round(frac(pK) * 100),
      fPct: Math.round(frac(fK) * 100),
      cPct: Math.round(frac(cK) * 100),
    };
  }

  function heroSegStyle(len, offset) {
    return `stroke-dasharray:${len} ${HERO_C};stroke-dashoffset:${-offset};`;
  }

  function entryHeroHtml(entryId, m) {
    const t = RepCheckI18n.t;
    const g = heroGeometry(m);
    // Just dot + name + grams -- the % share of calories was extra number
    // noise a first-time user doesn't need (the ring already shows the mix).
    const macroRow = (dotClass, label, value) => `
      <div class="nl-hero-macro">
        <span class="nl-dot ${dotClass}"></span>
        <span class="nl-hero-macro-label">${label}</span>
        <span class="nl-hero-macro-value">${value}g</span>
      </div>
    `;
    return `
      <div class="nl-hero" data-entry-hero="${entryId}">
        <div class="nl-hero-ring">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="${HERO_R}" fill="none" stroke="var(--bg)" stroke-width="11"/>
            <circle class="nl-hero-seg nl-seg-protein" cx="50" cy="50" r="${HERO_R}" fill="none" stroke="var(--red)" stroke-width="11" style="${heroSegStyle(g.pLen, 0)}"/>
            <circle class="nl-hero-seg nl-seg-fat" cx="50" cy="50" r="${HERO_R}" fill="none" stroke="var(--amber)" stroke-width="11" style="${heroSegStyle(g.fLen, g.pLen)}"/>
            <circle class="nl-hero-seg nl-seg-carbs" cx="50" cy="50" r="${HERO_R}" fill="none" stroke="var(--green)" stroke-width="11" style="${heroSegStyle(g.cLen, g.pLen + g.fLen)}"/>
          </svg>

        <div class="nl-hero-macros">
          ${macroRow("nl-dot-protein", t("common.protein"), m.protein)}
          ${macroRow("nl-dot-fat", t("common.fat"), m.fat)}
          ${macroRow("nl-dot-carbs", t("common.carbs"), m.carbs)}
        </div>
      </div>
    `;
  }

  // In-place update (never innerHTML) so the focused amount <input> is
  // untouched and the arcs' CSS transition actually animates.
  function patchEntryHero(detail, m) {
    const hero = detail.querySelector("[data-entry-hero]");
    if (!hero) return;
    const g = heroGeometry(m);
    const seg = (cls, len, offset) => {
      const el = hero.querySelector(cls);
      el.style.strokeDasharray = `${len} ${HERO_C}`;
      el.style.strokeDashoffset = `${-offset}`;
    };
    seg(".nl-seg-protein", g.pLen, 0);
    seg(".nl-seg-fat", g.fLen, g.pLen);
    seg(".nl-seg-carbs", g.cLen, g.pLen + g.fLen);
    hero.querySelector(".nl-hero-kcal").textContent = m.calories;
    const values = hero.querySelectorAll(".nl-hero-macro-value");
    [m.protein, m.fat, m.carbs].forEach((v, i) => { values[i].textContent = `${v}g`; });
  }

  // Per-ingredient macro blocks: always visible, one tinted block per
  // value (same color language as the hero ring above), but sized well
  // below the dish-level ring so the hierarchy stays dish > ingredient.
  function ingMiniMacrosHtml(ing) {
    const t = RepCheckI18n.t;
    const v = ingredientMacroValues(ing);
    return `
      <span class="nl-ing-chip nl-ing-kcal"><span class="nl-ing-chip-value">${v.calories}</span><span class="nl-ing-chip-label">kcal</span></span>
      <span class="nl-ing-chip nl-ing-p"><span class="nl-ing-chip-value">${v.protein}g</span><span class="nl-ing-chip-label">${t("common.protein")}</span></span>
      <span class="nl-ing-chip nl-ing-f"><span class="nl-ing-chip-value">${v.fat}g</span><span class="nl-ing-chip-label">${t("common.fat")}</span></span>
      <span class="nl-ing-chip nl-ing-c"><span class="nl-ing-chip-value">${v.carbs}g</span><span class="nl-ing-chip-label">${t("common.carbs")}</span></span>
    `;
  }

  // ---------- Macro donut + micronutrients ----------
  // Shared by the scan-result popup (barcode/AI photo) and the log-food
  // amount popup, so "how much of this am I logging" looks and works the
  // same everywhere in the app. The ring shows the macro SPLIT (share of
  // calories from protein/fat/carbs), not their gram amounts directly —
  // that's the standard way nutrition apps visualize "balance" of a meal,
  // since a gram of fat (9 kcal) isn't equivalent to a gram of carbs/
  // protein (4 kcal each).
  function donutChartHtml(protein, fat, carbs, calories) {
    const proteinKcal = Math.max(0, protein) * 4;
    const fatKcal = Math.max(0, fat) * 9;
    const carbsKcal = Math.max(0, carbs) * 4;
    const totalKcal = proteinKcal + fatKcal + carbsKcal;
    const r = 46;
    const circumference = 2 * Math.PI * r;
    const proteinFrac = totalKcal > 0 ? proteinKcal / totalKcal : 0;
    const fatFrac = totalKcal > 0 ? fatKcal / totalKcal : 0;
    const carbsFrac = totalKcal > 0 ? carbsKcal / totalKcal : 0;
    const proteinLen = circumference * proteinFrac;
    const fatLen = circumference * fatFrac;
    const carbsLen = circumference * carbsFrac;

    const round1 = (v) => Math.round(v);

    return `
      <div class="mn-donut-row">
        <div class="mn-donut-wrap">
          <svg class="mn-donut" viewBox="0 0 120 120">
            <circle class="mn-donut-track" cx="60" cy="60" r="${r}"></circle>
            ${totalKcal > 0 ? `
              <circle class="mn-donut-seg mn-seg-protein" cx="60" cy="60" r="${r}"
                stroke-dasharray="${proteinLen} ${circumference}" stroke-dashoffset="0"
                transform="rotate(-90 60 60)"></circle>
              <circle class="mn-donut-seg mn-seg-fat" cx="60" cy="60" r="${r}"
                stroke-dasharray="${fatLen} ${circumference}" stroke-dashoffset="${-proteinLen}"
                transform="rotate(-90 60 60)"></circle>
              <circle class="mn-donut-seg mn-seg-carbs" cx="60" cy="60" r="${r}"
                stroke-dasharray="${carbsLen} ${circumference}" stroke-dashoffset="${-(proteinLen + fatLen)}"
                transform="rotate(-90 60 60)"></circle>
            ` : ""}
          </svg>
          <div class="mn-donut-center">
            <div class="mn-donut-calories">${Math.round(calories)}</div>
            <div class="mn-donut-calories-label">Calories</div>
          </div>
        </div>
        <div class="mn-macro-legend">
          <div class="mn-legend-row">
            <span class="mn-dot mn-dot-protein"></span>
            <span class="mn-legend-pct">${Math.round(proteinFrac * 100)}%</span>
            <span class="mn-legend-label">Protein</span>
            <span class="mn-legend-grams">${round1(protein)}g</span>
          </div>
          <div class="mn-legend-row">
            <span class="mn-dot mn-dot-fat"></span>
            <span class="mn-legend-pct">${Math.round(fatFrac * 100)}%</span>
            <span class="mn-legend-label">Fat</span>
            <span class="mn-legend-grams">${round1(fat)}g</span>
          </div>
          <div class="mn-legend-row">
            <span class="mn-dot mn-dot-carbs"></span>
            <span class="mn-legend-pct">${Math.round(carbsFrac * 100)}%</span>
            <span class="mn-legend-label">Carbs</span>
            <span class="mn-legend-grams">${round1(carbs)}g</span>
          </div>
        </div>
      </div>
    `;
  }

  function renderIngredientsPanel(entry) {
    const t = RepCheckI18n.t;
    const isOpen = INGREDIENTS_EXPANDED.has(entry.id);
    return `
      <div class="nl-ingredients">
        <button type="button" class="nl-ingredients-toggle ${isOpen ? "is-open" : ""}" data-toggle-ingredients="${entry.id}">
          <span>${t("nutrition.ingredientsCount", { n: entry.ingredients.length, action: isOpen ? t("nutrition.minimize") : t("nutrition.adjustAmounts") })}</span>
          ${CHEVRON_ICON}
        </button>
        ${isOpen ? `
          <div class="nl-ingredients-list">
            ${entry.ingredients.map((ing, i) => `
              <div class="nl-ingredient-row">

                    <select class="nl-unit-select" data-ingredient-unit-entry="${entry.id}" data-ingredient-unit-index="${i}">${unitOptionsHtml(ing.unit || "g")}</select>

  function findEntry(id) {
    return (log[selectedDate] || []).find((e) => e.id === id);
  }

  // Shared by the in-detail "Remove food" button and the swipe-to-delete
  // gesture: drop the entry from the selected day, re-render, and confirm
  // the removal server-side.
  function deleteEntry(id) {
    const dateForEntry = selectedDate;
    log[dateForEntry] = (log[dateForEntry] || []).filter((e) => e.id !== id);
    EXPANDED.delete(id);
    saveLog();
    renderTimeline();
    renderSummary();
    persistRemoveLogEntry(dateForEntry, id);
  }

  // ---------- Delete confirmation dialog ----------
  const nlConfirmOverlay = document.getElementById("nl-confirm-overlay");
  const nlConfirmSub = document.getElementById("nl-confirm-sub");
  let nlPendingDeleteId = null;
  function openDeleteConfirm(entry) {
    nlPendingDeleteId = entry.id;
    document.getElementById("nl-confirm-title").textContent = RepCheckI18n.t("nutrition.deleteConfirm.title");
    nlConfirmSub.textContent = entry.food;
    nlConfirmOverlay.classList.add("is-open");
  }
  function closeDeleteConfirm() {
    nlConfirmOverlay.classList.remove("is-open");
    nlPendingDeleteId = null;
  }
  if (nlConfirmOverlay) {
    document.getElementById("nl-confirm-cancel").addEventListener("click", closeDeleteConfirm);
    nlConfirmOverlay.addEventListener("click", (e) => { if (e.target === nlConfirmOverlay) closeDeleteConfirm(); });
    document.getElementById("nl-confirm-delete").addEventListener("click", () => {
      if (nlPendingDeleteId) deleteEntry(nlPendingDeleteId);
      closeDeleteConfirm();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && nlConfirmOverlay.classList.contains("is-open")) closeDeleteConfirm();
    });
  }

  // ---------- Swipe-to-delete on logged foods ----------
  // Drag a card right-to-left to reveal a red "Delete" panel behind it;
  // tapping Delete asks to confirm. Uses Pointer Events so it works for both
  // touch and mouse, and distinguishes a horizontal swipe from a vertical
  // scroll (bails to native scroll when the drag is mostly vertical) and
  // from a plain tap (which still expands/collapses the card).
  function wireSwipeToDelete() {
    const OPEN_W = 98; // must match .nl-swipe-delete width in CSS
    let openSwipe = null;

    function closeSwipe(swipe) {
      if (!swipe) return;
      swipe.classList.remove("is-open");
      const c = swipe.querySelector(".nl-swipe-content");
      if (c) c.style.transform = "";
      if (openSwipe === swipe) openSwipe = null;
    }

    timelineEl.querySelectorAll(".nl-swipe").forEach((swipe) => {
      const content = swipe.querySelector(".nl-swipe-content");
      if (!content) return;
      let startX = 0, startY = 0, base = 0, offset = 0;
      let dragging = false, decided = false, moved = false;

      function apply(x) {
        offset = Math.max(-OPEN_W, Math.min(0, x));
        content.style.transform = `translateX(${offset}px)`;
      }

      content.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        startX = e.clientX; startY = e.clientY;
        base = swipe.classList.contains("is-open") ? -OPEN_W : 0;
        dragging = true; decided = false; moved = false;
      });

      content.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (!decided) {
          if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
          if (Math.abs(dy) >= Math.abs(dx)) { dragging = false; return; } // vertical -> let the page scroll
          decided = true;
          swipe.classList.add("is-dragging");
          try { content.setPointerCapture(e.pointerId); } catch (err) {}
          if (openSwipe && openSwipe !== swipe) closeSwipe(openSwipe);
        }
        moved = true;
        e.preventDefault();
        apply(base + dx);
      });

      function endDrag() {
        if (!dragging) return;
        dragging = false;
        swipe.classList.remove("is-dragging");
        if (!decided) return;
        if (offset <= -OPEN_W / 2) {
          swipe.classList.add("is-open");
          content.style.transform = `translateX(${-OPEN_W}px)`;
          openSwipe = swipe;
        } else {
          closeSwipe(swipe);
        }
      }
      content.addEventListener("pointerup", endDrag);
      content.addEventListener("pointercancel", endDrag);

      // Capture-phase so this runs before the card's own expand-toggle click:
      // swallow the click right after a swipe, and turn a tap on an already-
      // open row into "just close it" instead of expanding.
      content.addEventListener("click", (e) => {
        if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; return; }
        if (swipe.classList.contains("is-open")) { e.stopPropagation(); e.preventDefault(); closeSwipe(swipe); }
      }, true);

      const delBtn = swipe.querySelector("[data-swipe-delete]");
      if (delBtn) {
        delBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const entry = findEntry(delBtn.dataset.swipeDelete);
          if (entry) openDeleteConfirm(entry);
        });
      }
    });
  }

  function wireTimelineEvents() {
    timelineEl.querySelectorAll("[data-toggle-entry]").forEach((el) => {
      el.addEventListener("click", (event) => {
        event.stopPropagation();
        const id = el.dataset.toggleEntry;
        if (EXPANDED.has(id)) EXPANDED.delete(id); else EXPANDED.add(id);
        renderTimeline();
      });
    });

    timelineEl.querySelectorAll("[data-entry-fav-toggle]").forEach((btn) => {
      btn.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleFavorite(btn.dataset.entryFavToggle);
        renderTimeline();
      });
    });

    timelineEl.querySelectorAll("[data-remove-entry]").forEach((btn) => {
      btn.addEventListener("click", (event) => {
        event.stopPropagation();
        deleteEntry(btn.dataset.removeEntry);
      });
    });

    wireSwipeToDelete();

    timelineEl.querySelectorAll("[data-grams-entry]").forEach((input) => {
      input.addEventListener("click", (event) => event.stopPropagation());
      input.addEventListener("input", () => {
        const entry = findEntry(input.dataset.gramsEntry);
        if (!entry) return;

        const value = parseFloat(input.value);
        const grams = unitToGrams(value, entry.unit || "g");
        entry.grams = grams > 0 ? grams : entry.grams;
        saveLog();

        // Patch just the numbers in place instead of calling
        // renderTimeline(), which would destroy and recreate this very
        // input mid-keystroke and kick focus (and the mobile keyboard)
        // back up to the top of the page.
        const m = scaledMacros(entry);
        const detail = input.closest(".nl-entry-detail");
        patchEntryHero(detail, m);

        const card = detail.previousElementSibling;
        if (card && card.classList.contains("nl-entry-card")) {
          card.querySelector(".nl-entry-sub").textContent =
            `${formatTime(entry.addedAt)} • ${Math.round(entryTotals(entry).grams)}g • ${m.calories} kcal`;
        }

        renderSummary();
      });
    });

    // Total-amount editor for composite dishes: scales every ingredient's
    // grams proportionally so the dish's overall macros stay consistent
    // with its recipe instead of just editing one number in isolation.
    timelineEl.querySelectorAll("[data-total-grams-entry]").forEach((input) => {
      input.addEventListener("click", (event) => event.stopPropagation());
      input.addEventListener("input", () => {
        const entry = findEntry(input.dataset.totalGramsEntry);
        if (!entry || !entry.ingredients || !entry.ingredients.length) return;

        const newTotal = parseFloat(input.value);
        const oldTotal = entryTotals(entry).grams;
        if (!(newTotal > 0) || !(oldTotal > 0)) return;

        const scale = newTotal / oldTotal;
        entry.ingredients.forEach((ing) => { ing.grams = ing.grams * scale; });
        saveLog();

        // Patch every visible number in place (this input's own focus, and
        // any other open ingredient rows, must not be destroyed mid-type).
        const detail = input.closest(".nl-entry-detail");

        detail.querySelectorAll("[data-ingredient-entry]").forEach((gramsInput) => {
          const idx = parseInt(gramsInput.dataset.ingredientIndex, 10);
          const ing = entry.ingredients[idx];
          gramsInput.value = gramsToUnit(ing.grams, ing.unit || "g");
          const row = gramsInput.closest(".nl-ingredient-row");
          const miniMacros = row.querySelector("[data-ing-macros]");
          if (miniMacros) miniMacros.innerHTML = ingMiniMacrosHtml(ing);
        });

        const m = scaledMacros(entry);
        patchEntryHero(detail, m);

        const card = detail.previousElementSibling;
        if (card && card.classList.contains("nl-entry-card")) {
          card.querySelector(".nl-entry-sub").textContent =
            `${formatTime(entry.addedAt)} • ${Math.round(entryTotals(entry).grams)}g • ${m.calories} kcal`;
        }

        renderSummary();
      });
    });

    timelineEl.querySelectorAll("[data-toggle-ingredients]").forEach((btn) => {
      btn.addEventListener("click", (event) => {
        event.stopPropagation();
        const id = btn.dataset.toggleIngredients;
        if (INGREDIENTS_EXPANDED.has(id)) INGREDIENTS_EXPANDED.delete(id); else INGREDIENTS_EXPANDED.add(id);
        renderTimeline();
      });
    });

    timelineEl.querySelectorAll("[data-ingredient-entry]").forEach((input) => {
      input.addEventListener("click", (event) => event.stopPropagation());
      input.addEventListener("input", () => {
        const entry = findEntry(input.dataset.ingredientEntry);
        if (!entry) return;
        const idx = parseInt(input.dataset.ingredientIndex, 10);
        const value = parseFloat(input.value);
        const grams = unitToGrams(value, entry.ingredients[idx].unit || "g");
        entry.ingredients[idx].grams = grams >= 0 ? grams : entry.ingredients[idx].grams;
        saveLog();

        // Same in-place patching approach as the simple-food amount input:
        // update this ingredient's own macro strip, the entry's hero ring,
        // and the collapsed card's subtitle, without touching the focused
        // <input> itself.
        const ing = entry.ingredients[idx];
        const row = input.closest(".nl-ingredient-row");
        const miniMacros = row.querySelector("[data-ing-macros]");
        if (miniMacros) miniMacros.innerHTML = ingMiniMacrosHtml(ing);

        const m = scaledMacros(entry);
        const detail = input.closest(".nl-entry-detail");
        patchEntryHero(detail, m);

        // The "Total amount" field is just a scaling control, not the
        // source of truth — keep it in sync with the real ingredient sum
        // whenever a raw ingredient's own amount changes.
        const totalGramsInput = detail.querySelector("[data-total-grams-entry]");
        if (totalGramsInput && document.activeElement !== totalGramsInput) {
          totalGramsInput.value = Math.round(entryTotals(entry).grams);
        }

        const card = detail.previousElementSibling;
        if (card && card.classList.contains("nl-entry-card")) {
          card.querySelector(".nl-entry-sub").textContent =
            `${formatTime(entry.addedAt)} • ${Math.round(entryTotals(entry).grams)}g • ${m.calories} kcal`;
        }

        renderSummary();
      });
    });

    // Changing the unit only changes what's displayed/typed — the
    // canonical amount stays in grams, so no macro recompute is needed.
    timelineEl.querySelectorAll("[data-amount-unit-entry]").forEach((select) => {
      select.addEventListener("click", (event) => event.stopPropagation());
      select.addEventListener("change", () => {
        const entry = findEntry(select.dataset.amountUnitEntry);
        if (!entry) return;
        entry.unit = select.value;
        saveLog();
        const amountInput = select.parentElement.querySelector("[data-grams-entry]");
        if (amountInput) amountInput.value = gramsToUnit(entry.grams, entry.unit);
      });
    });

    timelineEl.querySelectorAll("[data-ingredient-unit-entry]").forEach((select) => {
      select.addEventListener("click", (event) => event.stopPropagation());
      select.addEventListener("change", () => {
        const entry = findEntry(select.dataset.ingredientUnitEntry);
        if (!entry) return;
        const idx = parseInt(select.dataset.ingredientUnitIndex, 10);
        const ing = entry.ingredients[idx];
        ing.unit = select.value;
        saveLog();
        const gramsInput = select.parentElement.querySelector("[data-ingredient-entry]");
        if (gramsInput) gramsInput.value = gramsToUnit(ing.grams, ing.unit);
      });
    });

    timelineEl.querySelectorAll("[data-add-ingredient]").forEach((btn) => {
      btn.addEventListener("click", (event) => {
        event.stopPropagation();
        openAddIngredientModal(btn.dataset.addIngredient);
      });
    });

    timelineEl.querySelectorAll("[data-remove-ingredient-entry]").forEach((btn) => {
      btn.addEventListener("click", (event) => {
        event.stopPropagation();
        const entry = findEntry(btn.dataset.removeIngredientEntry);
        if (!entry || !entry.ingredients) return;
        const idx = parseInt(btn.dataset.removeIngredientIndex, 10);
        entry.ingredients.splice(idx, 1);
        saveLog();
        renderTimeline();
        renderSummary();
      });
    });
  }

  async function addFoodToSelectedDay(name, gramsOverride) {
    const food = foodByName(name);
    if (!food) return;
    const dateForEntry = selectedDate;
    if (!log[dateForEntry]) log[dateForEntry] = [];

    const now = new Date();
    const addedAt = new Date(dateForEntry + "T00:00:00");
    if (pendingHour !== null) {
      // Logged via a specific hour row's "+" button — put it at that hour
      // rather than the real current time.
      addedAt.setHours(pendingHour, 0, 0, 0);
    } else {
      addedAt.setHours(now.getHours(), now.getMinutes(), now.getSeconds(), 0);
    }
    pendingHour = null;

    const id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
    const entry = { id, food: food.name, addedAt: addedAt.getTime() };

    if (food.ingredients && food.ingredients.length) {
      // Composite dish: denormalize each ingredient's own per-100g macros
      // (looked up from the library) plus its default recipe amount, so
      // it's independently adjustable and edits recalculate the whole
      // dish's totals.
      entry.ingredients = food.ingredients.map((ing) => {
        const base = foodByName(ing.name) || { calories: 0, carbs: 0, fat: 0, protein: 0 };
        return {
          name: ing.name,
          grams: ing.grams,
          unit: "g",
          baseCalories: base.calories,
          baseCarbs: base.carbs,
          baseFat: base.fat,
          baseProtein: base.protein,
        };
      });
      // The amount-confirm popup lets the user pick a different total than
      // the recipe's own default — scale every ingredient proportionally
      // so the dish's macro ratios stay correct at the new amount.
      if (gramsOverride > 0) {
        const defaultTotal = entry.ingredients.reduce((sum, ing) => sum + ing.grams, 0);
        if (defaultTotal > 0) {
          const scale = gramsOverride / defaultTotal;
          entry.ingredients.forEach((ing) => { ing.grams = ing.grams * scale; });
        }
      }
    } else {
      entry.grams = gramsOverride > 0 ? gramsOverride : 100;
      entry.unit = "g";
      entry.baseCalories = food.calories;
      entry.baseCarbs = food.carbs;
      entry.baseFat = food.fat;
      entry.baseProtein = food.protein;
    }

    log[dateForEntry].push(entry);
    EXPANDED.add(id);
    saveLog();
    renderTimeline();
    renderSummary();
    await persistLogEntry(dateForEntry, entry);
  }

  function addIngredientToEntry(entryId, foodName) {
    const entry = findEntry(entryId);
    const base = foodByName(foodName);
    if (!entry || !base) return;

    if (!entry.ingredients) {
      // Turn a simple food entry into a composite one, keeping its
      // current amount as the first ingredient (itself).
      entry.ingredients = [{
        name: entry.food,
        grams: entry.grams,
        unit: entry.unit || "g",
        baseCalories: entry.baseCalories,
        baseCarbs: entry.baseCarbs,
        baseFat: entry.baseFat,
        baseProtein: entry.baseProtein,
      }];
      delete entry.grams;
      delete entry.unit;
      delete entry.baseCalories;
      delete entry.baseCarbs;
      delete entry.baseFat;
      delete entry.baseProtein;
    }

    entry.ingredients.push({
      name: base.name,
      grams: 50,
      unit: "g",
      baseCalories: base.calories,
      baseCarbs: base.carbs,
      baseFat: base.fat,
      baseProtein: base.protein,
    });

    EXPANDED.add(entryId);
    INGREDIENTS_EXPANDED.add(entryId); // reveal the panel so they can see/adjust what was just added
    saveLog();
    renderTimeline();
    renderSummary();
  }

  document.getElementById("nl-prev-week").addEventListener("click", () => {
    weekStart.setDate(weekStart.getDate() - 7);
    weekStart = new Date(weekStart);
    renderDateStrip();
  });
  document.getElementById("nl-next-week").addEventListener("click", () => {
    weekStart.setDate(weekStart.getDate() + 7);
    weekStart = new Date(weekStart);
    renderDateStrip();
  });

  renderDateStrip();
  renderTimeline();
  renderSummary();
  loadCustomFoods();
  document.addEventListener("repcheck:language-changed", () => {
    renderTimeline();
    renderSummary();
  });
  // Clock format (12h/24h) affects hour labels and logged-entry times —
  // re-render so switching it in Settings updates immediately, no reload.
  document.addEventListener("repcheck:units-changed", () => {
    renderTimeline();
  });
  // The coaching module writes new goals straight into this page's own
  // "repcheck_nutrition_goals_v1" key when it calculates/adjusts a
  // target — re-read them here so Today's Totals updates immediately
  // instead of waiting for a reload.
  document.addEventListener("repcheck:goals-updated", () => {
    goals = loadGoals();
    renderSummary();
  });

  // ---------- Mobile FAB quick actions ("Scan a meal" / "Log today's
  // weight" land here with ?quick=... — see base.html's mt-fab-sheet). ----------
  (function handleQuickAction() {
    const quick = new URLSearchParams(location.search).get("quick");
    if (!quick) return;
    history.replaceState(null, "", location.pathname); // don't re-trigger on refresh

    if (quick === "scan") {
      // The FAB/home "Scan a meal" tile only needs the two photo paths
      // plus recent re-logging -- barcode/create-food/log-macros stay
      // reachable from the full "Analyze a food photo" button instead.
      window.openBottomSheet(afModalOverlay, ".af-modal");
      renderAfMealQuickChoice();
      return;
    }
    if (quick === "barcode") {
      // Browsers drop "user activation" across a page navigation, so
      // afBarcodeInput.click() here (post-navigation) is silently
      // blocked -- can't auto-open the camera. base.html's FAB handler
      // already avoids this navigation entirely when it can (clicking
      // the camera input directly while still on this page); this path
      // only runs when a navigation from another page was unavoidable,
      // so show one single-tap prompt instead of a silent no-op.
      window.openBottomSheet(afModalOverlay, ".af-modal");
      renderAfBarcodeQuickPrompt();
      return;
    }
    if (quick === "checkin") {
      // Deep link from the home page's "ready to check in" banner (see
      // templates/home.html). The "Check in" button in Today's Totals
      // always exists in the DOM but starts disabled until coaching.js
      // (loaded after this script) mounts and confirms it's actually due
      // — poll briefly for it to become enabled rather than assuming.
      let attempts = 0;
      const tryOpenCheckin = () => {
        const btn = document.querySelector('[data-action="open-checkin"]');
        if (btn && !btn.disabled) {
          btn.click();
        } else if (attempts++ < 20) {
          setTimeout(tryOpenCheckin, 100);
        }
      };
      tryOpenCheckin();
    }
  })();
</script>
<script src="{{ asset_url('coaching.js') }}"></script>
{% endblock %}
