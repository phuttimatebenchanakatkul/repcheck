{% extends "base.html" %}

{% block title %}RepCheck - Nutrition{% endblock %}
{% block heading %}Nutrition Log{% endblock %}

{% block content %}
<div class="nl-summary-card" id="nl-summary-card">
  <div class="nl-summary">
    <div class="nl-summary-head">
      <div class="nl-summary-title" data-i18n="nutrition.totals.title">Today's Totals</div>
      <div class="nl-summary-head-actions">
        <!--
          Weekly check-in entry point. Starts grey and inert (matches the
          "no profile yet" and "not due yet" states) — static/coaching.js's
          syncCheckinButton() adds .is-ready and enables it the moment the
          check-in is actually due, and disables it again right after.
        -->
        <button type="button" class="nl-checkin-btn" id="nl-checkin-btn" data-action="open-checkin" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span data-i18n="coaching.checkin.button">Check in</span>
        </button>
        <!-- Opens the SAME nutrition-question wizard as first-time
             onboarding (static/coaching.js's openWizard(), delegated via
             document-level click handling) instead of letting the user
             type raw macro/calorie numbers directly -- re-answering the
             goal/activity/protein/diet questions keeps the numbers
             internally consistent (protein-per-kg-lean-mass, fat/carb
             split by diet type, etc.) instead of letting them drift out
             of that relationship. -->
        <button type="button" class="nl-goals-toggle" id="nl-goals-toggle" data-action="open-wizard" data-i18n="nutrition.totals.editGoals">Edit goals</button>
      </div>
    </div>

    <div class="nl-hero-row">
      <div class="nl-cal-ring-wrap" id="nl-cal-ring-wrap" role="button" tabindex="0" aria-label="Toggle between calories left and calories consumed">
        <svg class="nl-cal-ring" viewBox="0 0 120 120">
          <defs>
            <linearGradient id="nl-cal-ring-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4d7ff5"/>
              <stop offset="100%" stop-color="#2f66e8"/>
            </linearGradient>
            <linearGradient id="nl-cal-ring-gradient-over" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#e8837b"/>
              <stop offset="100%" stop-color="#d1453b"/>
            </linearGradient>
          </defs>
          <circle class="nl-cal-ring-track" cx="60" cy="60" r="52"/>
          <circle class="nl-cal-ring-fill" id="nl-cal-ring-fill" cx="60" cy="60" r="52"/>
        </svg>
        <div class="nl-cal-ring-center">
          <div class="nl-cal-ring-value" id="nl-cal-ring-value">0</div>
          <!-- No data-i18n here: this label is fully dynamic (left/over/
               consumed, decided by renderSummary()), so a static data-i18n
               attribute would let applyI18n()'s DOMContentLoaded pass stomp
               it back to a hardcoded "kcal left" right after load -- which
               is exactly what silently happened whenever the goal was over
               (label flashed "kcal over" then reverted). -->
          <div class="nl-cal-ring-label" id="nl-cal-ring-label">kcal left</div>
          <div class="nl-cal-ring-sub" id="nl-cal-ring-sub">0 / 2000</div>
        </div>
      </div>

      <div class="nl-macro-pills">
        <div class="nl-macro-pill">
          <div class="nl-macro-pill-head">
            <span class="nl-macro-icon nl-icon-protein"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><path d="M5 12h1M18 12h1"/><rect x="6.5" y="7" width="2" height="10" rx="1"/><rect x="15.5" y="7" width="2" height="10" rx="1"/><path d="M8.5 12h7"/></svg></span>
            <span class="nl-macro-pill-label" data-i18n="common.protein">Protein</span>
          </div>
          <div class="nl-macro-pill-value"><span id="nl-protein-total">0</span><span class="nl-macro-goal">/<span id="nl-protein-goal">150</span>g</span></div>
          <div class="nl-progress"><div class="nl-progress-fill nl-fill-protein" id="nl-protein-fill"></div></div>
        </div>
        <div class="nl-macro-pill">
          <div class="nl-macro-pill-head">
            <span class="nl-macro-icon nl-icon-fat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69s5.66 5.86 8 10.09A8 8 0 1 1 4 12.78C6.34 8.55 12 2.69 12 2.69z"/></svg></span>
            <span class="nl-macro-pill-label" data-i18n="common.fat">Fat</span>
          </div>
          <div class="nl-macro-pill-value"><span id="nl-fat-total">0</span><span class="nl-macro-goal">/<span id="nl-fat-goal">70</span>g</span></div>
          <div class="nl-progress"><div class="nl-progress-fill nl-fill-fat" id="nl-fat-fill"></div></div>
        </div>
        <div class="nl-macro-pill">
          <div class="nl-macro-pill-head">
            <span class="nl-macro-icon nl-icon-carbs"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 22 1-1h3l9-9"/><path d="M3.5 19.5 12 11"/><path d="M18 3a2.83 2.83 0 0 0-2.83 2.83c0 1.14.65 2.05 1.65 2.9C17.65 9.36 18 10.5 18 11a3 3 0 0 0 3-3c0-1.5-1-2.5-1.83-3.17C18.35 4.05 18 3.14 18 3Z"/><path d="M13 8a2.83 2.83 0 0 0-2.83 2.83c0 1.14.65 2.05 1.65 2.9.83.7 1.18 1.85 1.18 2.35a3 3 0 0 0 3-3c0-1.5-1-2.5-1.83-3.17C13.35 9.05 13 8.14 13 8Z"/><path d="M8 13a2.83 2.83 0 0 0-2.83 2.83c0 1.14.65 2.05 1.65 2.9.83.7 1.18 1.85 1.18 2.35a3 3 0 0 0 3-3c0-1.5-1-2.5-1.83-3.17C8.35 14.05 8 13.14 8 13Z"/></svg></span>
            <span class="nl-macro-pill-label" data-i18n="common.carbs">Carbs</span>
          </div>
          <div class="nl-macro-pill-value"><span id="nl-carbs-total">0</span><span class="nl-macro-goal">/<span id="nl-carbs-goal">250</span>g</span></div>
          <div class="nl-progress"><div class="nl-progress-fill nl-fill-carbs" id="nl-carbs-fill"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- AI photo analysis, the one action worth a dedicated button up here.
       Manual macro entry ("Quick add") used to sit beside it, but it's a
       fallback for when a food isn't in the library -- which is something
       you only discover AFTER searching. It now lives at the bottom of the
       "Log a food" sheet (manualMacroCtaHtml()), where that realisation
       actually happens, instead of competing for attention before the user
       has even looked. Both still open the same af-modal; openQuickMacroModal
       jumps straight to the macro form. -->
  <div class="nl-quick-actions-row">
    <button type="button" class="nl-scan-btn" id="nl-scan-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Analyze a food photo
    </button>
  </div>
</div>

<!--
  Food log, its own card sibling to nl-summary-card above -- matches the
  workout log's split between .wl-plan-card and .wl-page instead of
  nesting everything (totals, date strip, log button, entry list) inside
  one big card. A prominent primary button on top (opens the same search
  popup and logs at the current wall-clock time — pendingHour stays null,
  so addFoodToSelectedDay() uses `new Date()`; the modal's own "Log at"
  selector still lets a user backdate an entry), then either a rounded-card
  list of entries or a calm empty state. Same layout whether or not
  anything is logged yet.
-->
<div class="nl-page" id="nl-page">
  <div class="nl-date-strip-wrap">
    <button type="button" class="nl-week-nav" id="nl-prev-week" aria-label="Previous week">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="nl-date-strip" id="nl-date-strip"></div>
    <button type="button" class="nl-week-nav" id="nl-next-week" aria-label="Next week">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <div class="nl-day-head" id="nl-day-head"></div>
  <button type="button" class="nl-log-btn" id="nl-log-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span data-i18n="nutrition.logFood">Log a food</span>
  </button>
  <div class="nl-timeline" id="nl-timeline"></div>
</div>

<!--
  Weight tracking + daily-logging cards live in their own module
  (static/coaching.js/css) rather than more inline script in this already-
  large file. Placed BELOW the main log card so "Today's Totals" leads the
  page. It reads this page's localStorage keys (goals, nutrition log)
  directly and the two sides stay in sync via a "repcheck:goals-updated"
  event.
-->
<div id="coaching-root"></div>
<link rel="stylesheet" href="{{ asset_url('coaching.css') }}">

<!-- Confirm-before-delete dialog for the swipe-to-delete gesture on a
     logged food (see wireSwipeToDelete). Deliberately a real confirm
     step, not an instant delete, so a stray swipe + tap can't wipe an entry. -->
<div class="nl-confirm-overlay" id="nl-confirm-overlay">
  <div class="nl-confirm">
    <div class="nl-confirm-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
    </div>
    <div class="nl-confirm-title" id="nl-confirm-title">Delete this food?</div>
    <div class="nl-confirm-sub" id="nl-confirm-sub"></div>
    <div class="nl-confirm-actions">
      <button type="button" class="nl-confirm-cancel" id="nl-confirm-cancel" data-i18n="common.cancel">Cancel</button>
      <button type="button" class="nl-confirm-delete" id="nl-confirm-delete" data-i18n="nutrition.swipeDelete">Delete</button>
    </div>
  </div>
</div>

<div class="af-modal-overlay" id="af-modal-overlay">
  <div class="af-modal">
    <div class="af-modal-handle"></div>
    <div class="af-modal-header">
      <div class="af-modal-title" id="af-modal-title">Analyze a food photo</div>
      <button type="button" class="nl-modal-close" id="af-modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="af-modal-body" id="af-modal-body"></div>
  </div>
  <!-- Kept outside af-modal-body (which gets fully replaced on every
       render) so a direct-camera quick action can trigger these without
       first rendering any choice screen. The "capture" attribute opens
       the device's native camera app directly (works over plain HTTP,
       unlike getUserMedia which needs a secure context) -- "Upload"
       omits it to open the normal file/gallery picker instead. -->
  <input type="file" id="af-camera-input" accept="image/*" capture="environment" style="display:none;">
  <input type="file" id="af-upload-input" accept="image/*" style="display:none;">
  <input type="file" id="af-barcode-input" accept="image/*" capture="environment" style="display:none;">
</div>

<!-- Confirm-amount step shown before logging a food picked from search/
     quick-add/favorites. Uses the shared Apple-style logging bottom sheet
     (.log-sheet-* in style.css) so it slides up from the bottom exactly
     like the "+" menu and the food-search sheet it opens from. IDs are
     unchanged so the amount JS below keeps driving it. -->
<div class="log-sheet-overlay" id="lq-modal-overlay">
  <div class="log-sheet">
    <div class="log-sheet-handle"></div>
    <div class="log-sheet-head">
      <div class="lq-title" id="lq-modal-title">Log food</div>
      <button type="button" class="log-sheet-close" id="lq-modal-close" data-i18n-aria-label="common.close" aria-label="Close">&times;</button>
    </div>
    <div class="log-sheet-body" id="lq-modal-body"></div>
  </div>
</div>

<!-- Add-food picker -- the shared Apple-style logging bottom sheet (see
     .log-sheet-* in style.css). Search settles in first, then favorites /
     top picks for this hour / recent. IDs are unchanged so the food-search
     JS below keeps driving it. The old "Add food" title row is dropped for
     the cleaner "+"-sheet look; the "Top picks for {hour}" section header
     already carries the when-context. -->
<div class="log-sheet-overlay" id="nl-modal-overlay">
  <div class="log-sheet">
    <div class="log-sheet-handle"></div>
    <div class="log-sheet-head">
      <div class="log-sheet-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="modal-food-search" data-i18n-placeholder="nutrition.search.placeholder" placeholder="Search for a food..." autocomplete="off">
      </div>
      <button type="button" class="log-sheet-close" id="nl-modal-close" data-i18n-aria-label="common.close" aria-label="Close">&times;</button>
    </div>
    <div class="log-sheet-body nl-modal-results" id="modal-food-results"></div>
  </div>
</div>

<style>
  /* Reuses the site's global theme variables so it matches whichever
     light/dark theme is active, same as the Workouts page. */

  .nl-page {
    background: var(--card-bg);
    color: var(--text);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 24px;
  }

  /* Sibling card above .nl-page -- holds Today's Totals + the photo-scan
     entry point, mirroring the workout log's standalone .wl-plan-card. */
  .nl-summary-card {
    background: var(--card-bg);
    color: var(--text);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 16px;
  }

  /* ---------- Summary / goals ---------- */

  .nl-summary { margin-bottom: 20px; }

  .nl-summary-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 8px;
    margin-bottom: 14px;
  }
  .nl-summary-title { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
  .nl-summary-head-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  /* Grey and inert by default (not due yet, or no coaching profile);
     static/coaching.js's syncCheckinButton() adds .is-ready and lifts
     `disabled` the moment the weekly check-in is actually available, so
     tapping it never feels like an ask until it's genuinely ready. */
  .nl-checkin-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    cursor: not-allowed;
    opacity: 0.6;
    transition: opacity 0.15s ease, border-color 0.15s ease, transform 0.1s ease, background-color 0.15s ease, color 0.15s ease;
  }
  .nl-checkin-btn svg { flex-shrink: 0; }
  .nl-checkin-btn.is-ready {
    cursor: pointer;
    opacity: 1;
    border-color: transparent;
    background: linear-gradient(135deg, #4d7ff5, var(--blue));
    color: #fff;
    box-shadow: 0 4px 12px rgba(47, 102, 232, 0.32);
  }
  .nl-checkin-btn.is-ready:active { transform: scale(0.94); }
  .nl-goals-toggle {
    min-height: 44px; box-sizing: border-box;
    padding: 7px 15px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .nl-goals-toggle:hover { border-color: var(--blue); color: var(--blue); }
  .nl-goals-toggle:active { transform: scale(0.94); }

  .nl-save-goals-btn {
    grid-column: 1 / -1;
    min-height: 44px; box-sizing: border-box;
    padding: 9px 14px;
    border-radius: 999px;
    border: none;
    background: var(--text);
    color: var(--bg);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .nl-save-goals-btn:hover { opacity: 0.85; }

  /* Today's Totals hero: a calorie progress RING as the headline visual
     (the number people actually check -- "how much can I still eat
     today") with the three macros as compact supporting pills below it,
     instead of four equal-weight boxes in a grid. */
  .nl-hero-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  /* 168px is sized off the ring's INNER circle, not the wrap: with a 120-unit
     viewBox, r=52 and stroke-width 10, the usable inner diameter is only
     47/60 of the wrap. At the old 152px the widest label ("kcal consumed",
     and its Thai equivalent, both ~115px) had 0.4px of clearance and visually
     collided with the stroke. 168px leaves ~7px each side. */
  .nl-cal-ring-wrap {
    position: relative; width: 168px; height: 168px; flex-shrink: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    border-radius: 50%;
    transition: transform 0.1s ease;
  }
  .nl-cal-ring-wrap:active { transform: scale(0.96); }
  .nl-cal-ring-wrap:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  .nl-cal-ring { width: 100%; height: 100%; transform: rotate(-90deg); }
  .nl-cal-ring-track { fill: none; stroke: var(--bg); stroke-width: 10; }
  .nl-cal-ring-fill {
    fill: none;
    stroke: url(#nl-cal-ring-gradient);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.3s ease;
  }
  .nl-cal-ring-fill.is-over { stroke: url(#nl-cal-ring-gradient-over); }
  .nl-cal-ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .nl-cal-ring-value { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .nl-cal-ring-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 2px; }
  .nl-cal-ring-sub { font-size: 11px; color: var(--text-secondary); margin-top: 6px; }

  .nl-macro-pills {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
  }
  .nl-macro-pill {
    background: var(--bg);
    border-radius: 14px;
    padding: 11px 12px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .nl-macro-pill:hover { box-shadow: 0 6px 18px rgba(20, 20, 20, 0.06); }
  .nl-macro-pill:active { transform: scale(0.97); }
  .nl-macro-pill-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .nl-macro-pill-label { font-size: 10.5px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.02em; }
  .nl-macro-pill-value { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
  /* Small colored badge behind each icon instead of a bare stroke icon --
     ties the macro's accent color to a proper chip, matching the
     icon-chip language used on the home page's tiles. */
  .nl-macro-icon {
    display: flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0;
  }
  .nl-icon-protein { color: var(--red); background: var(--red-bg); }
  .nl-icon-fat { color: var(--amber); background: var(--amber-bg); }
  .nl-icon-carbs { color: var(--green); background: var(--green-bg); }
  .nl-macro-goal { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-left: 1px; }
  .nl-progress {
    margin-top: 10px;
    height: 7px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }
  .nl-progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .nl-fill-calories { background: linear-gradient(90deg, var(--blue), #6d94f2); }
  .nl-fill-protein { background: linear-gradient(90deg, var(--red), #e8837b); }
  .nl-fill-fat { background: linear-gradient(90deg, var(--amber), #d4a85c); }
  .nl-fill-carbs { background: linear-gradient(90deg, var(--green), #5cc99a); }

  /* ---------- Date strip ---------- */

  .nl-date-strip-wrap { display: flex; align-items: center; gap: 6px; }
  .nl-week-nav {
    background: none; border: none; color: var(--text-secondary);
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .nl-week-nav:hover { color: var(--text); }
  .nl-week-nav:active { transform: scale(0.88); }
  .nl-date-strip { flex: 1; display: flex; justify-content: space-between; gap: 4px; }
  .nl-date-cell {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: none; border: none; color: var(--text-secondary); cursor: pointer;
    padding: 4px 0; font-family: inherit;
  }
  .nl-date-weekday { font-size: 11px; font-weight: 700; letter-spacing: 0.02em; }
  .nl-date-number {
    width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 14px; font-weight: 700; color: var(--text);
    background: var(--bg);
    transition: background-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease, transform 0.1s ease;
  }
  .nl-date-cell:active .nl-date-number { transform: scale(0.9); }
  .nl-date-cell.is-today .nl-date-number { box-shadow: inset 0 0 0 2px var(--blue); }
  .nl-date-cell.is-selected .nl-date-number {
    background: linear-gradient(135deg, var(--blue), #5c86ef);
    color: #fff;
    box-shadow: 0 4px 12px rgba(47, 102, 232, 0.35);
  }
  /* A soft green dot marks days that already have food logged -- mirrors
     the workout log's .wl-date-dot streak cue. */
  .nl-date-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--green);
  }
  .nl-date-dot.is-empty { background: transparent; }

  /* ---------- Analyze-a-photo + manual-macro entry points + modal ---------- */

  /* Single-child row now that "Quick add" moved into the Log a food sheet.
     Kept as a flex row (rather than collapsing to the bare button) so
     .nl-scan-btn's flex:1 still stretches it full width, and so the spacing
     below the macro card stays owned by one rule. */
  .nl-quick-actions-row { display: flex; align-items: stretch; gap: 10px; }

  .nl-scan-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    flex: 1;
    min-width: 0;
    padding: 15px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #4d7ff5, var(--blue));
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .nl-scan-btn:hover { opacity: 0.92; transform: translateY(-1px); }
  .nl-scan-btn:active { transform: translateY(0) scale(0.99); }

  /* .nl-macro-btn removed with the "Quick add" button it styled -- manual
     macro entry now lives in the Log a food sheet, docked at the bottom as
     a .btn-primary (see .nl-manual-macro-dock). */

  @media (max-width: 380px) {
    .nl-scan-btn { font-size: 12.5px; padding: 12px; }
  }

  .af-modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 400;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.46s ease;
  }
  .af-modal-overlay.is-open,
  .af-modal-overlay.is-in { opacity: 1; pointer-events: auto; }
  .af-modal {
    pointer-events: auto;
    width: 100%;
    max-width: 560px;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    color: var(--text);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -14px 48px rgba(0, 0, 0, 0.42);
    transform: translateY(100%);
    transition: transform 0.48s cubic-bezier(0.32, 0.72, 0, 1);
    overflow: hidden;
  }
  .af-modal-overlay.is-open .af-modal,
  .af-modal-overlay.is-in .af-modal { transform: translateY(0); }
  .af-modal-handle {
    width: 38px; height: 5px; border-radius: 999px;
    background: var(--border); margin: 9px auto 2px; flex-shrink: 0;
    cursor: grab;
  }
  .af-modal-handle:active { cursor: grabbing; }
  .af-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 22px 10px;
    flex-shrink: 0;
  }
  .af-modal-title { font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; }
  .af-modal-body { padding: 4px 22px 22px; overflow-y: auto; flex: 1; min-height: 0; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  /* Smooths every choice -> loading -> result/error content swap inside
     the sheet (see the afBodyObserver JS below) -- a quick fade + rise
     for whatever content just landed, instead of a hard cut. */
  .af-modal-body.af-body-enter { animation: af-body-fade-in 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes af-body-fade-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .af-modal-body.af-body-enter { animation: none; }
  }

  /* Entry tiles: same gradient-badge design language as the home page's
     quick actions and the "+" sheet, so logging food reads as part of one
     system. 2-col grid; a .af-tile-wide 5th tile fills the last row. */
  .af-choice-intro { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin: 0 2px 15px; }
  .af-tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .af-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 11px;
    padding: 18px 10px;
    border: 1.5px solid var(--border);
    border-radius: 18px;
    background: var(--bg);
    color: var(--text);
    text-align: center;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: -0.01em;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.12s ease, box-shadow 0.16s ease, border-color 0.16s ease;
  }
  .af-tile:hover { border-color: transparent; box-shadow: 0 10px 24px rgba(20, 20, 20, 0.12); transform: translateY(-2px); }
  .af-tile:active { transform: scale(0.95); }
  .af-tile-wide { grid-column: 1 / -1; }
  .af-tile-icon {
    display: flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; border-radius: 15px; color: #fff; flex-shrink: 0;
  }
  .af-tile-title { line-height: 1.25; }
  .af-tile-green .af-tile-icon { background: linear-gradient(135deg, #29b87e, var(--green)); box-shadow: 0 6px 14px rgba(31, 169, 113, 0.42); }
  .af-tile-blue .af-tile-icon { background: linear-gradient(135deg, #4d7ff5, var(--blue)); box-shadow: 0 6px 14px rgba(47, 102, 232, 0.42); }
  .af-tile-purple .af-tile-icon { background: linear-gradient(135deg, #9b7bef, var(--purple)); box-shadow: 0 6px 14px rgba(124, 79, 224, 0.42); }
  .af-tile-amber .af-tile-icon { background: linear-gradient(135deg, #e8a33f, var(--amber)); box-shadow: 0 6px 14px rgba(185, 131, 42, 0.42); }
  .af-tile-red .af-tile-icon { background: linear-gradient(135deg, #e2685f, var(--red)); box-shadow: 0 6px 14px rgba(209, 69, 59, 0.42); }

  .af-emoji-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .af-emoji-btn {
    font-size: 20px;
    line-height: 1;
    padding: 9px 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    cursor: pointer;
    font-family: inherit;
  }
  .af-emoji-btn.is-active { border-color: var(--blue); background: var(--blue); }
  .af-macro-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .af-create-calories {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 4px 0 14px;
  }
  .af-create-calories-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .af-create-calories-value { font-size: 18px; font-weight: 800; color: var(--blue); }

  .af-loading { text-align: center; padding: 40px 0; color: var(--text-secondary); font-size: 13px; }
  .af-loading-spinner {
    width: 30px; height: 30px; margin: 0 auto 14px;
    border: 3px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: af-spin 0.8s linear infinite;
  }
  @keyframes af-spin { to { transform: rotate(360deg); } }

  .af-recent-section { margin-top: 24px; }
  .af-recent-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 12px;
  }
  .af-recent-head > span { font-size: 12px; font-weight: 800; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
  .af-view-log-btn {
    background: none; border: none; color: var(--blue); font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: inherit; padding: 0;
  }
  .af-view-log-btn:hover { text-decoration: underline; }
  .af-recent-list { display: flex; flex-direction: column; gap: 8px; }
  .af-recent-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg); border-radius: 14px; padding: 11px 12px;
    transition: box-shadow 0.15s ease, transform 0.1s ease;
  }
  .af-recent-row:hover { box-shadow: 0 8px 18px rgba(20, 20, 20, 0.08); transform: translateY(-1px); }
  .af-recent-icon {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 36px; height: 36px; border-radius: 11px; color: #fff;
    background: linear-gradient(135deg, #29b87e, var(--green));
    box-shadow: 0 5px 12px rgba(31, 169, 113, 0.35);
  }
  .af-recent-info { min-width: 0; flex: 1; }
  .af-recent-name { font-size: 13.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .af-recent-meta { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
  .af-recent-relog-btn {
    flex-shrink: 0; padding: 8px 14px; border-radius: 999px; border: none;
    background: var(--blue-bg); color: var(--blue); font-size: 12px; font-weight: 800;
    cursor: pointer; font-family: inherit;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .af-recent-relog-btn:hover { opacity: 0.85; }
  .af-recent-relog-btn:active { transform: scale(0.94); }
  .af-recent-empty {
    font-size: 12.5px; color: var(--text-secondary); text-align: center;
    padding: 22px 16px; background: var(--bg); border-radius: 14px; line-height: 1.5;
  }

  .af-result-photo {
    width: 100%;
    max-height: 180px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 14px;
  }

  /* Optional context field shown after a photo is picked, before it's
     sent to Gemini -- e.g. an amount or correction the photo alone can't
     convey ("chicken was ~200g", "no dressing"). */
  .af-note-field { margin-bottom: 14px; }
  .af-note-label { display: block; font-size: 12.5px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
  .af-note-input {
    width: 100%; box-sizing: border-box;
    border: 1.5px solid var(--border); border-radius: 12px;
    background: var(--bg); color: var(--text);
    padding: 11px 13px; font-size: 14px; font-family: inherit; line-height: 1.5;
    resize: vertical;
    transition: border-color 0.15s ease;
  }
  .af-note-input:focus { outline: none; border-color: var(--blue); }
  .af-note-input::placeholder { color: var(--text-secondary); }

  /* ---------- Scan result: a calm "here's your plate" reveal ----------
     The result reads top-down like a moment, not a form: hero photo with
     a soft confidence badge, the dish name as a big editable title, then
     the numbers gently cascading in one after another. */
  .af-hero { position: relative; margin-bottom: 14px; }
  .af-hero-photo {
    width: 100%;
    max-height: 200px;
    object-fit: cover;
    border-radius: 20px;
    display: block;
  }
  .af-hero-badge {
    position: absolute;
    left: 10px;
    bottom: 10px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.92);
    color: #1a7f37;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    text-transform: capitalize;
  }
  .af-hero-badge.is-unsure { color: #9a6700; }
  .af-hero-badge svg { flex-shrink: 0; }

  .af-title-wrap { position: relative; margin-bottom: 4px; }
  .af-title-input {
    width: 100%;
    box-sizing: border-box;
    background: none;
    border: none;
    border-bottom: 1.5px dashed transparent;
    color: var(--text);
    font-size: 21px;
    font-weight: 800;
    font-family: inherit;
    text-align: center;
    padding: 4px 30px;
    letter-spacing: -0.01em;
  }
  .af-title-input:hover { border-bottom-color: var(--border); }
  .af-title-input:focus { outline: none; border-bottom-color: var(--blue); }
  .af-title-pencil {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    opacity: 0.6;
    pointer-events: none;
    display: flex;
  }
  .af-note {
    font-size: 12px;
    color: var(--text-secondary);
    text-align: center;
    line-height: 1.5;
    margin: 0 6px 14px;
  }

  .af-when-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--bg);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .af-when-label { font-size: 12px; font-weight: 700; color: var(--text); flex-shrink: 0; }
  .af-when-card select {
    flex: 1;
    min-width: 0;
    max-width: 220px;
    padding: 9px 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 10px;
    font-size: 13px;
    font-family: inherit;
  }

  /* Gentle staggered reveal for the result sections. */
  .af-rise { animation: af-rise-in 0.4s ease both; animation-delay: var(--d, 0ms); }
  @keyframes af-rise-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* The quiet "it's in" moment after tapping Add to log. */
  .af-added {
    text-align: center;
    padding: 44px 16px 40px;
  }
  .af-added-circle {
    width: 74px;
    height: 74px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--green-bg);
    color: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: af-added-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .af-added-title { font-size: 17px; font-weight: 800; }
  .af-added-sub { font-size: 13px; color: var(--text-secondary); margin-top: 5px; }
  @keyframes af-added-pop {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
  }

  /* ---------- Live barcode scanner (in-app camera feed) ---------- */
  .af-scanner-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    margin-bottom: 4px;
  }
  .af-scanner-video { width: 100%; height: 100%; object-fit: cover; }
  .af-scanner-frame {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 78%; height: 34%;
    border: 2px solid var(--blue);
    border-radius: 10px;
    box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.35);
    pointer-events: none;
  }
  .af-scanner-hint {
    position: absolute;
    bottom: 14px; left: 0; right: 0;
    text-align: center;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    pointer-events: none;
  }
  /* ---------- Macro donut + micronutrients (scan results, log-food popup) ---------- */
  .mn-donut-row { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
  .mn-donut-wrap { position: relative; width: 108px; height: 108px; flex-shrink: 0; }
  .mn-donut { width: 100%; height: 100%; }
  .mn-donut-track { fill: none; stroke: var(--bg); stroke-width: 12; }
  .mn-donut-seg { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke-dasharray 0.25s ease; }
  .mn-seg-protein { stroke: var(--red); }
  .mn-seg-fat { stroke: var(--amber); }
  .mn-seg-carbs { stroke: var(--green); }
  .mn-donut-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .mn-donut-calories { font-size: 22px; font-weight: 800; color: var(--blue); line-height: 1.1; }
  .mn-donut-calories-label { font-size: 10px; color: var(--text-secondary); font-weight: 600; margin-top: 1px; }
  .mn-macro-legend { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .mn-legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .mn-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .mn-dot-protein { background: var(--red); }
  .mn-dot-fat { background: var(--amber); }
  .mn-dot-carbs { background: var(--green); }
  .mn-legend-pct { font-weight: 800; min-width: 34px; }
  .mn-legend-label { color: var(--text-secondary); flex: 1; }
  .mn-legend-grams { font-weight: 600; color: var(--text-secondary); }

  .af-field { margin-bottom: 12px; }
  .af-field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; font-weight: 600; }
  .af-field input, .af-field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
  }
  .af-actions { display: flex; gap: 10px; margin-top: 16px; }

  /* "Create food" screen: nav row (back + title), a collapsed icon
     picker, Optional/Required field tags, and a barcode row with its
     own clear control -- in place of the old flat field list. */
  .af-create-nav { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; }
  .af-create-back-btn { background: none; border: none; padding: 2px 4px 2px 0; font-size: 22px; line-height: 1; color: var(--text); cursor: pointer; }
  .af-create-nav-title { font-size: 15px; font-weight: 800; color: var(--text); letter-spacing: -0.005em; }

  .af-icon-row {
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--border); border-radius: 14px;
    padding: 11px 12px; margin-bottom: 16px;
  }
  .af-icon-emoji { width: 38px; height: 38px; border-radius: 10px; background: var(--blue-bg); display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }
  .af-icon-info { flex: 1; min-width: 0; }
  .af-icon-title { font-size: 13.5px; font-weight: 700; color: var(--text); }
  .af-icon-sub { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
  .af-icon-edit-btn {
    flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 7px 13px; cursor: pointer;
  }

  .af-field-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .af-field-head label { font-size: 12px; font-weight: 700; color: var(--text); }
  .af-tag { font-size: 11px; font-weight: 600; color: var(--text-secondary); }

  .af-barcode-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .af-barcode-row input { flex: 1; margin: 0; }
  .af-barcode-del-btn {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--bg);
    border: 1px solid var(--border); color: var(--text-secondary); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .af-section-title { font-size: 14.5px; font-weight: 800; color: var(--text); margin: 4px 0 12px; letter-spacing: -0.005em; }
  .af-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
  .af-serving-weight-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .af-serving-weight-label { font-size: 14px; font-weight: 700; color: var(--text); }

  .af-add-serving-btn { width: 100%; margin-bottom: 12px; }
  .af-serving-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .af-serving-row-label { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .af-serving-row-grams { color: var(--text-secondary); flex-shrink: 0; }
  .af-serving-remove-btn {
    border: none;
    background: none;
    color: var(--text-secondary);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .af-serving-remove-btn:hover { color: var(--red); }
  .af-serving-select-row { margin-bottom: 12px; }

  /* ---------- Amount editor (single-ingredient scans: barcode / one-food photo) ---------- */
  .af-amount-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .af-amount-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .af-amount-title { font-size: 12px; font-weight: 700; color: var(--text); }
  .af-amount-serving-hint { font-size: 11px; color: var(--text-secondary); }
  .af-amount-input-row { display: flex; align-items: center; gap: 10px; }
  #af-amount-value {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 10px;
    font-size: 20px;
    font-weight: 700;
    font-family: inherit;
    transition: border-color 0.15s ease;
  }
  #af-amount-value:focus { outline: none; border-color: var(--blue); }
  .af-unit-seg {
    display: flex;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    flex-shrink: 0;
  }
  .af-unit-seg button {
    padding: 8px 12px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: none;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    white-space: nowrap;
  }
  .af-unit-seg button.is-active { background: var(--blue); color: #fff; }

  .af-error { color: var(--red); font-size: 13px; text-align: center; padding: 20px 0; }

  /* ---------- Log-amount sheet (lq-modal) -- modern, simple content ----------
     The food name is the sheet's title (in .log-sheet-head); below it the
     macro donut, a clean amount card, and one full-width "Add to log"
     button. The X / backdrop / swipe-down handle dismissal, so there's no
     separate Cancel button cluttering it. */
  .lq-title {
    flex: 1; min-width: 0;
    font-size: 18px; font-weight: 800; letter-spacing: -0.01em;
    color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lq-amount {
    background: var(--bg);
    border-radius: 16px;
    padding: 14px 16px;
    margin-top: 16px;
  }
  .lq-amount-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    margin-bottom: 10px;
  }
  .lq-amount-label { font-size: 13px; font-weight: 800; color: var(--text); }
  .lq-amount-hint { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
  .lq-amount-row { display: flex; align-items: center; gap: 10px; }
  .lq-amount-input {
    flex: 1; min-width: 0;
    padding: 12px 15px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 13px;
    font-size: 20px; font-weight: 800; font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .lq-amount-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-bg); }
  .lq-unit-seg {
    display: flex; flex-shrink: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
  }
  .lq-unit-seg button {
    padding: 8px 13px; border: none; border-radius: 999px;
    background: none; color: var(--text-secondary);
    font-size: 12px; font-weight: 700; font-family: inherit;
    cursor: pointer; white-space: nowrap;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .lq-unit-seg button.is-active { background: var(--blue); color: #fff; }
  .lq-add-btn {
    width: 100%;
    margin-top: 16px;
    padding: 15px;
    border: none; border-radius: 16px;
    background: linear-gradient(135deg, #4d7ff5, var(--blue));
    color: #fff;
    font-size: 16px; font-weight: 800; font-family: inherit; letter-spacing: -0.01em;
    cursor: pointer;
    box-shadow: 0 10px 24px -8px var(--blue);
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .lq-add-btn:hover { opacity: 0.94; }
  .lq-add-btn:active { transform: scale(0.98); }

  .nl-save-error-toast {
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    background: var(--red);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 12px 18px;
    border-radius: 999px;
    box-shadow: var(--shadow);
    z-index: 400;
    max-width: 90vw;
    text-align: center;
    animation: nl-fade-in 0.15s ease;
  }
  .af-ingredient-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .af-ingredient-row {
    background: var(--bg);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px;
  }
  .af-ingredient-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .af-ingredient-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .af-ingredient-amount { color: var(--text-secondary); font-weight: 600; flex-shrink: 0; }
  .af-ingredient-macros { color: var(--text-secondary); font-size: 11px; margin-top: 3px; }
  .af-secondary-btn {
    padding: 9px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: none;
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .af-secondary-btn:hover { border-color: var(--text-secondary); }

  /* ---------- Add-food modal ---------- */

  .nl-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 8vh 16px 16px;
    padding: 8dvh 16px 16px;
    z-index: 300; /* beat .mobile-tabbar's z-index: 100, see .af-modal-overlay comment */
    animation: nl-fade-in 0.15s ease;
  }
  .nl-modal {
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 480px;
    max-height: 78vh;
    max-height: 78dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: nl-pop-in 0.18s ease;
  }
  .nl-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 12px;
  }
  .nl-modal-title { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; color: var(--text); }
  .nl-modal-close {
    background: var(--bg);
    border: none;
    color: var(--text-secondary);
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    border-radius: 50%;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .nl-modal-close:hover { color: var(--text); background: var(--sidebar-active); }

  /* Bigger, calmer search field -- it's the primary thing you do in this
     modal, so it reads as the anchor with a blue focus ring rather than a
     thin grey pill. */
  .nl-modal-search-wrap {
    display: flex; align-items: center; gap: 11px;
    margin: 0 20px 16px;
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 13px 16px; color: var(--text-secondary);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .nl-modal-search-wrap:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-bg); color: var(--blue); }
  .nl-modal-search-wrap svg { flex-shrink: 0; }
  .nl-modal-search-wrap input {
    flex: 1; min-width: 0; background: none; border: none; color: var(--text);
    font-size: 15px; font-weight: 500; font-family: inherit; outline: none;
  }
  .nl-modal-search-wrap input::placeholder { color: var(--text-secondary); font-weight: 400; }
  .nl-modal-results {
    overflow-y: auto;
    padding: 0 12px 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .nl-search-empty { padding: 26px 14px; font-size: 13px; color: var(--text-secondary); text-align: center; }

  /* iOS-style segmented control (All / Favorites / Recent) replacing the
     old stacked "FAVORITES" / "RECENT" section headers -- one filtered
     list instead of three concatenated ones. Track + sliding light capsule
     for the selected segment, matching UISegmentedControl rather than a
     Material solid-fill tab bar. */
  .nl-scope-seg {
    display: flex; gap: 2px;
    background: var(--sidebar-active);
    border-radius: 9px;
    padding: 2px;
    margin: 2px 8px 12px;
  }
  .nl-scope-seg button {
    flex: 1;
    padding: 6px 4px;
    border: none;
    border-radius: 7px;
    background: none;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .nl-scope-seg button.is-active {
    background: var(--card-bg);
    color: var(--text);
    font-weight: 700;
    box-shadow: var(--shadow);
  }

  /* iOS grouped/inset list: one rounded card per list, hairline dividers
     between rows, no per-row floating radius -- replaces the earlier
     flat rows-with-gaps treatment. */
  .nl-food-list {
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .nl-food-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 8px 10px;
    border: none;
    border-bottom: 1px solid var(--border);
    background: none;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: var(--text);
    transition: background-color 0.13s ease;
  }
  .nl-food-row:last-child { border-bottom: none; }
  .nl-food-row:hover { background: var(--bg); }
  .nl-food-row:active { background: var(--sidebar-active); }
  .nl-food-row-icon {
    flex-shrink: 0;
    width: 40px; height: 40px;
    border-radius: 11px;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; line-height: 1;
    overflow: hidden;
  }
  .nl-food-row:hover .nl-food-row-icon { background: var(--sidebar-active); }
  .nl-food-photo-row { width: 100%; height: 100%; border-radius: 11px; }
  .nl-food-row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .nl-food-row-name {
    font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nl-food-row-macros {
    display: flex; align-items: baseline;
    font-size: 11.5px; color: var(--text-secondary); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nl-frm-cal { font-weight: 700; color: var(--text); }
  .nl-frm-cal::after { content: "·"; margin: 0 6px; color: var(--text-secondary); font-weight: 700; }
  /* Demoted from a bordered 44px circle button to a small plain icon --
     the row itself is the tappable thing (data-food on the whole button);
     the heart is a secondary toggle, not a competing control. Kept at
     32px (not the full 44px minimum) since it sits directly beside the
     row's own much larger tap target, same trade-off real iOS list
     accessories make (e.g. Reminders' flag icon). */
  .nl-food-row-fav {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: none;
    border: none;
    color: var(--text-secondary);
    opacity: 0.7;
    cursor: pointer;
    transition: color 0.15s ease, background-color 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
  }
  .nl-food-row-fav:hover { background: var(--sidebar-active); opacity: 1; }
  .nl-food-row-fav:active { transform: scale(0.85); }
  .nl-food-row-fav.is-fav { color: var(--red); opacity: 1; }

  /* Sticky footer inside the sheet's scrolling body. Keeps "Quick add"
     one tap away no matter how many results are showing -- it's the only
     route to manual macro entry now, so burying it under a long list would
     be strictly worse than the standalone button it replaced. Negative
     margins cancel .log-sheet-body's 16px side padding so the background
     spans the full sheet width; the matching positive padding keeps the
     button itself aligned with the rows above it. */
  .nl-manual-macro-dock {
    position: sticky;
    bottom: 0;
    z-index: 2;
    margin: 14px -16px 0;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--card-bg);
    border-top: 1px solid var(--border);
  }
  /* .btn-primary carries margin-top:22px for its usual standalone-CTA
     context (index.html). Inside the dock that spacing is already owned by
     the dock's own padding, so drop it rather than letting the two stack. */
  .nl-manual-macro-dock .btn-primary { margin-top: 0; }

  /* ---------- Timeline ---------- */

  /* Primary "Log a food" button + entry list, mirroring the workout log's
     .wl-log-btn / .wl-day-list / .wl-empty so both pages read the same. */
  .nl-day-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .nl-day-title { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
  .nl-day-sub { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }

  .nl-log-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 15px;
    border: none;
    border-radius: 16px;
    background: var(--blue);
    color: #fff;
    font-size: 14.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  .nl-log-btn:active { transform: scale(0.98); }
  .nl-log-btn svg { flex-shrink: 0; }

  .nl-timeline { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }

  .nl-empty { text-align: center; padding: 34px 16px 26px; }
  .nl-empty-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: var(--blue-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .nl-empty-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .nl-empty-sub { font-size: 13px; color: var(--text-secondary); margin-top: 5px; line-height: 1.5; }

  /* A rounded card per entry, gap-separated in .nl-timeline -- matches the
     workout log's .wl-entry-card list instead of the old flattened,
     divider-separated rows. */
  .nl-entry-card {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg);
    border-radius: 18px;
    padding: 13px 14px;
    cursor: pointer;
    animation: nl-pop-in 0.18s ease;
  }
  .nl-entry-card:active { transform: scale(0.985); }

  /* ---------- Swipe-to-delete on a logged food ---------- */
  /* The card lives in .nl-swipe-content, which slides left to uncover the
     red .nl-swipe-delete panel pinned behind it on the right. Mirrors the
     workout log's swipe-to-delete (see workouts.html's wireSwipeToDelete). */
  .nl-swipe {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    transform: translateZ(0);
    isolation: isolate;
  }
  .nl-swipe-delete {
    position: absolute;
    top: -2px; right: -2px; bottom: -2px;
    width: 98px;
    border: none;
    border-radius: 18px 0 0 18px;
    background: var(--red);
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: 12px; font-weight: 700; font-family: inherit;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .nl-swipe.is-dragging .nl-swipe-delete,
  .nl-swipe.is-open .nl-swipe-delete { opacity: 1; }
  .nl-swipe-delete svg { flex-shrink: 0; }
  .nl-swipe-delete:active { filter: brightness(0.9); }
  .nl-swipe-content {
    position: relative;
    z-index: 1;
    transform: translateX(0);
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
    touch-action: pan-y;
  }
  .nl-swipe.is-dragging .nl-swipe-content,
  .nl-swipe.is-dragging .nl-swipe-delete { transition: none; }

  /* ---------- Confirm-before-delete dialog ---------- */
  .nl-confirm-overlay {
    position: fixed;
    inset: 0;
    z-index: 400;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background: rgba(15, 15, 20, 0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
  }
  .nl-confirm-overlay.is-open { opacity: 1; pointer-events: auto; }
  .nl-confirm {
    width: 100%; max-width: 340px;
    background: var(--card-bg);
    border-radius: 22px;
    padding: 24px 22px 18px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    transform: scale(0.94);
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .nl-confirm-overlay.is-open .nl-confirm { transform: scale(1); }
  .nl-confirm-icon {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--red-bg); color: var(--red);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
  }
  .nl-confirm-title { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; color: var(--text); }
  .nl-confirm-sub { font-size: 14px; color: var(--text-secondary); margin-top: 5px; }
  .nl-confirm-actions { display: flex; gap: 10px; margin-top: 20px; }
  .nl-confirm-cancel, .nl-confirm-delete {
    flex: 1; padding: 13px; border-radius: 14px;
    font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
    transition: transform 0.1s ease, filter 0.12s ease;
  }
  .nl-confirm-cancel { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .nl-confirm-cancel:active { transform: scale(0.97); }
  .nl-confirm-delete { background: var(--red); color: #fff; border: none; }
  .nl-confirm-delete:active { transform: scale(0.97); filter: brightness(0.9); }

  @media (prefers-reduced-motion: reduce) {
    .nl-swipe-content { transition: none; }
    .nl-confirm { transition: none; }
  }
  .nl-entry-icon {
    width: 44px; height: 44px; border-radius: 14px; background: var(--card-bg);
    display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; overflow: hidden;
  }
  .nl-entry-info { flex: 1; min-width: 0; }
  .nl-entry-name {
    font-size: 16px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nl-entry-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .nl-entry-toggle {
    background: none; border: none; color: var(--text-secondary);
    width: 44px; height: 44px;
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease;
  }
  .nl-entry-toggle:hover { color: var(--text); }
  .nl-entry-toggle.is-expanded { transform: rotate(180deg); }

  .nl-entry-fav-btn {
    background: none; border: none; color: var(--text-secondary);
    width: 44px; height: 44px;
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    transition: color 0.15s ease, transform 0.1s ease;
  }
  .nl-entry-fav-btn:hover { color: var(--red); }
  .nl-entry-fav-btn:active { transform: scale(0.85); }
  .nl-entry-fav-btn.is-fav { color: var(--red); }

  .nl-entry-detail {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; margin: -4px 0 10px; animation: nl-slide-down 0.18s ease;
  }
  /* Amount control: label (+ hint) on the left, the number field on the
     right, in one clean bordered card. */
  .nl-amount-card {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 14px;
  }
  .nl-amount-meta { min-width: 0; }
  .nl-amount-title { display: block; font-size: 13.5px; font-weight: 700; color: var(--text); }
  .nl-amount-hint { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
  .nl-amount-field {
    display: flex; align-items: center; gap: 4px; flex-shrink: 0;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 3px 8px 3px 4px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .nl-amount-field:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-bg); }
  .nl-amount-field input {
    width: 60px; padding: 7px 6px; border: none; background: none;
    color: var(--text); border-radius: 8px; font-size: 16px; font-weight: 700;
    font-family: inherit; text-align: center; outline: none;
  }
  /* Hide the native number spinners for a cleaner field. */
  .nl-amount-field input::-webkit-outer-spin-button,
  .nl-amount-field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .nl-amount-field input[type=number] { -moz-appearance: textfield; }
  .nl-unit-select {
    padding: 8px 8px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); border-radius: 10px; font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .nl-amount-field .nl-unit-select { border: none; background: none; padding: 6px 2px; font-weight: 600; }
  .nl-amount-unit-label { font-size: 13px; color: var(--text-secondary); font-weight: 700; padding-right: 4px; }
  .nl-add-ingredient-btn {
    display: inline-block;
    margin: 6px 0 10px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px dashed var(--border);
    background: none;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .nl-add-ingredient-btn:hover { color: var(--text); border-color: var(--text-secondary); }
  .nl-add-ingredient-standalone { margin-top: -4px; }

  /* ---------- Entry hero: animated macro ring ---------- */
  .nl-hero {
    display: flex; align-items: center; gap: 20px;
    padding: 6px 4px 18px;
  }
  .nl-hero-ring { position: relative; width: 108px; height: 108px; flex-shrink: 0; }
  .nl-hero-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  /* The transition is what makes editing amounts feel alive: the arcs
     glide to their new share instead of snapping (patchEntryHero mutates
     these styles in place, never re-creates the elements). */
  .nl-hero-seg { transition: stroke-dasharray 0.45s ease, stroke-dashoffset 0.45s ease; }
  .nl-hero-ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .nl-hero-kcal { font-size: 25px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .nl-hero-kcal-label {
    font-size: 10px; font-weight: 700; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px;
  }
