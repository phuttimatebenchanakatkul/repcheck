{% extends "base.html" %}

{% block title %}RepCheck - Home{% endblock %}
{% block heading %}Welcome back{% endblock %}

{% block content %}
<!-- Reused for the "Calories & macros" week chart below — same
     .pc-week-* component as the Personalized Coaching card on the
     nutrition page; only those classes are used here, not coaching.js. -->
<link rel="stylesheet" href="{{ asset_url('coaching.css') }}">

{% if current_user %}
<!--
  Hero: leads with today's date, the streak flame (the single most
  motivating daily-return stat, promoted here from a buried mid-grid
  tile), a plain-language headline for today ("Push Day" / "Rest day" /
  "Let's get moving"), the week's activity dots, and ONE clear call to
  action. Same var(--card-bg)/var(--text) theme-following surface as
  every other card on the page (used to be a fixed dark gradient
  regardless of light/dark mode).
-->
<div class="hm-hero">
  <div class="hm-hero-top">
    <div class="hm-hero-date" id="hm-hero-date"></div>
    <a class="hm-streak-chip" id="hm-streak-chip" href="{{ url_for('streaks') }}">
      <span class="hm-streak-flame">🔥</span><span id="hm-streak-count"></span>
    </a>
  </div>
  <div class="hm-hero-title" id="hm-hero-title"></div>
  <div class="hm-hero-sub" id="hm-hero-sub"></div>
  <div class="hm-hero-week" id="hm-hero-week"></div>
  <a class="hm-hero-cta" id="hm-hero-cta" href="{{ url_for('workouts') }}"></a>
</div>

<!-- Weekly check-in: shown ONLY when it's actually ready. The old
     always-visible "Come back in N days" disabled button was pure noise
     on a page that's meant to stay simple. -->
<div id="hm-checkin-banner"></div>

{% endif %}

<div class="hm-section-title" data-i18n="home.today">Today</div>

<!-- Calories & macros summary: bar-chart-style card (blue=calories,
     red=protein, amber=fat, green=carbs), same color coding as the
     interactive week chart's own dots/bars (coaching.css's
     .pc-week-bar-*), just collapsed to today's totals instead of a
     7-day grid. "Full stats" pill links to its own dedicated weekly page
     (templates/full_stats.html) instead of the rest of the card, which
     still goes to Nutrition -- stops propagation the same way the day
     columns/toggle further down do, since it sits inside that link. -->
<a class="hm-macro-card" href="{{ url_for('nutrition') }}">
  <div class="hm-macro-card-head">
    <span class="hm-macro-card-title" data-i18n="home.macros.title">Calories &amp; macros</span>
    <span class="hm-macro-card-pill" id="hm-macro-full-stats">
      <span data-i18n="home.macros.fullStats">Full stats</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </span>
  </div>
  <div class="hm-macro-card-sub" id="hm-macro-sub" data-i18n="home.macros.remainingToday">Remaining today</div>
  <div id="hm-macro-big"></div>
  <div id="hm-macro-bars"></div>
</a>

<style>
  /* ---------- Hero ---------- */
  .hm-hero {
    background: var(--card-bg);
    color: var(--text);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 22px;
    margin-bottom: 18px;
  }
  .hm-hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hm-hero-date { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-secondary); }
  /* Neutral pill by default, same treatment as .hm-macro-card-pill below --
     only turns amber once there's an actual streak to celebrate. */
  .hm-streak-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--bg); color: var(--text-secondary);
    border-radius: 999px; padding: 6px 13px; min-height: 44px; box-sizing: border-box;
    font-size: 13px; font-weight: 800; text-decoration: none;
    transition: transform 0.1s ease;
  }
  .hm-streak-chip:active { transform: scale(0.94); }
  .hm-streak-chip.is-active {
    background: linear-gradient(135deg, #f5a94e, #e8832f); color: #fff;
    box-shadow: 0 6px 14px rgba(232, 131, 47, 0.4);
  }
  .hm-hero-title { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-top: 14px; line-height: 1.15; }
  .hm-hero-sub { font-size: 13.5px; color: var(--text-secondary); margin-top: 5px; }
  .hm-hero-week { display: flex; justify-content: space-between; gap: 6px; margin-top: 18px; }
  .hm-hero-day { display: flex; flex-direction: column; align-items: center; gap: 7px; flex: 1; }
  .hm-hero-day-letter { font-size: 10px; font-weight: 700; color: var(--text-secondary); }
  .hm-hero-day-num {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--border); color: var(--text-secondary);
    font-size: 13px; font-weight: 700;
  }
  .hm-hero-day.has-activity .hm-hero-day-num { background: linear-gradient(135deg, #29b87e, #1fa971); color: #fff; box-shadow: 0 4px 10px rgba(31, 169, 113, 0.4); }
  /* A ring instead of an inverted fill -- same "today" treatment
     logging_history.html's .lh-circle.is-today already uses, so it reads
     correctly regardless of what's underneath it. */
  .hm-hero-day.is-today .hm-hero-day-num { box-shadow: 0 0 0 2px var(--blue); }
  .hm-hero-cta {
    display: block; text-align: center; margin-top: 18px;
    background: linear-gradient(135deg, #4d7ff5, var(--blue)); color: #fff;
    border-radius: 999px; padding: 13px;
    font-size: 14px; font-weight: 800; text-decoration: none;
    box-shadow: 0 8px 20px rgba(47, 102, 232, 0.35);
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .hm-hero-cta:hover { opacity: 0.92; }
  .hm-hero-cta:active { transform: scale(0.98); }

  /* ---------- Weekly check-in banner (only rendered when ready) ---------- */
  .hm-checkin-banner {
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, #e8a33f, var(--amber)); color: #fff;
    border-radius: 16px; padding: 14px 18px; margin-bottom: 18px;
    font-size: 13.5px; font-weight: 700; text-decoration: none;
    box-shadow: 0 8px 18px rgba(185, 131, 42, 0.3);
    transition: transform 0.12s ease;
  }
  .hm-checkin-banner:active { transform: scale(0.98); }
  .hm-checkin-banner svg { flex-shrink: 0; }
  .hm-checkin-banner-arrow { margin-left: auto; display: flex; }

  /* ---------- Section titles ---------- */
  .hm-section-title { font-size: 15px; font-weight: 800; letter-spacing: -0.015em; margin: 0 4px 10px; }

  /* ---------- Calories & macros summary card: header + big number +
     4 color-coded bars (blue=calories, red=protein, amber=fat,
     green=carbs), styled after a "Heart Rate" bar-chart mockup the user
     supplied. Bar fill colors reuse coaching.css's .pc-week-bar-* classes
     so this card and the full week chart on Nutrition always agree. ---------- */
  .hm-macro-card {
    display: block;
    background: var(--card-bg); color: inherit; text-decoration: none;
    border-radius: 20px; box-shadow: var(--shadow);
    padding: 18px; margin-bottom: 14px;
    transition: transform 0.13s ease, box-shadow 0.15s ease;
  }
  .hm-macro-card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(20, 20, 20, 0.1); }
  .hm-macro-card:active { transform: scale(0.99); }
  .hm-macro-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hm-macro-card-title { font-size: 15px; font-weight: 800; letter-spacing: -0.015em; }
  .hm-macro-card-pill {
    display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
    background: var(--bg); color: var(--text-secondary);
    border-radius: 999px; padding: 6px 11px;
    font-size: 11.5px; font-weight: 800;
  }
  .hm-macro-card-sub { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-top: 14px; }
  .hm-macro-big-value { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; margin-top: 4px; }
  .hm-macro-big-value .hm-macro-big-unit { font-size: 14px; font-weight: 700; color: var(--text-secondary); margin-left: 4px; letter-spacing: 0; }
  .hm-macro-big-caption { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }

  /* Bar chart: one row per metric, each row a rectangular track with a
     single solid rectangle fill sitting inside it (sharp/minimally
     rounded corners, not a rounded pill) -- matches the reference
     mockup's per-row/axis-underneath layout. */
  .hm-macro-bar-rows { display: flex; flex-direction: column; gap: 11px; margin-top: 18px; }
  .hm-macro-bar-row { display: flex; align-items: center; gap: 10px; }
  .hm-macro-bar-label { width: 52px; flex-shrink: 0; font-size: 11.5px; font-weight: 700; color: var(--text-secondary); }
  .hm-macro-bar-track { flex: 1; height: 18px; border-radius: 4px; background: var(--bg); overflow: hidden; }
  /* Single value per row, driven by the Consumed/Remaining toggle above. */
  .hm-macro-bar-value { width: 66px; flex-shrink: 0; text-align: right; line-height: 1.25; font-size: 12px; font-weight: 800; color: var(--text); }
  .hm-macro-bar-fill { display: block; height: 100%; transition: width 0.4s ease; }

  .hm-macro-axis { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .hm-macro-axis-spacer { width: 52px; flex-shrink: 0; }
  .hm-macro-axis-value-spacer { width: 66px; flex-shrink: 0; }
  .hm-macro-axis-ticks {
    flex: 1; display: flex; justify-content: space-between;
    font-size: 10px; font-weight: 600; color: var(--text-secondary);
    border-top: 1px solid var(--border); padding-top: 6px;
  }

  /* .pc-week-toggle/.pc-week-toggle-btn come from coaching.css (same
     Consumed/Remaining switch component as the full week chart) --
     just needs spacing above it here, since that component only
     defines margin-bottom for when it sits above other content. */
  .hm-macro-toggle { margin-top: 14px; margin-bottom: 0; }

  @media (max-width: 720px) {
    .hm-hero { padding: 18px; }
    .hm-hero-title { font-size: 23px; }
    .hm-hero-day-num { width: 30px; height: 30px; font-size: 12px; }
  }
</style>

<script>
  (function () {
    const t = RepCheckI18n.t;

    function toIsoDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }
    function loadJson(key, fallback) {
      try {
        const parsed = JSON.parse(localStorage.getItem(key));
        return parsed === null || parsed === undefined ? fallback : parsed;
      } catch (err) { return fallback; }
    }

    const workoutLog = loadJson("repcheck_workout_log_v2", {});
    const nutritionLog = loadJson("repcheck_nutrition_log_v1", {});
    // No "calories" field on purpose -- it's never stored directly (see
    // nutrition.html/coaching.js), always derived from protein/fat/carbs
    // below so it can't drift out of sync with the macro targets.
    const nutritionGoals = { protein: 150, fat: 65, carbs: 200, ...loadJson("repcheck_nutrition_goals_v1", {}) };

    function hasActivityOn(iso) {
      const w = workoutLog[iso];
      const n = nutritionLog[iso];
      return (Array.isArray(w) && w.length > 0) || (Array.isArray(n) && n.length > 0);
    }

    function computeStreak() {
      const today = new Date();
      let cursor = new Date(today);
      // If today has nothing logged yet, check from yesterday instead so
      // an ongoing streak isn't zeroed out before the day is even over.
      if (!hasActivityOn(toIsoDate(cursor))) {
        cursor.setDate(cursor.getDate() - 1);
      }
      let streak = 0;
      while (hasActivityOn(toIsoDate(cursor))) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      }
      return streak;
    }

    // ---------- Today's planned split (mirrors workouts.html's own logic) ----------
    const WEEKDAY_KEYS = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
    function loadSplitPlan() {
      return loadJson("repcheck_split_plan_v1", null);
    }
    function getTodaysSplitInfo() {
      const plan = loadSplitPlan();
      if (!plan || !plan.schedule || !plan.days) return null;
      const weekdayKey = WEEKDAY_KEYS[new Date().getDay()];
      const label = plan.schedule[weekdayKey];
      if (!label || label === "Rest") return null;
      const day = plan.days.find((d) => d.label === label);
      if (!day) return null;
      return { label, exercises: day.exercises };
    }

    // sumMacrosForDay() lives in static/nutrition_macros.js -- shared with
    // full_stats.html so the two can't silently drift from each other (or
    // from templates/nutrition.html's own rounding) the way they did before.
    const sumMacrosForDay = RepCheckNutritionMacros.sumMacrosForDay;

    // ---------- Calories & macros summary card ----------
    // Today's totals as 4 color-coded bars, each filled relative to its
    // OWN goal (calories vs. gram targets are different units/magnitudes,
    // so there's no shared numeric axis to plot them against). Colors
    // reuse coaching.css's .pc-week-bar-* classes (blue/red/amber/green)
    // so this always agrees with the full week chart on Nutrition. Each
    // bar is a rectangular track with a single solid rectangle fill
    // inside it (sharp/minimally-rounded corners, not a rounded pill).
    // A Consumed/Remaining toggle (same .pc-week-toggle-btn component
    // and behavior as the old week chart) swaps which value the fill
    // rectangle represents. Defaults to remaining -- "how much do I have
    // left" is the more useful number at a glance on the homepage; the
    // toggle still switches to consumed for anyone who wants that instead.
    let macroCardMode = "remaining";

    function macroCardFillPct(consumedPct) {
      return macroCardMode === "consumed" ? consumedPct : Math.max(0, 100 - consumedPct);
    }

    // One number per row, driven entirely by the toggle -- consumed mode
    // shows the raw amount, remaining mode shows what's left, and nothing
    // else. (Previously both were always shown together, so tapping
    // Remaining visibly changed nothing; then a secondary caption was
    // added but that still showed the consumed amount underneath even in
    // remaining mode, which is exactly what was asked to go away.)
    function macroCardValueText(r, isConsumedMode) {
      const unitSuffix = r.unit === "g" ? "g" : "";
      if (isConsumedMode) return `${r.value}${unitSuffix}`;
      return t("home.macros.left", { n: `${Math.max(0, Math.round(r.goal - r.value))}${unitSuffix}` });
    }

    // The headline number follows the same toggle -- consumed mode shows
    // today's intake so far (as before); remaining mode shows what's
    // left of the goal, same "kcal left" convention as the Food Today
    // tile, instead of always showing intake regardless of mode.
    function macroCardBigHtml(eatenKcal, goalKcal, isConsumedMode) {
      const value = isConsumedMode ? eatenKcal : Math.max(0, goalKcal - eatenKcal);
      const unitLabel = isConsumedMode ? "kcal" : t("home.food.kcalLeft");
      return `
        <div class="hm-macro-big-value">${value.toLocaleString(RepCheckI18n.locale())}<span class="hm-macro-big-unit">${unitLabel}</span></div>
        <div class="hm-macro-big-caption">${t("home.food.ofGoal", { n: goalKcal.toLocaleString(RepCheckI18n.locale()) })}</div>
      `;
    }

    function macroCardRows() {
      const eaten = sumMacrosForDay(nutritionLog[toIsoDate(new Date())]);
      // Eaten calories come from each entry's own baseCalories (same as
      // nutrition.html's entryTotals/scaledMacros), not derived from the
      // macro grams -- a food's listed calories don't always equal exactly
      // 4P+9F+4C (fiber, alcohol, rounding), so deriving it here silently
      // disagreed with the Nutrition page's total for the same day.
      const eatenKcal = Math.round(eaten.calories);
      const goalKcal = Math.round(nutritionGoals.protein * 4 + nutritionGoals.fat * 9 + nutritionGoals.carbs * 4);
      return {
        eatenKcal,
        goalKcal,
        rows: [
          { key: "calories", label: t("common.calories"), value: eatenKcal, goal: goalKcal, unit: "kcal", cls: "pc-week-bar-calories" },
          { key: "protein", label: t("common.protein"), value: Math.round(eaten.protein), goal: Math.round(nutritionGoals.protein), unit: "g", cls: "pc-week-bar-protein" },
          { key: "fat", label: t("common.fat"), value: Math.round(eaten.fat), goal: Math.round(nutritionGoals.fat), unit: "g", cls: "pc-week-bar-fat" },
          { key: "carbs", label: t("common.carbs"), value: Math.round(eaten.carbs), goal: Math.round(nutritionGoals.carbs), unit: "g", cls: "pc-week-bar-carbs" },
        ],
      };
    }

    function renderMacroCard() {
      const bigMount = document.getElementById("hm-macro-big");
      const barsMount = document.getElementById("hm-macro-bars");
      if (!bigMount || !barsMount) return;

      const { eatenKcal, goalKcal, rows } = macroCardRows();
      const isConsumedMode = macroCardMode === "consumed";

      const subEl = document.getElementById("hm-macro-sub");
      if (subEl) {
        // Also update data-i18n, not just textContent -- i18n.js's
        // DOMContentLoaded pass (and the language-switch handler) blindly
        // re-applies whatever key is in this attribute, which was still the
        // template's static "todaysIntake" the very first time this ran.
        // That race was invisible while "consumed" was the default (the
        // stomped-back text happened to match), but flipping the default
        // to "remaining" exposed it: this line would run, set the correct
        // "Remaining today" text, and i18n.js would silently revert it a
        // moment later on DOMContentLoaded.
        const subKey = isConsumedMode ? "home.macros.todaysIntake" : "home.macros.remainingToday";
        subEl.textContent = t(subKey);
        subEl.setAttribute("data-i18n", subKey);
      }

      bigMount.innerHTML = macroCardBigHtml(eatenKcal, goalKcal, isConsumedMode);

      const barRowsHtml = rows.map((r) => {
        const consumedPct = r.goal > 0 ? Math.max(0, Math.min(100, (r.value / r.goal) * 100)) : (r.value > 0 ? 100 : 0);
        const fillPct = macroCardFillPct(consumedPct);
        return `
          <div class="hm-macro-bar-row">
            <span class="hm-macro-bar-label">${r.label}</span>
            <span class="hm-macro-bar-track">
              <span class="hm-macro-bar-fill ${r.cls}" data-metric="${r.key}" style="width:${fillPct}%;"></span>
            </span>
            <span class="hm-macro-bar-value" data-metric-value="${r.key}">${macroCardValueText(r, isConsumedMode)}</span>
          </div>
        `;
      }).join("");

      barsMount.innerHTML = `
        <div class="hm-macro-bar-rows">${barRowsHtml}</div>
        <div class="hm-macro-axis">
          <span class="hm-macro-axis-spacer"></span>
          <span class="hm-macro-axis-ticks"><span>0%</span><span>50%</span><span>100%</span></span>
          <span class="hm-macro-axis-value-spacer"></span>
        </div>
        <div class="pc-week-toggle hm-macro-toggle">
          <button type="button" class="pc-week-toggle-btn ${isConsumedMode ? "is-active" : ""}" data-macro-mode="consumed">${t("coaching.week.consumed")}</button>
          <button type="button" class="pc-week-toggle-btn ${!isConsumedMode ? "is-active" : ""}" data-macro-mode="remaining">${t("coaching.week.remaining")}</button>
        </div>
      `;
    }

    // Updates the existing fill widths in place instead of calling
    // renderMacroCard() again -- same reasoning as updateWeekChart()
    // above: a freshly-created fill already at its target width has
    // nothing to transition *from*, so mutating the still-mounted
    // elements is what lets the width transition actually animate.
    function updateMacroCard() {
      const barsMount = document.getElementById("hm-macro-bars");
      const bigMount = document.getElementById("hm-macro-big");
      if (!barsMount || !barsMount.querySelector(".hm-macro-bar-rows")) {
        renderMacroCard();
        return;
      }
      const { eatenKcal, goalKcal, rows } = macroCardRows();
      const isConsumedMode = macroCardMode === "consumed";
      const subEl = document.getElementById("hm-macro-sub");
      if (subEl) {
        const subKey = isConsumedMode ? "home.macros.todaysIntake" : "home.macros.remainingToday";
        subEl.textContent = t(subKey);
        subEl.setAttribute("data-i18n", subKey); // keep in sync -- see renderMacroCard()
      }
      if (bigMount) bigMount.innerHTML = macroCardBigHtml(eatenKcal, goalKcal, isConsumedMode);
      rows.forEach((r) => {
        const consumedPct = r.goal > 0 ? Math.max(0, Math.min(100, (r.value / r.goal) * 100)) : (r.value > 0 ? 100 : 0);
        const fillEl = barsMount.querySelector(`.hm-macro-bar-fill[data-metric="${r.key}"]`);
        if (fillEl) fillEl.style.width = `${macroCardFillPct(consumedPct)}%`;
        const valueEl = barsMount.querySelector(`[data-metric-value="${r.key}"]`);
        if (valueEl) valueEl.textContent = macroCardValueText(r, isConsumedMode);
      });
      barsMount.querySelectorAll(".pc-week-toggle-btn").forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.macroMode === macroCardMode);
      });
    }

    const macroBarsMount = document.getElementById("hm-macro-bars");
    if (macroBarsMount) {
      macroBarsMount.addEventListener("click", (event) => {
        const target = event.target.closest("[data-macro-mode]");
        if (!target) return;
        // The card is a link to Nutrition -- without this, tapping the
        // toggle would also navigate away instead of just switching mode.
        event.preventDefault();
        event.stopPropagation();
        macroCardMode = target.dataset.macroMode;
        updateMacroCard();
      });
    }

    const macroFullStatsBtn = document.getElementById("hm-macro-full-stats");
    if (macroFullStatsBtn) {
      macroFullStatsBtn.addEventListener("click", (event) => {
        // Sits inside the card's own <a href="/nutrition"> -- without
        // this it would navigate there instead of the dedicated weekly
        // stats page.
        event.preventDefault();
        event.stopPropagation();
        window.location.href = "{{ url_for('nutrition_full_stats') }}";
      });
    }

    // ---------- Hero ----------
    function renderHero() {
      const dateEl = document.getElementById("hm-hero-date");
      if (!dateEl) return; // logged-out visitors have no hero

      const locale = RepCheckI18n.locale();
      dateEl.textContent = new Date().toLocaleDateString(locale, { weekday: "long", month: "long", day: "numeric" });

      const streak = computeStreak();
      document.getElementById("hm-streak-count").textContent = t("home.streakCount", { n: streak });
      document.getElementById("hm-streak-chip").classList.toggle("is-active", streak > 0);

      const titleEl = document.getElementById("hm-hero-title");
      const subEl = document.getElementById("hm-hero-sub");
      const ctaEl = document.getElementById("hm-hero-cta");
      const splitInfo = getTodaysSplitInfo();
      if (splitInfo) {
        titleEl.textContent = /day$/i.test(splitInfo.label.trim())
          ? splitInfo.label
          : `${splitInfo.label} ${t("home.workouts.dayLabelSuffix")}`;
        subEl.textContent = t("home.hero.exercisesPlanned", { n: splitInfo.exercises.length });
        ctaEl.textContent = t("home.hero.cta");
      } else if (loadSplitPlan()) {
        titleEl.textContent = t("home.workouts.restDayTitle");
        subEl.textContent = t("home.workouts.restDaySub");
        ctaEl.textContent = t("home.hero.cta");
      } else {
        titleEl.textContent = t("home.hero.noPlanTitle");
        subEl.textContent = t("home.hero.noPlanSub");
        ctaEl.textContent = t("home.hero.ctaBuild");
      }

      // Monday-first week strip: today highlighted, past days with any
      // logged activity filled green.
      const todayIso = toIsoDate(new Date());
      const heroLetters = ["M", "T", "W", "T", "F", "S", "S"];
      const monday = new Date();
      monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
      document.getElementById("hm-hero-week").innerHTML = heroLetters.map((letter, i) => {
        const d = new Date(monday);
        d.setDate(d.getDate() + i);
        const iso = toIsoDate(d);
        const isToday = iso === todayIso;
        const active = !isToday && iso <= todayIso && hasActivityOn(iso);
        return `
          <div class="hm-hero-day ${isToday ? "is-today" : ""} ${active ? "has-activity" : ""}">
            <div class="hm-hero-day-letter">${letter}</div>
            <div class="hm-hero-day-num">${d.getDate()}</div>
          </div>
        `;
      }).join("");
    }

    // ---------- Weekly check-in banner (nutrition coaching) ----------
    // Mirrors static/coaching.js's checkinDaysRemaining(), read-only.
    // Only rendered when the check-in is actually READY -- a countdown
    // ("come back in N days") is noise, not information you can act on.
    function renderCheckinBanner() {
      const mount = document.getElementById("hm-checkin-banner");
      if (!mount) return;
      const profile = loadJson("repcheck_coaching_profile_v1", null);
      if (!profile) { mount.innerHTML = ""; return; }
      // Goal reached -- ready right now regardless of the normal cadence.
      // Mirrors coaching.js's own checkinDaysRemaining() override; see
      // that file's ACHIEVED_KEY comment for why this flag exists.
      const achieved = loadJson("repcheck_coaching_goal_achieved_v1", null);
      if (!achieved) {
        const lastCheck = profile.lastAdjustmentDate || profile.createdAt;
        let daysSince = Infinity;
        if (lastCheck) {
          daysSince = Math.floor((new Date() - new Date(lastCheck + "T00:00:00")) / 86400000);
        }
        if (daysSince < 7) { mount.innerHTML = ""; return; }
      }
      mount.innerHTML = `
        <a class="hm-checkin-banner" href="{{ url_for('nutrition') }}?quick=checkin">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>${t("home.checkinReady")}</span>
          <span class="hm-checkin-banner-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </a>
      `;
    }

    function renderAll() {
      renderHero();
      renderCheckinBanner();
      renderMacroCard();
    }

    renderAll();
    document.addEventListener("repcheck:language-changed", renderAll);
    document.addEventListener("repcheck:units-changed", renderAll);
    // Fired by base.html's shared "Log weight" sheet right after a
    // successful save.
    document.addEventListener("repcheck:weight-logged", renderCheckinBanner);

    // ---------- Personalized greeting ----------
    // "Hey {first name} 👋" instead of the static page heading. The h1
    // normally carries data-i18n="page.home.heading", which applyI18n()
    // would stomp right back over this text on every language change --
    // so the attribute is removed and the greeting re-set through the
    // same language-changed event instead.
    const FIRST_NAME = {{ (current_user.name.split(' ')[0] if current_user else '') | tojson }};
    if (FIRST_NAME) {
      const headingEl = document.querySelector(".topbar h1");
      const setGreeting = () => { headingEl.textContent = t("home.greeting", { name: FIRST_NAME }); };
      headingEl.removeAttribute("data-i18n");
      setGreeting();
      document.addEventListener("repcheck:language-changed", setGreeting);
    }
  })();
</script>

{% endblock %}
