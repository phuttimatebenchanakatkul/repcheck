{% extends "base.html" %}

{% block title %}RepCheck - Weekly Stats{% endblock %}
{% block heading %}Weekly Stats{% endblock %}

{% block content %}
<!-- Full 7-day macro/calorie breakdown -- linked from the home page's
     "Calories & macros" card ("Full stats" pill), which itself only shows a
     single day's totals.

     This used to be the .pc-week-* component borrowed from nutrition.html's
     coaching card: a 4-row (calories/protein/fat/carbs) x 7-column grid of
     28 small vertical bars, with a Consumed/Remaining toggle, where the
     numbers on the right described ONLY whichever day you had tapped. So the
     page drew 28 bars and still made you tap seven times to read your week,
     while never answering what a weekly page is actually for: what did I
     average, how many days did I hit, and which days went wrong. It also
     labelled days "M T W T F S S" with no dates, so you couldn't tell which
     week you were looking at.

     Now: a summary strip (average + days on target), one calorie chart with
     the goal drawn on it, then every day listed with a real date, its exact
     numbers, its macro split and an on/under/over badge. Nothing is behind a
     tap, so there is no selection or mode state left to keep. -->

<a href="{{ url_for('nutrition') }}" class="fs-back" data-i18n="fullStats.backToNutrition">&larr; Back to Nutrition</a>

<div class="fs-head">
  <div class="fs-title" data-i18n="page.fullStats.heading">Weekly Stats</div>
  <div class="fs-sub" data-i18n="fullStats.sub">Calories &amp; macros for each day this week</div>
</div>

<div class="fs-strip" id="fs-strip"></div>

<div class="card fs-card">
  <div class="fs-sec" data-i18n="fullStats.caloriesThisWeek">Calories &middot; this week</div>
  <div id="fs-week-chart"></div>
</div>

<div class="fs-sec fs-sec-loose" data-i18n="fullStats.eachDay">Each day</div>
<div class="fs-daylist" id="fs-day-list"></div>

<style>
  .fs-back { display: inline-block; margin-bottom: 14px; font-size: 12px; font-weight: 700; color: var(--text-secondary); text-decoration: none; }
  .fs-back:hover { color: var(--text); }
  .fs-head { margin-bottom: 14px; }
  .fs-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .fs-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .fs-card { max-width: 560px; padding: 18px; }

  .fs-sec {
    font-size: 10px; font-weight: 800; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px;
  }
  .fs-sec-loose { max-width: 560px; margin-top: 20px; }

  /* Summary strip: the two numbers the old page never showed at all. Sits
     above the chart because "how did the week go" is the question this page
     exists to answer -- the chart is the supporting detail, not the lead. */
  .fs-strip { display: flex; gap: 10px; max-width: 560px; margin-bottom: 12px; }
  .fs-stat { flex: 1; background: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow); padding: 13px 14px; }
  .fs-stat-key { font-size: 9.5px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-secondary); }
  .fs-stat-value { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-top: 3px; }
  .fs-stat-unit { font-size: 10.5px; font-weight: 700; color: var(--text-secondary); }

  /* Chart: shape + goal only. Exact numbers live in the day list below, so
     printing them on the bars too would just say everything twice (which is
     what the old 0%/50%/100% axis did on the home card). */
  .fs-plot { position: relative; display: flex; gap: 6px; align-items: flex-end; height: 128px; }
  .fs-goal { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); pointer-events: none; }
  .fs-goal-label {
    position: absolute; right: 0; top: -15px;
    font-size: 9.5px; font-weight: 700; color: var(--text-secondary);
    background: var(--card-bg); padding: 0 4px;
  }
  .fs-col { flex: 1; height: 100%; display: flex; align-items: flex-end; }
  .fs-bar { display: block; width: 100%; border-radius: 4px 4px 2px 2px; background: var(--blue); transition: height 0.4s ease; }
  /* Today is usually a part-finished day, so a full-strength bar would read
     as a genuine shortfall next to the completed ones. */
  .fs-bar.is-today { opacity: 0.45; }
  .fs-days { display: flex; gap: 6px; margin-top: 7px; }
  .fs-day-letter { flex: 1; text-align: center; font-size: 10.5px; font-weight: 800; color: var(--text-secondary); }
  .fs-day-letter.is-today { color: var(--text); }

  /* Day list: one grouped card, hairline dividers, no per-row radius --
     matches the grouped-list treatment used on the nutrition search sheet. */
  .fs-daylist { max-width: 560px; background: var(--card-bg); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .fs-day { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-bottom: 1px solid var(--border); }
  .fs-day:last-child { border-bottom: none; }
  .fs-day.is-today { background: var(--sidebar-active); }
  .fs-day-date { width: 42px; flex-shrink: 0; }
  .fs-day-weekday { font-size: 9.5px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary); }
  .fs-day-num { font-size: 14px; font-weight: 800; letter-spacing: -0.02em; margin-top: 1px; }
  .fs-day-mid { flex: 1; min-width: 0; }
  .fs-day-kcal { font-size: 13px; font-weight: 800; letter-spacing: -0.01em; }
  .fs-day-kcal-unit { font-size: 10px; font-weight: 700; color: var(--text-secondary); }
  /* Segment widths are each macro's calorie contribution as a share of the
     DAY'S GOAL, not of that day's own intake -- so a light day renders a
     short bar. One glance gives both the split and how full the day was. */
  .fs-day-split { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--bg); margin-top: 5px; }
  .fs-day-split span { display: block; height: 100%; }
  /* Same tokens coaching.css's .pc-week-bar-* classes resolve to, declared
     locally so this page no longer has to pull in that whole stylesheet --
     it used to, purely for the .pc-week-* chart component that is now gone. */
  .fs-seg-protein { background: var(--red); }
  .fs-seg-fat { background: var(--amber); }
  .fs-seg-carbs { background: var(--green); }
  .fs-day-badge { flex-shrink: 0; font-size: 9.5px; font-weight: 800; padding: 4px 9px; border-radius: 999px; }
  .fs-badge-on { background: var(--green-bg); color: var(--green); }
  .fs-badge-under { background: var(--amber-bg); color: var(--amber); }
  .fs-badge-over { background: var(--red-bg); color: var(--red); }
  .fs-badge-none { background: var(--bg); color: var(--text-secondary); }
</style>

<script>
  (function () {
    const t = RepCheckI18n.t;

    function toIsoDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }
    function loadJson(key, fallback) {
      try {
        const parsed = JSON.parse(localStorage.getItem(key));
        return parsed === null || parsed === undefined ? fallback : parsed;
      } catch (err) { return fallback; }
    }

    const nutritionLog = loadJson("repcheck_nutrition_log_v1", {});
    const nutritionGoals = { protein: 150, fat: 65, carbs: 200, ...loadJson("repcheck_nutrition_goals_v1", {}) };

    function sumMacrosForDay(entries) {
      const totals = { protein: 0, fat: 0, carbs: 0 };
      if (!Array.isArray(entries)) return totals;
      entries.forEach((entry) => {
        const items = (entry.ingredients && entry.ingredients.length) ? entry.ingredients : [entry];
        items.forEach((item) => {
          const scale = item.grams / 100;
          totals.protein += item.baseProtein * scale;
          totals.fat += item.baseFat * scale;
          totals.carbs += item.baseCarbs * scale;
        });
      });
      return totals;
    }

    // A day counts as "on target" within this fraction of the calorie goal.
    // Hitting a macro goal to the calorie is not a thing anyone does, so a
    // strict equality check would report 0/7 every week and teach the user
    // to ignore the number.
    const ON_TARGET_TOLERANCE = 0.10;

    function startOfWeekMonday(date) {
      const d = new Date(date);
      const diff = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - diff);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function goalCalories() {
      return Math.round(nutritionGoals.protein * 4 + nutritionGoals.fat * 9 + nutritionGoals.carbs * 4);
    }

    function weekDays() {
      const todayIso = toIsoDate(new Date());
      const weekStart = startOfWeekMonday(new Date());
      const locale = RepCheckI18n.locale();
      return Array.from({ length: 7 }, (_, i) => {
        const d = new Date(weekStart);
        d.setDate(d.getDate() + i);
        const dateIso = toIsoDate(d);
        const eaten = sumMacrosForDay(nutritionLog[dateIso]);
        const protein = Math.round(eaten.protein);
        const fat = Math.round(eaten.fat);
        const carbs = Math.round(eaten.carbs);
        const calories = Math.round(eaten.protein * 4 + eaten.fat * 9 + eaten.carbs * 4);
        return {
          dateIso, date: d, calories, protein, fat, carbs,
          isToday: dateIso === todayIso,
          // "Logged" means the day has entries, not that calories > 0 -- a
          // day of pure-water fasting is a real logged day, and averaging it
          // away would quietly flatter the weekly average.
          hasData: Array.isArray(nutritionLog[dateIso]) && nutritionLog[dateIso].length > 0,
          letter: d.toLocaleDateString(locale, { weekday: "narrow" }),
          weekday: d.toLocaleDateString(locale, { weekday: "short" }),
          dayNum: d.getDate(),
        };
      });
    }

    function renderStrip(days, goal) {
      const mount = document.getElementById("fs-strip");
      if (!mount) return;
      const logged = days.filter((d) => d.hasData);
      // Average across LOGGED days only. Dividing by 7 mid-week would report
      // an average nobody ate, and would drop every time the user opened the
      // page early in the week -- which reads as a bug, not a stat.
      const avg = logged.length ? Math.round(logged.reduce((s, d) => s + d.calories, 0) / logged.length) : null;
      const onTarget = logged.filter((d) => Math.abs(d.calories - goal) <= goal * ON_TARGET_TOLERANCE).length;
      const locale = RepCheckI18n.locale();
      mount.innerHTML = `
        <div class="fs-stat">
          <div class="fs-stat-key">${t("fullStats.dailyAvg")}</div>
          <div class="fs-stat-value">${avg === null ? "—" : avg.toLocaleString(locale)}<span class="fs-stat-unit"> kcal</span></div>
        </div>
        <div class="fs-stat">
          <div class="fs-stat-key">${t("fullStats.daysOnTarget")}</div>
          <div class="fs-stat-value">${onTarget}<span class="fs-stat-unit">/${logged.length} ${t("fullStats.daysLogged")}</span></div>
        </div>
      `;
    }

    function renderChart(days, goal) {
      const mount = document.getElementById("fs-week-chart");
      if (!mount) return;
      // Scale to whichever is taller, the biggest day or the goal, so the
      // goal line is always on the canvas and an over-goal day still fits.
      const peak = Math.max(goal, ...days.map((d) => d.calories));
      const scale = peak > 0 ? peak * 1.08 : 1;
      const locale = RepCheckI18n.locale();
      mount.innerHTML = `
        <div class="fs-plot">
          <div class="fs-goal" style="bottom:${(goal / scale) * 100}%;">
            <span class="fs-goal-label">${t("fullStats.goalLine", { n: goal.toLocaleString(locale) })}</span>
          </div>
          ${days.map((d) => `
            <div class="fs-col">
              <span class="fs-bar ${d.isToday ? "is-today" : ""}" style="height:${(d.calories / scale) * 100}%;"></span>
            </div>
          `).join("")}
        </div>
        <div class="fs-days">
          ${days.map((d) => `<span class="fs-day-letter ${d.isToday ? "is-today" : ""}">${d.letter}</span>`).join("")}
        </div>
      `;
    }

    function dayBadge(day, goal) {
      if (!day.hasData) return { cls: "fs-badge-none", text: t("fullStats.noData") };
      const diff = day.calories - goal;
      if (Math.abs(diff) <= goal * ON_TARGET_TOLERANCE) return { cls: "fs-badge-on", text: t("fullStats.onTarget") };
      const locale = RepCheckI18n.locale();
      const n = Math.abs(diff).toLocaleString(locale);
      return diff < 0
        ? { cls: "fs-badge-under", text: `−${n}` }
        : { cls: "fs-badge-over", text: `+${n}` };
    }

    function renderDayList(days, goal) {
      const mount = document.getElementById("fs-day-list");
      if (!mount) return;
      const locale = RepCheckI18n.locale();
      mount.innerHTML = days.map((d) => {
        const badge = dayBadge(d, goal);
        const pct = (kcal) => (goal > 0 ? Math.max(0, Math.min(100, (kcal / goal) * 100)) : 0);
        return `
          <div class="fs-day ${d.isToday ? "is-today" : ""}">
            <div class="fs-day-date">
              <div class="fs-day-weekday">${d.isToday ? t("fullStats.today") : d.weekday}</div>
              <div class="fs-day-num">${d.dayNum}</div>
            </div>
            <div class="fs-day-mid">
              <div class="fs-day-kcal">${d.calories.toLocaleString(locale)} <span class="fs-day-kcal-unit">kcal</span></div>
              <div class="fs-day-split">
                <span class="fs-seg-protein" style="width:${pct(d.protein * 4)}%;"></span>
                <span class="fs-seg-fat" style="width:${pct(d.fat * 9)}%;"></span>
                <span class="fs-seg-carbs" style="width:${pct(d.carbs * 4)}%;"></span>
              </div>
            </div>
            <span class="fs-day-badge ${badge.cls}">${badge.text}</span>
          </div>
        `;
      }).join("");
    }

    function renderAll() {
      const goal = goalCalories();
      const days = weekDays();
      renderStrip(days, goal);
      renderChart(days, goal);
      renderDayList(days, goal);
    }

    renderAll();
    document.addEventListener("repcheck:language-changed", renderAll);
    document.addEventListener("repcheck:units-changed", renderAll);
  })();
</script>
{% endblock %}
